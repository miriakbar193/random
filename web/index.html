<!DOCTYPE html>
<html lang="az" xmlns:mso="urn:schemas-microsoft-com:office:office" xmlns:msdt="uuid:C2F41010-65B3-11d1-A29F-00AA00C14882">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nazir Paneli · Kənd Təsərrüfatı Nazirliyi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --kt-dark:#0E462A; --kt-green:#0FA54F; --kt-mid:#6BC182; --kt-light:#B1D3BE;
  --kt-grey:#AAAAAA; --kt-grey-l:#DFDFDF;
  --az-blue:#0DB9E7; --az-red:#EE2634; --az-green:#389F47;
  --ink:#12281E; --ink-2:#4A5C53; --ink-3:#7B8B83;
  --bg:#F4F6F4; --surface:#FFFFFF; --line:#E4E9E5;
  --up:#0FA54F; --down:#D0342C; --warn:#E08A15;
  --pri-critical:#C42B22; --pri-high:#E08A15; --pri-medium:#0D8FB8; --pri-low:#0B6B33;
  --r:10px; --sh:0 1px 2px rgba(14,70,42,.06), 0 4px 14px rgba(14,70,42,.05);
  --sh-2:0 2px 6px rgba(14,70,42,.08), 0 10px 30px rgba(14,70,42,.08);
  --sbw:266px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI","Noto Sans",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.01em}
a{color:var(--kt-dark); text-decoration:none}
button{font-family:inherit}
::selection{background:var(--kt-light)}

/* ---------- SIDEBAR ---------- */
#sb{
  position:fixed; inset:0 auto 0 0; width:var(--sbw); z-index:60;
  background:linear-gradient(168deg,#0E462A 0%,#0B3A22 52%,#082C1A 100%);
  display:flex; flex-direction:column; overflow:hidden;
}
#sb::after{
  content:""; position:absolute; right:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg,var(--az-blue) 0 33%,var(--az-red) 33% 66%,var(--az-green) 66% 100%);
  opacity:.85;
}
.sb-brand{padding:20px 18px 16px; display:flex; gap:12px; align-items:center; border-bottom:1px solid rgba(255,255,255,.09)}
.sb-brand img{width:44px; height:44px; object-fit:contain; filter:brightness(0) invert(1); opacity:.96}
.sb-brand .bt{color:#fff; font-size:12.5px; font-weight:600; line-height:1.32; letter-spacing:.01em}
.sb-brand .bs{color:var(--kt-mid); font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; margin-top:3px}

.sb-user{padding:14px 18px; display:flex; gap:11px; align-items:center; border-bottom:1px solid rgba(255,255,255,.09)}
.sb-user .av{
  width:38px;height:38px;border-radius:50%;flex:0 0 38px;
  background:linear-gradient(140deg,var(--kt-green),#0a7a3a);
  color:#fff;font-weight:600;font-size:14px;display:grid;place-items:center;
  box-shadow:0 0 0 2px rgba(255,255,255,.14)
}
.sb-user .un{color:#fff;font-size:13px;font-weight:600}
.sb-user .ur{color:var(--kt-mid);font-size:11px}

.sb-nav{flex:1 1 auto; overflow-y:auto; padding:12px 10px 20px}
.sb-nav::-webkit-scrollbar{width:6px}
.sb-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16); border-radius:3px}
.sb-lbl{color:rgba(177,211,190,.62); font-size:9.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.13em; padding:14px 12px 7px}
.nv{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 12px; margin:1px 0; border:0; border-radius:8px; cursor:pointer;
  background:transparent; color:rgba(255,255,255,.82); font-size:13px; transition:.14s;
}
.nv:hover{background:rgba(255,255,255,.09); color:#fff}
.nv.on{background:var(--kt-green); color:#fff; font-weight:600; box-shadow:0 2px 10px rgba(15,165,79,.35)}
.nv .ic{width:16px; height:16px; flex:0 0 16px; opacity:.9}
.nv .bdg{margin-left:auto; background:rgba(255,255,255,.18); font-size:10px; font-weight:700;
  padding:1px 6px; border-radius:9px}
.nv.on .bdg{background:rgba(0,0,0,.22)}
.nv.ext{font-size:12.4px; color:rgba(255,255,255,.7); padding:7px 12px}
.nv.ext:hover{color:#fff}
.nv.ext .ar{margin-left:auto; opacity:.5; font-size:11px}
.nv.grp .chev{margin-left:7px; opacity:.55; font-size:14px; line-height:1; transition:transform .2s}
.nv.grp.open .chev{transform:rotate(90deg)}
.sb-sub{overflow:hidden; max-height:0; transition:max-height .28s ease;
  margin:2px 0 2px 13px; border-left:1px solid rgba(255,255,255,.14)}
.sb-sub.open{max-height:760px}
.sb-sub .nv{font-size:12.3px; padding:7px 10px 7px 13px; margin:0; border-radius:0 8px 8px 0;
  color:rgba(255,255,255,.72); line-height:1.3}
.sb-sub .nv .ic{font-size:10px; opacity:.75}
.sb-foot{padding:12px 18px; border-top:1px solid rgba(255,255,255,.09); color:rgba(177,211,190,.6); font-size:10.5px}

/* ---------- TOPBAR ---------- */
#tb{
  position:fixed; top:0; left:var(--sbw); right:0; height:60px; z-index:55;
  background:rgba(255,255,255,.93); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 24px;
}
#tb .crumb{font-size:12px; color:var(--ink-3)}
#tb .crumb b{color:var(--ink); font-weight:600; font-size:15px; display:block; letter-spacing:-.015em}
#tb .sp{flex:1}
.clock{text-align:right; font-size:11px; color:var(--ink-3); line-height:1.35}
.clock b{display:block; color:var(--ink); font-size:13px; font-weight:600; font-variant-numeric:tabular-nums}
.lang{display:flex; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:2px}
.lang button{
  border:0; background:transparent; padding:5px 11px; border-radius:6px; cursor:pointer;
  font-size:11.5px; font-weight:600; color:var(--ink-2); letter-spacing:.03em; transition:.14s;
}
.lang button:hover{color:var(--kt-dark)}
.lang button.on{background:var(--kt-dark); color:#fff}
.btn{
  display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); padding:8px 13px; border-radius:8px;
  font-size:12.5px; font-weight:600; cursor:pointer; transition:.14s; white-space:nowrap;
}
.btn:hover{border-color:var(--kt-mid); background:#F7FBF8}
.btn.pri{background:var(--kt-green); border-color:var(--kt-green); color:#fff}
.btn.pri:hover{background:#0d9245; border-color:#0d9245}
.btn.sm{padding:5px 10px; font-size:11.5px}
.btn:disabled{opacity:.5; cursor:default; border-color:var(--line)}
.btn.pri:disabled{background:var(--kt-mid); border-color:var(--kt-mid)}
.btn .sync{width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%}
.btn.pri.busy .sync{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- LAYOUT ---------- */
#main{margin-left:var(--sbw); padding:60px 0 0}
.wrap{max-width:1560px; margin:0 auto; padding:22px 24px 60px}
.page{display:none; animation:fade .25s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0; transform:translateY(5px)}to{opacity:1;transform:none}}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh)}
.card-h{display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line)}
.card-h h3{font-size:13.5px}
.card-h .sub{font-size:11px; color:var(--ink-3); font-weight:400}
.card-h .sp{flex:1}
.card-b{padding:16px}
.card-b.tight{padding:0}

.grid{display:grid; gap:16px}
.g-2{grid-template-columns:repeat(2,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-6{grid-template-columns:repeat(6,1fr)}
.g-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.g-side{grid-template-columns:minmax(0,1fr) minmax(0,320px)}
@media(max-width:1360px){.g-6{grid-template-columns:repeat(3,1fr)}.g-4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1180px){.g-main,.g-side,.g-3,.g-2{grid-template-columns:1fr}}

.sec-t{display:flex; align-items:center; gap:10px; margin:26px 0 12px}
.sec-t h2{font-size:15.5px}
.sec-t .ln{flex:1; height:1px; background:var(--line)}
.sec-t .note{font-size:11px; color:var(--ink-3)}

/* ---------- HERO ---------- */
.hero{
  background:linear-gradient(122deg,#0E462A 0%,#115533 46%,#0a7a3a 100%);
  border-radius:var(--r); padding:22px 26px; color:#fff; position:relative; overflow:hidden;
  box-shadow:var(--sh-2);
}
.hero::before{
  content:""; position:absolute; right:-70px; top:-90px; width:340px; height:340px; border-radius:50%;
  background:radial-gradient(circle,rgba(107,193,130,.34),transparent 68%);
}
.hero::after{
  content:""; position:absolute; left:0; right:0; bottom:0; height:3px;
  background:linear-gradient(90deg,var(--az-blue) 0 33%,var(--az-red) 33% 66%,var(--az-green) 66% 100%);
}
.hero .hl{position:relative; z-index:1}
.hero .eyebrow{font-size:10.5px; text-transform:uppercase; letter-spacing:.14em; color:var(--kt-mid); font-weight:700}
.hero h1{font-size:22px; margin:7px 0 5px; letter-spacing:-.02em}
.hero p{margin:0; font-size:12.5px; color:rgba(255,255,255,.76); max-width:640px}
.hero .chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:14px}
.hero .chip{background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.16);
  padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600}
.hero .chip i{font-style:normal; color:var(--kt-mid)}

/* ---------- KPI ---------- */
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 15px;
  box-shadow:var(--sh); position:relative; overflow:hidden; transition:.16s}
.kpi:hover{box-shadow:var(--sh-2); transform:translateY(-1px)}
.kpi::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--kt-mid)}
.kpi.hi::before{background:var(--az-red)}
.kpi.md::before{background:var(--warn)}
.kpi .lb{font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.07em;
  font-weight:700; line-height:1.35; min-height:28px}
.kpi .vl{font-size:23px; font-weight:600; letter-spacing:-.03em; margin:5px 0 1px; font-variant-numeric:tabular-nums}
.kpi .vl small{font-size:12px; font-weight:600; color:var(--ink-2); letter-spacing:0}
.kpi .mt{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-3)}
.dl{font-weight:700; font-variant-numeric:tabular-nums}
.dl.up{color:var(--up)} .dl.dn{color:var(--down)} .dl.fl{color:var(--ink-3)}
.kpi .src{font-size:9.5px; color:var(--kt-grey); margin-top:7px; padding-top:7px; border-top:1px dashed var(--line)}
.tagi{display:inline-block; font-size:8.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
  padding:1px 5px; border-radius:3px; background:#FFF3DC; color:#8A5A08; vertical-align:middle; margin-left:5px}

/* ---------- NEWS ---------- */
.nf{max-height:562px; overflow-y:auto}
.nf::-webkit-scrollbar{width:7px}
.nf::-webkit-scrollbar-thumb{background:var(--kt-grey-l); border-radius:4px}
.ni{display:block; padding:13px 16px; border-bottom:1px solid var(--line); transition:.13s; position:relative}
.ni:hover{background:#F7FBF8}
.ni:hover .nt{color:var(--kt-green)}
.ni .nm{display:flex; align-items:center; gap:7px; margin-bottom:5px; flex-wrap:wrap}
.src-b{font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  padding:2px 6px; border-radius:3px; background:var(--kt-dark); color:#fff}
.src-b.g{background:#2C4C7A} .src-b.a{background:#5B3A8E}
.ni time{font-size:10.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.tg{font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:10px; background:#EEF4F0; color:var(--kt-dark);
  text-transform:uppercase; letter-spacing:.05em}
.ni .nt{font-size:13px; font-weight:600; line-height:1.4; color:var(--ink); transition:.13s}
.ni .no{font-size:11.5px; color:var(--ink-3); margin-top:2px; font-style:italic}
.ni .nd{font-size:11.5px; color:var(--ink-2); margin-top:5px; line-height:1.5}
.ni.pin{background:linear-gradient(90deg,#F2F9F4,transparent)}
.ni.pin::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--kt-green)}
.filt{display:flex; flex-wrap:wrap; gap:6px}
.filt button{border:1px solid var(--line); background:var(--surface); color:var(--ink-2); font-size:11px;
  font-weight:600; padding:4px 10px; border-radius:20px; cursor:pointer; transition:.13s}
.filt button:hover{border-color:var(--kt-mid)}
.filt button.on{background:var(--kt-dark); border-color:var(--kt-dark); color:#fff}

/* ---------- TABLES ---------- */
table{width:100%; border-collapse:collapse; font-size:12.5px}
th{text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3);
  font-weight:700; padding:9px 14px; border-bottom:1px solid var(--line); background:#FAFCFA; white-space:nowrap}
td{padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#F7FBF8}
.num{text-align:right; font-variant-numeric:tabular-nums}
.cm-n{font-weight:600}
.cm-s{font-size:10.5px; color:var(--ink-3)}
.spark{display:inline-block; vertical-align:middle}

/* ---------- ALERTS ---------- */
.al{display:flex; gap:12px; padding:13px 16px; border-bottom:1px solid var(--line)}
.al:last-child{border-bottom:0}
.al .sv{width:5px; border-radius:3px; flex:0 0 5px; background:var(--warn)}
.al.high .sv{background:var(--down)} .al.low .sv{background:var(--kt-mid)}
.al .at{font-size:12.5px; font-weight:600; line-height:1.35}
.al .ad{font-size:11.5px; color:var(--ink-2); margin-top:4px; line-height:1.5}
.al .ae{font-size:10.5px; color:var(--ink-3); margin-top:5px}
.sev{font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:2px 6px;
  border-radius:3px; background:#FDEBEA; color:#A5241D}
.sev.md{background:#FFF3DC; color:#8A5A08} .sev.lo{background:#EAF6EE; color:#0B6B33}

/* ---------- DECISIONS ---------- */
.dc{padding:14px 16px; border-bottom:1px solid var(--line)}
.dc:last-child{border-bottom:0}
.dc .dh{display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap}
.dc .dt{font-size:13px; font-weight:600; line-height:1.35}
.dc .rec{font-size:11.5px; margin-top:6px; padding:9px 11px; border-radius:7px; background:#F2F9F4;
  border-left:3px solid var(--kt-green); color:var(--ink)}
.dc .rec b{color:var(--kt-dark)}
.dc .ev{font-size:10.5px; color:var(--ink-3); margin-top:6px}
.dc .acts{display:flex; gap:7px; margin-top:10px}
.pri-b{font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:2px 7px;
  border-radius:3px; background:var(--kt-dark); color:#fff}
.pri-b.p2{background:var(--kt-mid); color:var(--kt-dark)}
.due{font-size:10.5px; color:var(--ink-3); margin-left:auto; font-variant-numeric:tabular-nums}

/* ---------- MAP ---------- */
#cmap{height:560px; border-radius:0 0 var(--r) var(--r); background:#E8EFE9; z-index:1}
.mleg{display:flex; flex-wrap:wrap; gap:5px 14px; padding:12px 16px; border-top:1px solid var(--line)}
.mleg span{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-2)}
.mleg i{width:11px; height:11px; border-radius:3px; display:inline-block; border:1px solid rgba(0,0,0,.12)}
.mctl{display:flex; flex-wrap:wrap; gap:6px; padding:12px 16px; border-bottom:1px solid var(--line); background:#FAFCFA}
.leaflet-popup-content-wrapper{border-radius:8px; box-shadow:var(--sh-2)}
.leaflet-popup-content{margin:11px 13px; font-family:inherit; font-size:12px}
.pp h4{font-size:13px; margin-bottom:6px; color:var(--kt-dark)}
.pp .r{display:flex; justify-content:space-between; gap:14px; padding:2.5px 0; font-size:11.5px}
.pp .r span:first-child{color:var(--ink-3)}
.pp .r span:last-child{font-weight:600; font-variant-numeric:tabular-nums}
#mapfb{display:none; padding:16px}

/* ---------- AI ---------- */
.ai-hero{background:linear-gradient(120deg,#0E462A,#0a7a3a); color:#fff; border-radius:var(--r);
  padding:20px 22px; box-shadow:var(--sh-2)}
.ai-hero h3{font-size:15px; margin-bottom:5px}
.ai-hero p{margin:0; font-size:12px; color:rgba(255,255,255,.75)}
.sugg{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
.sugg button{border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.09); color:rgba(255,255,255,.9);
  font-size:11px; padding:5px 11px; border-radius:20px; cursor:pointer; transition:.13s; font-weight:500}
.sugg button:hover{background:rgba(255,255,255,.2); color:#fff}
/* ---------- CHAT ---------- */
.chat-log{padding:16px; height:420px; overflow-y:auto; display:flex; flex-direction:column; gap:13px}
.chat-log::-webkit-scrollbar{width:7px}
.chat-log::-webkit-scrollbar-thumb{background:var(--kt-grey-l); border-radius:4px}
.msg{display:flex; gap:9px; max-width:86%}
.msg.u{align-self:flex-end; flex-direction:row-reverse}
.msg.a{align-self:flex-start}
.msg .av{width:26px; height:26px; flex:0 0 26px; border-radius:50%; display:grid; place-items:center;
  font-size:11px; font-weight:700; color:#fff; background:var(--kt-green)}
.msg.u .av{background:var(--kt-dark)}
.msg .bub{font-size:13px; line-height:1.6; padding:10px 13px; border-radius:11px;
  background:#F2F9F4; border:1px solid #DCEDE3; color:var(--ink)}
.msg.u .bub{background:var(--kt-dark); border-color:var(--kt-dark); color:#fff}
.msg .bub b{color:var(--kt-dark); font-weight:600}
.msg.u .bub b{color:#fff}
.msg .bub p{margin:0 0 8px} .msg .bub p:last-child{margin:0}
.msg .bub ul,.msg .bub ol{margin:6px 0; padding-left:19px} .msg .bub li{margin-bottom:4px}
.msg .cite{font-size:10.5px; color:var(--kt-grey); margin-top:9px; padding-top:8px;
  border-top:1px dashed var(--line)}
.msg .bub.err{background:#FFF6F5; border-color:#F3D2CE; color:#8A2018}
.chat-empty{margin:auto; text-align:center; color:var(--ink-3); font-size:12px; line-height:1.6; max-width:400px}
.chat-in{display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); align-items:flex-end}
.chat-in textarea{flex:1; resize:none; max-height:120px; border:1px solid var(--line); border-radius:8px;
  padding:10px 12px; font-size:13px; font-family:inherit; color:var(--ink); background:#FAFCFA; line-height:1.5}
.chat-in textarea:focus{outline:0; border-color:var(--kt-mid); background:#fff}
.typing{display:inline-flex; gap:3px}
.typing i{width:5px;height:5px;border-radius:50%;background:var(--kt-mid);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.28}30%{opacity:1}}

.brief{padding:16px}
.brief ol{margin:0; padding-left:20px}
.brief li{font-size:12.5px; line-height:1.6; margin-bottom:9px; color:var(--ink)}
.brief li b{color:var(--kt-dark)}
.brief li:last-child{margin-bottom:0}

/* ---------- SIM ---------- */
.sim{display:grid; grid-template-columns:minmax(0,300px) minmax(0,1fr); gap:0}
@media(max-width:1000px){.sim{grid-template-columns:1fr}}
.sim-in{padding:16px; border-right:1px solid var(--line); background:#FAFCFA}
@media(max-width:1000px){.sim-in{border-right:0; border-bottom:1px solid var(--line)}}
.fld{margin-bottom:17px}
.fld label{display:flex; justify-content:space-between; font-size:11.5px; font-weight:600; margin-bottom:7px}
.fld label b{color:var(--kt-green); font-variant-numeric:tabular-nums}
.fld .hint{font-size:10px; color:var(--ink-3); margin-top:4px; line-height:1.4}
input[type=range]{width:100%; -webkit-appearance:none; height:5px; border-radius:3px; background:var(--kt-grey-l)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:17px; height:17px; border-radius:50%;
  background:var(--kt-green); border:2.5px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.22); cursor:pointer}
select{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:7px; font-family:inherit;
  font-size:12.5px; background:var(--surface); color:var(--ink)}
.sim-out{padding:16px}
.res{display:grid; grid-template-columns:repeat(2,1fr); gap:11px; margin-bottom:15px}
@media(max-width:640px){.res{grid-template-columns:1fr}}
.res .rc{background:#F7FBF8; border:1px solid var(--line); border-radius:8px; padding:12px 13px}
.res .rl{font-size:10.5px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.06em; font-weight:700}
.res .rv{font-size:19px; font-weight:600; letter-spacing:-.025em; margin-top:4px; font-variant-numeric:tabular-nums}
.res .rd{font-size:10.5px; color:var(--ink-3); margin-top:2px}
.assum{font-size:10.5px; color:var(--ink-3); line-height:1.55; background:#FFFBF2; border:1px solid #F2E4C8;
  border-radius:7px; padding:10px 12px}
.assum b{color:#8A5A08}

/* ---------- DASH TILES ----------
   scoped to button.dt: the decision list also uses .dt for its title */
button.dt{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden;
  box-shadow:var(--sh); transition:.18s; display:block}
button.dt:hover{box-shadow:var(--sh-2); transform:translateY(-2px); border-color:var(--kt-mid)}
.dt .th{height:152px; background:#EEF2EF url() center/cover; position:relative; overflow:hidden}
.dt .th img{width:100%; height:100%; object-fit:cover; object-position:top left; transition:.4s}
.dt:hover .th img{transform:scale(1.045)}
.dt .th .ov{position:absolute; inset:auto 0 0 0; height:52%;
  background:linear-gradient(180deg,transparent,rgba(14,70,42,.72))}
.dt .th .lv{position:absolute; left:11px; bottom:9px; color:#fff; font-size:9.5px; font-weight:800;
  letter-spacing:.09em; text-transform:uppercase; opacity:.9}
.dt .tb{padding:12px 14px}
.dt .tt{font-size:13px; font-weight:600; line-height:1.35}
.dt .td{font-size:11.5px; color:var(--ink-3); margin-top:4px; line-height:1.45}
.dt .tf{display:flex; align-items:center; gap:6px; margin-top:9px; font-size:10.5px; color:var(--kt-green); font-weight:700}
.dt.soon{opacity:.72}
button.dt{font:inherit; color:inherit; text-align:left; width:100%; padding:0; cursor:pointer}

/* ---------- USE-CASE PAGES ---------- */
.uc-head{display:flex; gap:18px; align-items:flex-start; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh); padding:18px 20px}
.uc-head-t{flex:1; min-width:0}
.uc-head .eyebrow{font-size:10px; text-transform:uppercase; letter-spacing:.13em;
  color:var(--kt-green); font-weight:800}
.uc-head h2{font-size:18px; margin:7px 0 6px; letter-spacing:-.02em; line-height:1.25}
.uc-head p{margin:0; font-size:12.5px; color:var(--ink-2); line-height:1.55; max-width:760px}
.uc-shot{width:190px; height:110px; object-fit:cover; object-position:top left;
  border-radius:8px; border:1px solid var(--line); flex:0 0 auto}
.mock-b{margin-top:12px; font-size:10.5px; font-weight:600; color:var(--kt-dark);
  background:#F2F9F4; border:1px solid #CFE6D8; border-left:3px solid var(--kt-green);
  border-radius:7px; padding:9px 12px; line-height:1.5}
.uc-note{font-size:12.5px; line-height:1.6; color:var(--ink);
  border-left:3px solid var(--kt-green); padding-left:12px}
.uc-leg{display:flex; flex-wrap:wrap; gap:5px 14px; padding:11px 0 0}
.uc-leg span{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-2)}
.uc-leg i{width:9px; height:9px; border-radius:2px; display:inline-block; flex:0 0 9px}
@media(max-width:900px){.uc-shot{display:none} .uc-head{padding:15px 16px}}
.dt.soon .tf{color:var(--ink-3)}

/* ---------- eAgro REPLICA PAGES (use-case tabs) ----------
   Each use-case tab mirrors the layout of the real eAgro module:
   breadcrumb, filter bar, dark-green title band, map, weather strips. */
.eg{font-size:12.5px}
.eg-crumb{font-size:12px; color:var(--ink-2); margin:0 0 12px; display:flex; gap:8px; align-items:center}
.eg-crumb .lk{color:var(--kt-green); font-weight:600; cursor:pointer}
.eg-crumb .sep{color:var(--ink-3)}
.eg-sheet{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh); padding:16px 18px}
.eg-sheet.tight{padding:0; overflow:hidden}
.eg-band{background:#0B3D1F; color:#fff; font-weight:600; font-size:15px; padding:11px 16px; border-radius:6px; letter-spacing:.01em}
.eg-band.big{font-size:21px; text-transform:uppercase; letter-spacing:.02em; padding:13px 18px}
.eg-band.grey{background:#E9ECEA; color:#2C3B33; text-align:center; font-size:22px; font-weight:600}
.eg-filt{display:flex; flex-wrap:wrap; gap:12px 22px; align-items:flex-end; padding:10px 0 14px}
.eg-filt .f{display:flex; flex-direction:column; gap:4px; min-width:130px; flex:1 1 130px}
.eg-filt .f.w{flex:0 0 auto; min-width:0}
.eg-filt label{font-size:11px; font-weight:700; color:var(--ink)}
.eg-sel{border:1px solid #C7CFCA; background:#fff; border-radius:3px; padding:5px 8px; font-size:11.5px; color:var(--ink); font-family:inherit; width:100%}
.eg-logo{display:flex; align-items:center; gap:9px; background:#fff; border:1px solid var(--line); padding:7px 12px; border-radius:4px; width:max-content}
.eg-logo i{width:36px; height:36px; border-radius:50%; background:var(--kt-dark); display:grid; place-items:center; color:#fff; font-size:19px; font-style:normal}
.eg-logo span{font-size:9px; line-height:1.2; font-weight:700; text-transform:uppercase; color:var(--ink); letter-spacing:.02em; max-width:120px}
.eg-map{height:460px; width:100%; border-radius:6px; overflow:hidden; background:#DDE6DE; position:relative; z-index:0}
.eg-map.tall{height:560px}
.eg-map.sm{height:380px}
.eg-map.xs{height:300px}
.eg-lay{position:absolute; z-index:500; top:14px; left:14px; background:#fff; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,.2); padding:9px 14px; font-size:13px; display:flex; align-items:center; gap:10px; min-width:130px}
.eg-lay b{font-weight:500; flex:1}
.eg-leg{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:11px; color:var(--ink-2); padding-top:8px}
.eg-leg span{display:flex; align-items:center; gap:6px}
.eg-leg i{width:11px; height:11px; border-radius:2px; display:inline-block}
.eg-wp{margin-top:16px}
.eg-wp h3{font-size:14px; font-weight:600; padding:6px 0 12px; border-bottom:1px solid var(--line); margin-bottom:6px}
.eg-strip{display:grid; grid-template-columns:150px 1fr; align-items:center; gap:10px; padding:4px 0}
.eg-strip .lb{font-size:12px; font-weight:700; line-height:1.3}
.eg-strip .cb{position:relative; height:66px}
.eg-strip.h90 .cb{height:96px}
.eg-strip.h120 .cb{height:120px}
.eg-strip.side{grid-template-columns:34px 1fr; gap:4px; border-top:1px solid var(--line)}
.eg-strip.side .lb{writing-mode:vertical-rl; transform:rotate(180deg); font-size:9.5px; font-weight:400; color:var(--ink-2); text-align:center}
.eg-kbox{border:1px solid var(--line); background:#fff; border-radius:4px; overflow:hidden}
.eg-kbox .h{background:#0B3D1F; color:#fff; font-size:12px; font-weight:700; padding:6px 10px; text-align:center}
.eg-kbox .b{display:flex; justify-content:space-around; align-items:center; gap:6px; padding:9px 8px; font-size:12.5px; font-weight:700; color:#0B3D1F; text-align:center}
.eg-kbox .b small{display:block; font-weight:400; font-size:10px; color:var(--ink-3)}
.eg-kbox .b .ic{font-size:20px; opacity:.7}
.eg-panel{border:1px solid var(--line); border-radius:4px; background:#fff; overflow:hidden}
.eg-panel .h{background:#0B3D1F; color:#fff; font-size:12px; font-weight:700; padding:6px 10px}
.eg-panel .b{padding:8px 10px}
.eg-panel .cb{position:relative; height:150px}
.eg-panel .cb.t{height:210px}
.eg-grid{display:grid; gap:14px}
.eg-g2{grid-template-columns:1fr 1fr}
.eg-g3{grid-template-columns:repeat(3,1fr)}
.eg-g4{grid-template-columns:repeat(4,1fr)}
.eg-g5{grid-template-columns:repeat(5,1fr)}
.eg-g7{grid-template-columns:repeat(7,1fr)}
.eg-mapgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.eg-mapgrid.wide{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.eg-mapgrid.side{grid-template-columns:minmax(0,1fr) 210px}
.eg-h{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap}
.eg-h h2{font-size:17px; font-weight:600}
.eg-h .upd{font-size:10.5px; color:var(--ink-3); text-align:right}
.eg-h .upd b{display:block; font-size:12px; color:var(--ink); font-weight:600}
.eg-form{display:flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:4px; margin:12px 0}
.eg-form .c{padding:8px 14px; border-right:1px solid var(--line); flex:1 1 120px}
.eg-form .c:last-child{border-right:0}
.eg-form .k{font-size:10px; color:var(--ink-3)}
.eg-form .v{font-size:13px; font-weight:600}
.eg-sc{border:1px solid var(--line); border-radius:4px; padding:10px 12px; background:#fff}
.eg-sc .t{display:flex; justify-content:space-between; align-items:baseline; font-size:12.5px; font-weight:600}
.eg-sc .t b{font-size:20px}
.eg-sc .t small{font-size:10px; color:var(--ink-3); font-weight:400; margin-left:4px}
.eg-sc .cb{position:relative; height:190px}
.eg-sc h4{font-size:12px; font-weight:700; margin-bottom:6px}
.eg-sc .sub{font-size:10.5px; color:var(--ink-3); margin-bottom:6px}
.eg-tabs{display:flex; gap:2px; margin-bottom:6px}
.eg-tabs span{font-size:11px; padding:4px 12px; border:1px solid var(--line); border-bottom:0; border-radius:4px 4px 0 0; color:var(--ink-2); background:#F4F6F4}
.eg-tabs span.on{background:#fff; color:var(--ink); font-weight:600}
.eg-rows{display:flex; flex-direction:column; gap:8px; font-size:11.5px}
.eg-rows .r{display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center}
.eg-rows .r.v{grid-template-columns:1fr}
.eg-rows .bar{height:5px}
.eg-rows .bar i{background:#E08A15}
.eg-hbar{display:grid; grid-template-columns:44px 1fr; gap:6px; align-items:center; font-size:10.5px; margin:4px 0}
.eg-hbar .tr{height:11px; background:#EEF0EE; position:relative}
.eg-hbar .tr i{display:block; height:100%; width:var(--w)}
.eg-hbar .tr span{position:absolute; left:calc(var(--w) + 4px); top:-1px; font-size:10px; white-space:nowrap}
.eg-hbar.name{grid-template-columns:104px 1fr}
.eg-hbar.name .tr i{background:#1F4E9C}
.eg-hbar.name .tr span{color:#fff; left:auto; right:calc(100% - var(--w) + 4px); font-size:9px; top:0}
.eg-range{position:relative; height:30px; margin:16px 0 4px}
.eg-range .ln{position:absolute; left:0; right:0; top:11px; height:3px; background:#D5D9D6}
.eg-range .mk{position:absolute; top:5px; width:14px; height:14px; border-radius:50%; background:#fff; border:2px solid #444; transform:translateX(-50%)}
.eg-range .mk b{position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-size:9.5px}
.eg-range .lo,.eg-range .hi{position:absolute; top:-12px; font-size:10px; color:var(--ink-2)}
.eg-range .lo{left:0} .eg-range .hi{right:0}
.eg-range .lo2,.eg-range .hi2{position:absolute; top:18px; font-size:9px; color:var(--ink-3)}
.eg-range .lo2{left:0} .eg-range .hi2{right:0}
.eg-num{display:flex; gap:8px; align-items:flex-start; padding:8px 12px; border-right:1px solid var(--line); flex-wrap:wrap}
.eg-num:last-child{border-right:0}
.eg-num .v{font-size:16px; font-weight:600}
.eg-num .rk{color:#1F6FD1; font-weight:700; font-size:13px; margin-left:auto}
.eg-num .k{font-size:9.5px; color:var(--ink-3); line-height:1.3; flex:1 0 100%}
.eg-shapes{display:flex; gap:6px; align-items:flex-end; flex-wrap:wrap; padding:6px 0 18px}
.eg-shape{width:46px; height:34px; border-radius:40% 55% 45% 50%; position:relative; opacity:.92}
.eg-shape.on::after{content:'▲'; position:absolute; left:50%; bottom:-16px; transform:translateX(-50%); font-size:9px; color:var(--ink)}
.eg-cbar{display:flex; gap:2px; align-items:flex-end; height:26px; margin:6px 0 20px; position:relative}
.eg-cbar i{flex:1; height:100%; border-radius:1px; position:relative}
.eg-cbar i.on::after{content:'▲'; position:absolute; left:50%; bottom:-14px; transform:translateX(-50%); font-size:9px; color:var(--ink)}
.eg-sub{display:grid; grid-template-columns:104px 1fr 34px; gap:8px; align-items:center; font-size:10.5px; padding:6px 0; border-top:1px solid var(--line)}
.eg-sub.hd{font-weight:700; border-top:0; color:var(--ink-2)}
.eg-sub .dot{position:relative; height:18px}
.eg-sub .dot::before{content:''; position:absolute; left:0; right:0; top:6px; height:2px; background:#D5D9D6}
.eg-sub .dot i{position:absolute; top:2px; width:10px; height:10px; border-radius:50%; transform:translateX(-50%)}
.eg-sub .dot span{position:absolute; top:11px; font-size:8.5px; color:var(--ink-3); transform:translateX(-50%)}
.eg-sub .rk{text-align:right; font-weight:700}
.eg-risk{font-size:12px; line-height:1.5}
.eg-risk b{font-weight:700}
.eg-risk small{font-size:9.5px}
.eg-grad{display:flex; align-items:center; gap:6px; font-size:10px; color:var(--ink-2)}
.eg-grad i{width:120px; height:9px; display:inline-block; border-radius:2px}
.eg-dl{float:right; background:#0B3D1F; color:#fff; font-size:10px; padding:3px 10px; border-radius:3px}
.eg-chk{display:flex; align-items:center; gap:8px; font-size:11.5px; padding:5px 0}
.eg-chk i{font-style:normal; font-weight:800; width:14px}
.eg-chk i.y{color:#0FA54F} .eg-chk i.n{color:#D0342C}
.eg-chk b{margin-left:auto; font-weight:500; color:var(--ink-2)}
.eg-ring{width:46px; height:46px; border-radius:50%; border:3px solid #E08A15; display:grid; place-items:center; font-size:11px; font-weight:700}
.eg-crop{display:flex; gap:12px; padding:6px 0}
.eg-crop span{display:flex; flex-direction:column; align-items:center; font-size:9.5px; color:var(--ink-2); gap:3px}
.eg-crop span i{font-size:22px; font-style:normal}
.eg-ctl{display:flex; gap:6px; margin-bottom:6px}
.eg-ctl span{font-size:11px; padding:3px 9px; border-radius:3px; color:var(--ink-2)}
.eg-ctl span.on{color:#1F6FD1; font-weight:700}
.eg-head{display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; margin-bottom:10px}
.eg-rng{display:flex; align-items:center; gap:10px; font-size:11px; color:var(--ink-2); padding:6px 0}
.eg-rng i{flex:1; height:3px; background:#C7CFCA; position:relative}
.eg-rng i::before,.eg-rng i::after{content:''; position:absolute; top:-5px; width:12px; height:12px; border-radius:50%; background:#fff; border:1px solid #777}
.eg-rng i::before{left:0} .eg-rng i::after{right:0}
/* rating pages: in-bar value label, ranked-region strip, min/avg/max range rows */
.eg-hbar .tr span.in{color:#fff; left:auto; right:calc(100% - var(--w) + 4px)}
.eg-rk{display:flex; gap:5px; flex-wrap:wrap; padding:4px 0 6px}
.eg-rk div{flex:1 1 58px; min-width:0; text-align:center; font-size:9.5px; line-height:1.25; color:var(--ink-2)}
.eg-rk i{display:block; height:22px; border-radius:3px; margin-bottom:4px}
.eg-rk b{display:block; font-size:12px; color:var(--ink); font-weight:700}
.eg-rp{display:grid; grid-template-columns:auto 1fr auto; gap:7px 8px; align-items:center; font-size:10.5px; margin-top:10px}
.eg-rp .tr{height:11px; background:#EEF0EE; position:relative}
.eg-rp .tr i{display:block; height:100%; width:var(--w)}
.eg-rp .k{color:var(--ink-2); white-space:nowrap} .eg-rp .k small{display:block; font-size:9px; color:var(--ink-3); font-weight:400}
.eg-rp b{font-weight:700; min-width:18px; text-align:right}
@media(max-width:1360px){.eg-g7{grid-template-columns:repeat(4,1fr)} .eg-g5{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1180px){.eg-g4,.eg-g7,.eg-g5{grid-template-columns:repeat(2,1fr)} .eg-mapgrid,.eg-mapgrid.wide,.eg-mapgrid.side,.eg-g2,.eg-g3{grid-template-columns:1fr}}
@media(max-width:1000px){.eg-map,.eg-map.tall,.eg-map.sm{height:340px; min-height:320px} .eg-strip{grid-template-columns:1fr} .eg-band.big{font-size:16px} .eg-band.grey{font-size:17px}}
@media(max-width:640px){.eg-g4,.eg-g7,.eg-g5{grid-template-columns:1fr} .eg-sheet{padding:12px}}

/* ---------- MISC ---------- */
.mini{font-size:11px; color:var(--ink-3); line-height:1.55}
.bar{height:6px; border-radius:3px; background:var(--kt-grey-l); overflow:hidden}
.bar i{display:block; height:100%; border-radius:3px; background:var(--kt-green)}
.disc{font-size:10.5px; color:var(--ink-3); background:#FFFBF2; border:1px solid #F2E4C8; border-radius:8px;
  padding:11px 13px; line-height:1.55}
.disc b{color:#8A5A08}
.chartbox{position:relative; height:250px}
.chartbox.tall{height:300px}
.chartbox.donut{max-width:400px; margin:0 auto}
.tk{display:flex; gap:0; overflow:hidden; border-radius:var(--r); border:1px solid var(--line);
  background:var(--surface); box-shadow:var(--sh)}
.tk-t{display:flex; animation:mv 52s linear infinite; gap:0}
.tk:hover .tk-t{animation-play-state:paused}
@keyframes mv{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk-i{display:flex; align-items:center; gap:8px; padding:11px 20px; border-right:1px solid var(--line); white-space:nowrap}
.tk-i .n{font-size:11.5px; font-weight:600}
.tk-i .p{font-size:11.5px; font-variant-numeric:tabular-nums; color:var(--ink-2)}
.tk-i .d{font-size:11px; font-weight:700; font-variant-numeric:tabular-nums}
.empty{padding:30px 16px; text-align:center; color:var(--ink-3); font-size:12px}

/* ---------- SMALL SCREENS ----------
   The panel is read on a phone, so below 1000px the sidebar becomes a
   drawer over the content instead of a fixed 266px column. */
#navBtn{display:none; padding:7px 11px; font-size:15px; line-height:1}
#scrim{display:none; position:fixed; inset:0; z-index:58; background:rgba(8,44,26,.45)}
@media(max-width:1000px){
  #sb{transform:translateX(-100%); transition:transform .22s ease; box-shadow:var(--sh-2)}
  body.nav-on{overflow:hidden}
  body.nav-on #sb{transform:none}
  body.nav-on #scrim{display:block}
  #navBtn{display:inline-flex}
  #tb{left:0; padding:0 12px; gap:9px}
  #tb .sp{display:none}
  #tb .crumb{flex:1 1 auto; min-width:0}
  #tb .crumb b{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #main{margin-left:0}
  .wrap{padding:16px 14px 48px}
}
@media(max-width:640px){
  #tb{height:54px; padding:0 10px; gap:6px}
  #main{padding-top:54px}
  #tb .crumb>span{display:none}
  .clock{display:none}
  .lang button{padding:5px 8px}
  .btn{padding:7px 10px; font-size:12px}
  .wrap{padding:13px 11px 40px}
  .g-6{grid-template-columns:repeat(2,1fr)}
  .hero{padding:18px 16px} .hero h1{font-size:19px} .hero p{font-size:12px}
  .sec-t{margin:20px 0 10px}
  .card-h{padding:12px 13px; flex-wrap:wrap}
  .card-b{padding:13px}
  .kpi .vl{font-size:20px}
  .chartbox{height:230px}
  #cmap{height:400px}
  .chat-log{height:auto; min-height:270px; max-height:62vh}
  .msg{max-width:93%}
}
@media print{#sb,#tb,#scrim{display:none}#main{margin:0;padding:0}}

/* ---------- MEETINGS ---------- */
.mtg-list{display:flex; flex-direction:column}
.mtg{display:block; width:100%; text-align:left; border:0; background:transparent; cursor:pointer;
  padding:15px 16px; border-bottom:1px solid var(--line); transition:.13s; position:relative}
.mtg:last-child{border-bottom:0}
.mtg:hover{background:#F7FBF8}
.mtg::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent}
.mtg:hover::before{background:var(--kt-green)}
.mtg .mh{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.mtg .mt{font-size:13.5px; font-weight:600; line-height:1.35; color:var(--ink)}
.mtg:hover .mt{color:var(--kt-green)}
.mtg .mw{font-size:10.5px; color:var(--ink-3); margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap}
.mtg .mm{font-size:11px; color:var(--ink-2); margin-top:5px}
.mtg .mtags{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
.chp{font-size:9.5px; font-weight:700; padding:2px 8px; border-radius:10px; background:#EEF4F0; color:var(--kt-dark);
  text-transform:uppercase; letter-spacing:.05em; white-space:nowrap}
.mtg-open{margin-left:auto; font-size:11px; font-weight:600; color:var(--kt-green)}

.mtg-det{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:16px}
@media(max-width:1180px){.mtg-det{grid-template-columns:1fr}}
.tr{padding:2px 2px}
.tr .turn{padding:11px 0; border-bottom:1px solid var(--line)}
.tr .turn:last-child{border-bottom:0}
.tr .sp{font-size:11.5px; font-weight:700; color:var(--kt-dark); display:block; margin-bottom:3px}
.tr .sp small{font-weight:500; color:var(--ink-3); font-size:10.5px}
.tr .tx{font-size:12.5px; color:var(--ink); line-height:1.55}
.ai-side{display:flex; flex-direction:column; gap:14px}
.ai-sec .ai-t{display:flex; align-items:center; gap:7px; font-size:11px; font-weight:700; text-transform:uppercase;
  letter-spacing:.07em; color:var(--ink-3); margin:0 0 8px}
.ai-sec ul{margin:0; padding-left:17px}
.ai-sec ul li{font-size:12px; color:var(--ink); line-height:1.5; margin-bottom:6px}
.ai-badge{display:inline-flex; align-items:center; gap:5px; font-size:9px; font-weight:800; letter-spacing:.06em;
  text-transform:uppercase; padding:2px 8px; border-radius:20px; background:#F0EAFA; color:#5B3A8E}
.ai-badge::before{content:"✦"; font-size:10px}
.ppl{display:flex; flex-direction:column; gap:8px}
.ppl .pr{display:flex; gap:10px; align-items:flex-start}
.ppl .av{width:30px; height:30px; border-radius:50%; flex:0 0 30px; display:grid; place-items:center;
  background:linear-gradient(140deg,var(--kt-green),#0a7a3a); color:#fff; font-size:11px; font-weight:600}
.ppl .pn{font-size:12px; font-weight:600; color:var(--ink)}
.ppl .prole{font-size:10.5px; color:var(--ink-3)}
.ppl .powns{font-size:11px; color:var(--ink-2); margin-top:2px}

/* ---------- PRIORITY / CRITICALITY BADGES ---------- */
.cr-b{font-size:9px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; padding:2px 7px;
  border-radius:3px; background:var(--kt-dark); color:#fff; white-space:nowrap}
.cr-b.critical{background:#C42B22; color:#fff}
.cr-b.high{background:#E08A15; color:#fff}
.cr-b.medium{background:#0D8FB8; color:#fff}
.cr-b.low{background:#EAF6EE; color:#0B6B33}

/* ---------- KANBAN ---------- */
.kb-bar{display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end}
.kb-bar .fg{display:flex; flex-direction:column; gap:5px}
.kb-bar .fg>span{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3)}
.kb-board{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; align-items:start}
@media(max-width:1180px){.kb-board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.kb-board{grid-template-columns:1fr}}
.kb-col{background:#F1F5F2; border:1px solid var(--line); border-radius:var(--r); padding:10px; min-height:120px}
.kb-col .kb-ch{display:flex; align-items:center; gap:8px; padding:2px 4px 10px}
.kb-col .kb-ch b{font-size:12px; font-weight:700; color:var(--ink)}
.kb-col .kb-ch .cnt{margin-left:auto; background:#fff; border:1px solid var(--line); font-size:10.5px; font-weight:700;
  color:var(--ink-2); padding:1px 8px; border-radius:9px}
.kb-col .kb-dot{width:8px; height:8px; border-radius:50%; flex:0 0 8px}
.kb-col.todo .kb-dot{background:var(--kt-grey)} .kb-col.doing .kb-dot{background:var(--az-blue)}
.kb-col.blocked .kb-dot{background:var(--down)} .kb-col.done .kb-dot{background:var(--kt-green)}
.kb-empty{font-size:11px; color:var(--ink-3); text-align:center; padding:14px 0}
.kc{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:11px; margin-bottom:9px;
  box-shadow:var(--sh); position:relative; border-left:3px solid var(--kt-mid)}
.kc:last-child{margin-bottom:0}
.kc.critical{border-left-color:#C42B22} .kc.high{border-left-color:#E08A15}
.kc.medium{border-left-color:#0D8FB8} .kc.low{border-left-color:var(--kt-mid)}
.kc .kbadges{display:flex; flex-wrap:wrap; gap:5px; align-items:center; margin-bottom:7px}
.kc .kt{font-size:12px; font-weight:600; line-height:1.4; color:var(--ink)}
.kc .kmeta{font-size:10.5px; color:var(--ink-2); margin-top:7px; line-height:1.5}
.kc .kmeta b{color:var(--ink); font-weight:600}
.kc .ksrc{font-size:10px; color:var(--ink-3); margin-top:6px; padding-top:6px; border-top:1px dashed var(--line)}
.kc .ksrc.lk{cursor:pointer} .kc .ksrc.lk:hover{color:var(--kt-green)}
.kc .kfoot{display:flex; align-items:center; gap:6px; margin-top:9px}
.kc select{font-family:inherit; font-size:10.5px; font-weight:600; color:var(--ink-2); border:1px solid var(--line);
  background:var(--surface); border-radius:6px; padding:4px 6px; cursor:pointer; width:100%}
.kc select:hover{border-color:var(--kt-mid)}
.risk-i{display:inline-flex; align-items:center; gap:4px; font-size:9.5px; font-weight:700; color:var(--ink-3)}
.risk-i::before{content:""; width:7px; height:7px; border-radius:2px; background:var(--kt-mid)}
.risk-i.high::before{background:var(--down)} .risk-i.med::before{background:var(--warn)} .risk-i.low::before{background:var(--kt-mid)}

/* ---------- CALENDAR (day view + documents) ---------- */
.cal-bar{margin-bottom:16px; padding:12px 16px}
.cal-nav{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.cal-arrow{width:34px; height:34px; flex:0 0 34px; display:grid; place-items:center; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); border-radius:9px; color:var(--kt-dark);
  font-size:20px; line-height:1; transition:.13s}
.cal-arrow:hover{border-color:var(--kt-green); color:var(--kt-green); background:#F7FBF8}
.cal-date{min-width:210px; text-align:center}
.cal-wd{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3)}
.cal-dt{font-size:16px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
.cal-count{font-size:11px; font-weight:600; color:var(--ink-2); background:#EEF4F0; padding:4px 11px; border-radius:20px}
.cal-grid{display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:16px; align-items:start}
@media(max-width:1080px){.cal-grid{grid-template-columns:1fr}}

.cal-agenda{padding:6px 0}
.cal-empty{padding:44px 20px; text-align:center; color:var(--ink-3); font-size:12.5px}
.cal-empty .cal-empty-ic{font-size:30px; opacity:.4; margin-bottom:8px}
.cal-item{display:flex; gap:14px; width:100%; text-align:left; border:0; background:transparent; cursor:pointer;
  padding:14px 16px; border-bottom:1px solid var(--line); transition:.13s; position:relative}
.cal-item:last-child{border-bottom:0}
.cal-item:hover{background:#F7FBF8}
.cal-item::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:transparent}
.cal-item:hover::before{background:var(--kt-green)}
.cal-item.sel{background:#F1F8F3}
.cal-item.sel::before{background:var(--kt-green)}
.cal-time{flex:0 0 62px; font-size:12px; font-weight:700; color:var(--kt-dark); font-variant-numeric:tabular-nums;
  line-height:1.5; padding-top:1px}
.cal-time small{display:block; font-weight:500; color:var(--ink-3); font-size:10.5px}
.cal-body{flex:1 1 auto; min-width:0; border-left:3px solid var(--kt-mid); padding-left:12px}
.cal-body.critical{border-left-color:#C42B22} .cal-body.high{border-left-color:#E08A15}
.cal-body.medium{border-left-color:#0D8FB8} .cal-body.low{border-left-color:var(--kt-mid)}
.cal-body.none{border-left-color:var(--line)}
.cal-item-t{font-size:13.5px; font-weight:600; line-height:1.35; color:var(--ink)}
.cal-item:hover .cal-item-t{color:var(--kt-green)}
.cal-item-m{font-size:11px; color:var(--ink-2); margin-top:4px}
.cal-item-tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; align-items:center}
.cal-item-arrow{margin-left:auto; font-size:11px; font-weight:600; color:var(--kt-green); white-space:nowrap}

/* documents panel */
.cal-docs{padding:6px 0}
.cal-docs-empty{padding:40px 20px; text-align:center; color:var(--ink-3); font-size:12px}
.cal-docs-head{padding:2px 16px 12px; border-bottom:1px solid var(--line)}
.cal-docs-head .cdh-t{font-size:12.5px; font-weight:600; color:var(--ink); line-height:1.35}
.cal-docs-head .cdh-open{margin-top:10px}
.doc-row{display:flex; gap:12px; align-items:flex-start; padding:12px 16px; border-bottom:1px solid var(--line)}
.doc-row:last-child{border-bottom:0}
.doc-ic{flex:0 0 40px; width:40px; height:48px; border-radius:6px; display:grid; place-items:center;
  font-size:9px; font-weight:800; letter-spacing:.03em; color:#fff; background:var(--kt-mid); position:relative}
.doc-ic.pdf{background:#C42B22} .doc-ic.docx{background:#1D5BBF} .doc-ic.xlsx{background:#0B6B33}
.doc-meta{flex:1 1 auto; min-width:0}
.doc-t{font-size:12.5px; font-weight:600; color:var(--ink); line-height:1.35}
.doc-sub{font-size:10.5px; color:var(--ink-3); margin-top:4px; display:flex; flex-wrap:wrap; gap:5px; align-items:center}
.doc-type{font-size:9px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:2px 7px;
  border-radius:3px; background:#EEF4F0; color:var(--kt-dark)}
.doc-type.decree{background:#F6E9E8; color:#9E241D}
.doc-dot{color:var(--line)}
.doc-view{flex:0 0 auto; align-self:center; padding:5px 12px; font-size:11px}

/* document modal */
.doc-modal{position:fixed; inset:0; z-index:120; display:none}
.doc-modal.on{display:block}
.doc-scrim{position:absolute; inset:0; background:rgba(10,32,20,.5); backdrop-filter:blur(2px)}
.doc-dlg{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:min(640px,calc(100vw - 32px)); max-height:calc(100vh - 60px); display:flex; flex-direction:column;
  background:var(--surface); border-radius:12px; box-shadow:0 24px 60px rgba(0,0,0,.32); overflow:hidden}
.doc-dlg-h{display:flex; gap:13px; align-items:flex-start; padding:16px 18px; border-bottom:1px solid var(--line)}
.doc-dlg-ic{flex:0 0 44px; width:44px; height:54px; border-radius:6px; display:grid; place-items:center;
  font-size:10px; font-weight:800; color:#fff; background:var(--kt-mid)}
.doc-dlg-ic.pdf{background:#C42B22} .doc-dlg-ic.docx{background:#1D5BBF} .doc-dlg-ic.xlsx{background:#0B6B33}
.doc-dlg-tt{flex:1 1 auto; min-width:0}
.doc-dlg-kick{font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
.doc-dlg-tt h3{margin:3px 0 0; font-size:15px; line-height:1.3; color:var(--ink)}
.doc-dlg-meta{font-size:10.5px; color:var(--ink-3); margin-top:5px}
.doc-x{flex:0 0 30px; width:30px; height:30px; display:grid; place-items:center; cursor:pointer; border:0;
  background:#F1F5F2; border-radius:8px; font-size:20px; line-height:1; color:var(--ink-2); transition:.13s}
.doc-x:hover{background:#E3ECE6; color:var(--ink)}
.doc-dlg-b{padding:18px; overflow-y:auto; background:#FAFCFB}
.doc-page{background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:22px 24px;
  box-shadow:var(--sh); font-size:12.5px; line-height:1.65; color:var(--ink)}
.doc-page p{margin:0 0 12px} .doc-page p:last-child{margin:0}
.doc-dlg-f{padding:11px 18px; border-top:1px solid var(--line)}
.doc-dlg-f .disc{margin:0}

/* ---------- SHARE MODAL (share meeting outputs) ---------- */
.share-dlg{width:min(560px,calc(100vw - 32px))}
.share-ic{background:linear-gradient(140deg,var(--kt-green),#0a7a3a); font-size:20px}
.share-foot{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.share-foot .disc{margin:0; flex:1 1 180px; min-width:0}
.sh-sec{margin-bottom:18px}
.sh-sec:last-child{margin-bottom:0}
.sh-t{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-2); margin-bottom:9px}
.sh-hint{font-weight:500; text-transform:none; letter-spacing:0; color:var(--ink-3); font-size:10.5px}
.sh-recs{display:flex; flex-direction:column; gap:2px}
.sh-rec{display:flex; align-items:center; gap:10px; padding:7px 9px; border-radius:8px; cursor:pointer; transition:.12s}
.sh-rec:hover{background:#F7FBF8}
.sh-rec input{accent-color:var(--kt-green); width:15px; height:15px; flex:0 0 15px; cursor:pointer}
.sh-rec .av{width:28px; height:28px; border-radius:50%; flex:0 0 28px; display:grid; place-items:center;
  background:linear-gradient(140deg,var(--kt-green),#0a7a3a); color:#fff; font-size:10.5px; font-weight:600}
.sh-rec .av-x{background:#EEF4F0; color:var(--kt-dark); font-weight:800}
.sh-rn{display:flex; flex-direction:column; line-height:1.3; min-width:0}
.sh-rn b{font-size:12.5px; font-weight:600; color:var(--ink)}
.sh-rn small{font-size:10.5px; color:var(--ink-3)}
.sh-add{display:flex; gap:8px; margin-top:9px}
.sh-add input{flex:1 1 auto; min-width:0; font-family:inherit; font-size:12.5px; padding:8px 11px;
  border:1px solid var(--line); border-radius:8px; color:var(--ink); background:var(--surface)}
.sh-add input:focus{outline:none; border-color:var(--kt-mid); box-shadow:0 0 0 3px rgba(15,165,79,.12)}
.sh-opts{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.sh-opt{display:flex; align-items:center; gap:9px; padding:9px 11px; border:1px solid var(--line); border-radius:8px;
  cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink); transition:.12s}
.sh-opt:hover{border-color:var(--kt-mid); background:#F7FBF8}
.sh-opt input{accent-color:var(--kt-green); width:15px; height:15px; flex:0 0 15px; cursor:pointer}
.sh-opt:has(input:checked){border-color:var(--kt-green); background:#F1F8F3}
.sh-msg{width:100%; font-family:inherit; font-size:12.5px; padding:10px 12px; border:1px solid var(--line);
  border-radius:8px; color:var(--ink); background:var(--surface); resize:vertical; line-height:1.5}
.sh-msg:focus{outline:none; border-color:var(--kt-mid); box-shadow:0 0 0 3px rgba(15,165,79,.12)}
.sh-chan{display:flex; gap:8px}
.sh-ch{flex:1 1 0; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 12px;
  border:1px solid var(--line); background:var(--surface); border-radius:8px; cursor:pointer; font-family:inherit;
  font-size:12.5px; font-weight:600; color:var(--ink-2); transition:.13s}
.sh-ch:hover{border-color:var(--kt-mid); color:var(--kt-dark)}
.sh-ch.on{border-color:var(--kt-green); background:#F1F8F3; color:var(--kt-dark); box-shadow:0 0 0 3px rgba(15,165,79,.1)}
.sh-done{text-align:center; padding:26px 18px}
.sh-done-ic{width:54px; height:54px; border-radius:50%; margin:0 auto 14px; display:grid; place-items:center;
  background:linear-gradient(140deg,var(--kt-green),#0a7a3a); color:#fff; font-size:26px; font-weight:700;
  box-shadow:0 6px 18px rgba(15,165,79,.35)}
.sh-done-t{font-size:16px; font-weight:700; color:var(--ink); letter-spacing:-.01em}
.sh-done-sub{font-size:12px; color:var(--ink-2); margin-top:7px; max-width:380px; margin-left:auto; margin-right:auto; line-height:1.55}
.sh-done-meta{font-size:11px; color:var(--ink-3); margin-top:11px}
.sh-done-meta b{color:var(--kt-dark)}

/* ---------- TOAST ---------- */
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(16px); z-index:200;
  background:var(--kt-dark); color:#fff; font-size:12.5px; font-weight:600; padding:12px 20px; border-radius:10px;
  box-shadow:0 10px 30px rgba(8,44,26,.35); opacity:0; pointer-events:none; transition:opacity .22s, transform .22s;
  max-width:calc(100vw - 32px); display:flex; align-items:center; gap:9px}
.toast::before{content:"✓"; color:var(--kt-mid); font-weight:800}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}

/* ---------- DESIGN POLISH (task 2) ---------- */
.nv.on{position:relative}
.nv.on::before{content:""; position:absolute; left:-10px; top:6px; bottom:6px; width:3px; border-radius:0 3px 3px 0; background:var(--az-blue)}
.card{transition:box-shadow .16s}
.mtg-detbar{display:flex; align-items:center; gap:10px; margin-bottom:14px}
/* meeting detail: transcript readability + AI panel */
.tr .turn{display:flex; gap:11px}
.tr .turn::before{content:""; flex:0 0 3px; align-self:stretch; border-radius:3px; background:var(--kt-light)}
.tr .turn>div, .tr .turn>span{min-width:0}
.tr .turn .tx{flex:1 1 auto}
.tr .turn{flex-wrap:wrap}
.tr .sp{flex:1 1 100%}
.ai-sec{background:#FAFCFB; border:1px solid var(--line); border-radius:9px; padding:12px 13px}
.ai-side .card-b{display:flex; flex-direction:column; gap:12px}
.ai-side .card-b hr{display:none}
.ai-sec .ai-t{margin-bottom:9px; color:var(--kt-dark)}
.ai-todos{list-style:none; padding-left:0 !important; margin:0}
.ai-todos li{margin:0 0 8px; padding:9px 11px; background:var(--surface); border:1px solid var(--line);
  border-radius:8px; border-left:3px solid var(--kt-mid); line-height:1.45}
.ai-todos li:last-child{margin-bottom:0}
.ai-todos li.critical{border-left-color:var(--pri-critical)} .ai-todos li.high{border-left-color:var(--pri-high)}
.ai-todos li.medium{border-left-color:var(--pri-medium)} .ai-todos li.low{border-left-color:var(--kt-mid)}
.ai-todo-t{font-size:12px; font-weight:600; color:var(--ink); margin:6px 0 5px; line-height:1.4}
.ai-todo-h{display:flex; flex-wrap:wrap; gap:5px; align-items:center}
.ai-todo-m{font-size:10.5px; color:var(--ink-3)}
/* kanban card hover lift + tighter column headers */
.kc{transition:box-shadow .15s, transform .15s}
.kc:hover{box-shadow:var(--sh-2); transform:translateY(-1px)}
.kb-col .kb-ch{border-bottom:1px solid var(--line); margin-bottom:9px}
.kb-col.todo{border-top:2px solid var(--kt-grey)} .kb-col.doing{border-top:2px solid var(--az-blue)}
.kb-col.blocked{border-top:2px solid var(--down)} .kb-col.done{border-top:2px solid var(--kt-green)}
/* calendar polish */
.cal-item.sel{box-shadow:inset 0 0 0 1px rgba(15,165,79,.25)}
.doc-row{transition:.12s} .doc-row:hover{background:#F7FBF8}

/* ---------- STANDALONE ENTRY (HUB) MODE ----------
   When the entry chooser is active the whole dashboard chrome is hidden and
   the page becomes a clean full-screen splash on the KTN dark-green brand. */
body.hub-mode{background:linear-gradient(168deg,#0E462A 0%,#0B3A22 52%,#082C1A 100%)}
body.hub-mode #sb,
body.hub-mode #tb,
body.hub-mode #scrim,
body.hub-mode #navBtn{display:none !important}
body.hub-mode #main{margin-left:0; padding:0}
body.hub-mode .wrap{max-width:none; margin:0; padding:0}
.sb-brand[data-go]{cursor:pointer}
.sb-brand[data-go]:hover{background:rgba(255,255,255,.05)}

.entry{min-height:100vh; width:100%; display:flex; flex-direction:column}
.entry-top{display:flex; align-items:center; gap:14px; padding:24px clamp(20px,5vw,48px) 8px}
.entry-brand{display:flex; align-items:center; gap:12px}
.entry-brand img{width:40px; height:40px; object-fit:contain; filter:brightness(0) invert(1); opacity:.97}
.entry-brand .eb-t{color:#fff; font-size:13px; font-weight:600; line-height:1.3}
.entry-brand .eb-s{color:var(--kt-mid); font-size:10px; text-transform:uppercase; letter-spacing:.12em; margin-top:2px}
.entry-lang{margin-left:auto; background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.16)}
.entry-lang button{color:rgba(255,255,255,.82)}

/* ---------- ENTRY HUB + BUCKETS ---------- */
.hub-hero h1{font-size:24px}
.hub-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:18px}
.hub-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--sh); overflow:hidden; text-align:left; width:100%; padding:0; cursor:pointer;
  font:inherit; color:inherit; display:flex; flex-direction:column; transition:.16s}
.hub-card:hover{box-shadow:var(--sh-2); transform:translateY(-2px); border-color:var(--kt-mid)}
.hub-card .hc-top{height:120px; position:relative; display:grid; place-items:center; overflow:hidden;
  background:linear-gradient(140deg,#0E462A 0%,#115533 55%,#0a7a3a 100%)}
.hub-card .hc-top::after{content:""; position:absolute; right:-46px; top:-56px; width:190px; height:190px;
  border-radius:50%; background:radial-gradient(circle,rgba(107,193,130,.4),transparent 68%)}
.hub-card .hc-ic{font-size:44px; color:#fff; position:relative; z-index:1; line-height:1}
.hub-card .hc-b{padding:16px 18px 18px; display:flex; flex-direction:column; flex:1}
.hub-card .hc-t{font-size:15.5px; font-weight:700; letter-spacing:-.01em}
.hub-card .hc-d{font-size:12px; color:var(--ink-3); margin-top:6px; line-height:1.5; flex:1}
.hub-card .hc-cta{margin-top:14px; display:inline-flex; align-items:center; gap:7px; align-self:flex-start;
  border:1px dashed var(--kt-green); color:var(--kt-green); font-weight:700; font-size:11.5px;
  padding:7px 14px; border-radius:8px; transition:.14s}
.hub-card:hover .hc-cta{background:var(--kt-green); color:#fff; border-style:solid}
.hub-card .hc-tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:11px}
.hub-card .hc-tag{font-size:9.5px; font-weight:700; color:var(--ink-3); background:var(--bg);
  border:1px solid var(--line); border-radius:12px; padding:2px 8px}

.bk-bar{margin-bottom:14px}
.bk-hero h1{font-size:20px}
.bk-hero.b2{background:linear-gradient(122deg,#0b3a6b 0%,#0d5a86 46%,#0DB9E7 100%)}
.bk-hero.b3{background:linear-gradient(122deg,#5a3a08 0%,#8A5A08 46%,#E08A15 100%)}
.subhub-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:18px}
.blink{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh);
  text-align:left; width:100%; padding:15px 16px; cursor:pointer; font:inherit; color:inherit;
  display:flex; flex-direction:column; transition:.16s}
.blink:hover{box-shadow:var(--sh-2); transform:translateY(-1px); border-color:var(--kt-mid)}
.blink.feat{border-color:var(--kt-green); box-shadow:0 0 0 1px rgba(15,165,79,.25),var(--sh)}
.blink .bl-h{display:flex; align-items:center; gap:10px}
.blink .bl-ic{width:34px; height:34px; flex:0 0 34px; border-radius:9px; display:grid; place-items:center;
  background:#EAF6EE; color:var(--kt-dark); font-size:17px}
.blink.feat .bl-ic{background:var(--kt-green); color:#fff}
.blink .bl-t{font-size:13.5px; font-weight:700; line-height:1.3}
.blink .bl-d{font-size:11.5px; color:var(--ink-3); margin-top:9px; line-height:1.5; flex:1}
.blink .bl-f{margin-top:11px; font-size:10.5px; font-weight:700; color:var(--kt-green)}

/* ---------- MEETING PRIORITISATION ---------- */
.prio-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:7px 0 5px}
.prio-head h1{font-size:22px; letter-spacing:-.02em}
.prio-opt{margin-left:auto}
.prio-opt.done{background:#0d9245; border-color:#0d9245}
.prio-brief{margin-top:16px}
.eis{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.eis-q{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh);
  padding:13px 14px; min-height:118px; position:relative}
.eis-q::before{content:""; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:2px}
.eis-q.q-iu::before{background:var(--pri-critical)}
.eis-q.q-inu::before{background:var(--kt-green)}
.eis-q.q-niu::before{background:var(--warn)}
.eis-q.q-ninu::before{background:var(--ink-3)}
.eis-q .eq-h{display:flex; align-items:center; gap:8px; font-size:11px; font-weight:800; text-transform:uppercase;
  letter-spacing:.06em; color:var(--ink-2); padding-left:8px}
.eis-q .eq-h .cnt{margin-left:auto; background:var(--bg); border:1px solid var(--line); border-radius:10px;
  font-size:10px; font-weight:700; padding:0 7px; color:var(--ink-3)}
.eis-q .eq-body{display:flex; flex-direction:column; gap:7px; margin-top:11px; padding-left:8px}
.eis-chip{display:flex; align-items:center; gap:8px; width:100%; text-align:left; cursor:pointer;
  border:1px solid var(--line); border-left-width:4px; border-radius:8px; background:var(--surface);
  padding:7px 10px; font:inherit; color:inherit; transition:.14s}
.eis-chip:hover{background:#F7FBF8; border-color:var(--kt-mid)}
.eis-chip.critical{border-left-color:var(--pri-critical)}
.eis-chip.high{border-left-color:var(--pri-high)}
.eis-chip.medium{border-left-color:var(--pri-medium)}
.eis-chip.low{border-left-color:var(--pri-low)}
.eis-chip .ec-tm{font-size:10.5px; font-weight:700; color:var(--ink-3); font-variant-numeric:tabular-nums; flex:0 0 auto}
.eis-chip .ec-t{font-size:12px; font-weight:600; line-height:1.3; overflow:hidden}
.eis-q .eq-empty{padding-left:8px; margin-top:12px; color:var(--ink-3); font-size:11.5px}

.agn{display:flex; flex-direction:column; gap:10px}
.agn-row{display:grid; grid-template-columns:66px 1fr; gap:14px; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh); overflow:hidden;
  text-align:left; width:100%; padding:0; cursor:pointer; font:inherit; color:inherit; transition:.16s}
.agn-row:hover{box-shadow:var(--sh-2); border-color:var(--kt-mid)}
.agn-row .ag-time{background:var(--bg); border-right:1px solid var(--line); padding:14px 8px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px}
.agn-row .ag-time b{font-size:14px; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.agn-row .ag-time small{font-size:10px; color:var(--ink-3)}
.agn-row .ag-b{padding:13px 15px 14px}
.agn-row .ag-top{display:flex; align-items:flex-start; gap:10px}
.agn-row .ag-t{font-size:13.5px; font-weight:700; line-height:1.3; flex:1}
.agn-row .ag-sum{font-size:12px; color:var(--ink-2); margin-top:6px; line-height:1.5}
.agn-row .ag-foot{display:flex; align-items:center; gap:14px; margin-top:10px; flex-wrap:wrap}
.agn-row .ag-dlg{display:flex; align-items:center; gap:7px; font-size:11px; color:var(--ink-3)}
.agn-row .ag-dlg .av{width:22px; height:22px; flex:0 0 22px; border-radius:50%; font-size:9px; font-weight:700;
  color:#fff; display:grid; place-items:center; background:linear-gradient(140deg,var(--kt-green),#0a7a3a)}
.agn-row .ag-dlg b{color:var(--ink-2); font-weight:600}
.rdy{display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:800; letter-spacing:.04em;
  text-transform:uppercase; padding:3px 9px; border-radius:20px; flex:0 0 auto}
.rdy::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
.rdy.high{color:var(--pri-low); background:rgba(11,107,51,.1)}
.rdy.medium{color:var(--warn); background:rgba(224,138,21,.12)}
.rdy.low{color:var(--pri-critical); background:rgba(196,43,34,.1)}
.agn-row .ag-tags{display:flex; gap:5px; flex-wrap:wrap}

@media(max-width:900px){
  .hub-grid,.subhub-grid{grid-template-columns:1fr}
  .eis{grid-template-columns:1fr}
}

  news:[
  {id:"n1",src:"AZERTAC",bucket:"A",tag:"subsidy",date:"2026-09-07",pin:true,
   url:"https://azertag.az/xeber/texnika_suvarma_ve_yasil_enerjiye_guzestler_artirilir-4401173",
   t:{az:"Texnika, suvarma və yaşıl enerjiyə güzəştlər artırılır",
      en:"Concessions for machinery, irrigation and green energy increased",
      ru:"Увеличены льготы на технику, орошение и зелёную энергию"},
   d:{az:"Taxıl, pambıq və yem kombaynları, lazer hamarlayıcılar, soyuducu anbarlar, taxıl siloları, suvarma gölməçəsi örtükləri və kənd təsərrüfatı üçün günəş panelləri üzrə güzəşt payı 50%-ə qədər qaldırılır. Yerli istehsal damcı suvarma sistemləri 60%, idxal olunanlar 50% güzəşt alır.",
      en:"The concession share on grain, cotton and forage combines, laser levellers, cold stores, grain silos, irrigation-pond membranes and solar panels for agricultural use is raised to up to 50%. Locally made drip-irrigation systems receive 60% and imported systems 50%.",
      ru:"Доля льготы на зерновые, хлопковые и кормовые комбайны, лазерные выравниватели, холодильные склады, зернохранилища, мембраны для орошительных водоёмов и солнечные панели для сельхознужд повышена до 50%. Системы капельного орошения местного производства получают 60%, импортные — 50%."}},

  {id:"n2",src:"AZERTAC",bucket:"A",tag:"subsidy",date:"2026-09-07",pin:true,
   url:"https://azertag.az/xeber/fermerler_ekin_subsidiyasinin_30_faizini_avans_seklinde_ala_bilecekler-4401125",
   t:{az:"Fermerlər əkin subsidiyasının 30 faizini avans şəklində ala biləcəklər",
      en:"Farmers will be able to receive 30% of the sowing subsidy in advance",
      ru:"Фермеры смогут получать 30% посевной субсидии авансом"},
   d:{az:"5–100 ha sahədə siyahıya alınmış yazlıq və payızlıq birillik bitkilər əkən, fermer reytinqi 30-dan yuxarı olan təsərrüfatlar əkin subsidiyasının 30%-ni avans ala bilər. Sahələr EKTİS-də bəyan edilməli, əkinə hazırlıq rəqəmsal və süni intellekt həlləri ilə monitorinq olunacaq.",
      en:"Holdings of 5–100 ha growing listed spring and autumn annual crops, with a farmer rating above 30, may draw 30% of their sowing subsidy up front. Plots must be declared in EKTIS, and digital and artificial-intelligence solutions will verify whether land is genuinely sowing-ready.",
      ru:"Хозяйства площадью 5–100 га, выращивающие включённые в перечень весенние и осенние однолетние культуры и имеющие фермерский рейтинг выше 30, могут получить 30% посевной субсидии авансом. Участки должны быть задекларированы в ЕКТИС, а готовность земли к посеву будет проверяться цифровыми решениями и искусственным интеллектом."}},

  {id:"n3",src:"AZERTAC",bucket:"A",tag:"water",date:"2026-09-07",pin:true,
   url:"https://azertag.az/xeber/muasir_suvarmadan_istifade_eden_fermerlere_daha_yuksek_subsidiya_verilecek-4400865",
   t:{az:"Müasir suvarmadan istifadə edən fermerlərə daha yüksək subsidiya verilecək",
      en:"Farmers using modern irrigation will receive higher subsidies",
      ru:"Фермеры, использующие современное орошение, получат более высокие субсидии"},
   d:{az:"Taxıl subsidiyaları suvarma üsuluna görə differensiallaşdırılır: 22 ixtisaslaşmış rayonda müasir suvarma ilə buğdaya 400 AZN/ha, ənənəvi və ya dəmyə əkinə 200 AZN/ha verilir. Müasir suvarma ilə kartof, tərəvəz və paxlalılara 500 AZN/ha, bostana 310 AZN/ha tətbiq olunur.",
      en:"Grain subsidies are now differentiated by irrigation method: in the 22 specialised districts, wheat under modern irrigation receives 400 AZN/ha versus 200 AZN/ha for traditional or rain-fed. Modern-irrigation rates also rise to 500 AZN/ha for potatoes, vegetables and legumes and 310 AZN/ha for melons.",
      ru:"Субсидии на зерновые дифференцированы по способу орошения: в 22 специализированных районах пшеница на современном орошении получает 400 AZN/га против 200 AZN/га при традиционном или без орошения. Ставки при современном орошении также повышены до 500 AZN/га для картофеля, овощей и зернобобовых и 310 AZN/га для бахчевых."}},

  {id:"n4",src:"AZERTAC",bucket:"A",tag:"ai-innovation",date:"2026-09-07",
   url:"https://azertag.az/xeber/lazer_hamarlama_texnologiyasinin_tetbiqine_yeni_subsidiya_verilecek-4400901",
   t:{az:"Lazer hamarlama texnologiyasının tətbiqinə yeni subsidiya verilecək",
      en:"New subsidy introduced for laser levelling technology",
      ru:"Вводится новая субсидия за применение технологии лазерного выравнивания"},
   d:{az:"Bütün suvarılan sahələrdə, bir massivdə ən azı 5 ha buğda əkinindən əvvəl lazer hamarlama tətbiq olunarsa, ilk ildə əkin subsidiyası 250 AZN/ha artır; pambıq rayonlarında məhsul subsidiyası 50 AZN/t qalxır. Lazer hamarlanmış sahələr EKTİS-də bəyan edilməli və süni intellekt həlləri ilə monitorinq olunacaq.",
      en:"Across all irrigated land, the sowing subsidy rises by 250 AZN/ha in the first year that laser levelling is applied before at least 5 ha of wheat in a single parcel; in cotton districts the product subsidy rises by 50 AZN/t. Laser-levelled areas must be declared in EKTIS and will be monitored with artificial-intelligence solutions.",
      ru:"На всех орошаемых землях посевная субсидия увеличивается на 250 AZN/га в первый год применения лазерного выравнивания перед посевом не менее 5 га пшеницы в одном массиве; в хлопковых районах продуктовая субсидия растёт на 50 AZN/т. Выровненные площади должны быть задекларированы в ЕКТИС и будут контролироваться решениями искусственного интеллекта."}},
