      en:"In Azerbaijan these holders will receive 4 manat per animal",
      ru:"В Азербайджане эти хозяйства получат 4 маната за каждое животное"},
   d:{az:"Ən azı 100 ha otlağı və 500-dən çox xırdabuynuzlu heyvanı olan təsərrüfatlar qeydiyyatda olan hər heyvana görə 4 AZN alacaq — şərt otlaqların münbitliyinin və biomüxtəlifliyinin yaxşılaşdırılmasıdır. Otlaqların vəziyyəti EKTİS-in torpaqdan istifadə alt sistemi vasitəsilə süni intellekt həlləri ilə izlənəcək.",
      en:"Farms with at least 100 ha of pasture and more than 500 small ruminants will receive 4 AZN per registered animal, conditional on improving pasture fertility and biodiversity. Pasture condition will be tracked through the EKTIS land-use subsystem using artificial-intelligence solutions.",
      ru:"Хозяйства, имеющие не менее 100 га пастбищ и более 500 голов мелкого рогатого скота, получат 4 AZN за каждое зарегистрированное животное при условии улучшения плодородия пастбищ и биоразнообразия. Состояние пастбищ будет отслеживаться через подсистему землепользования ЕКТИС с применением искусственного интеллекта."}},

  {id:"n6",src:"AZERTAC",bucket:"A",tag:"subsidy",date:"2026-09-07",
   url:"https://azertag.az/xeber/sudluk_cins_heyvanlara_gore_1500_etlik_cinslere_ise_1000_manat_subsidiya_verilecek-4401261",
   t:{az:"Südlük cins heyvanlara görə 1500, ətlik cinslərə isə 1000 manat subsidiya verilecək",
      en:"1,500 manat subsidy for dairy breeds, 1,000 manat for beef breeds",
      ru:"Субсидия 1 500 манатов за молочные породы и 1 000 манатов за мясные"},
   d:{az:"1 oktyabr 2026-dan sonra yaradılan intensiv fermalar südlük və kombinə cinslərə görə 1,500 AZN/baş, ətlik cinslərə görə 1,000 AZN/baş alacaq. Mövcud fermalar cins sağmal heyvana görə ildə 500 AZN, yerli damazlıqdan yetişdirilənə 800 AZN, mələzlərə 200 AZN alır.",
      en:"Intensive farms established after 1 October 2026 will receive 1,500 AZN per head for dairy and dual-purpose breeds and 1,000 AZN per head for beef breeds. Existing farms receive 500 AZN per head per year for pedigree milking animals, 800 for animals raised from local breeding stock and 200 for crossbreds.",
      ru:"Интенсивные фермы, созданные после 1 октября 2026 года, получат 1 500 AZN за голову молочных и комбинированных пород и 1 000 AZN за голову мясных пород. Существующие фермы получают 500 AZN в год за породистое дойное животное, 800 — за выращенное из местного племенного поголовья и 200 — за помесное."}},

  {id:"n7",src:"AZERTAC",bucket:"A",tag:"subsidy",date:"2026-09-07",
   url:"https://azertag.az/xeber/sud_istehsalchilarina_yeni_destek_mexanizmi_her_tona_70_manat_subsidiya-4401237",
   t:{az:"Süd istehsalçılarına yeni dəstək mexanizmi: hər tona 70 manat subsidiya",
      en:"New support mechanism for milk producers: 70 manat per tonne",
      ru:"Новый механизм поддержки молокопроизводителей: 70 манатов за тонну"},
   d:{az:"EKTİS-də tədarükçü kimi qeydiyyatdan keçmiş süd zavodlarına və toplama məntəqələrinə təhvil verilən soyudulmuş xam südə litrə 7 qəpik (70 AZN/t) məhsul subsidiyası ödənilecək; kooperativlər vasitəsilə yönləndirilən südə 20% əlavə tətbiq olunur. Ödəniş EKTİS bəyanı, heyvanın identifikasiyası, sığorta, soyutma və keyfiyyət standartlarına uyğunluq tələb edir.",
      en:"A product subsidy of 7 qapik per litre (70 AZN/t) will be paid on chilled raw milk delivered to dairy plants and collection points registered as procurers in EKTIS, with a 20% uplift for milk routed through cooperatives. Payment requires EKTIS declaration, animal identification, insurance, chilling and compliance with quality standards.",
      ru:"Продуктовая субсидия в размере 7 гяпиков за литр (70 AZN/т) будет выплачиваться за охлаждённое сырое молоко, сданное на молокозаводы и в пункты сбора, зарегистрированные в ЕКТИС как заготовители, с надбавкой 20% за молоко, поставленное через кооперативы. Выплата требует декларации в ЕКТИС, идентификации животного, страхования, охлаждения и соответствия стандартам качества."}},

  {id:"n8",src:"AZERTAC",bucket:"A",tag:"food-security",date:"2026-09-07",
   url:"https://azertag.az/xeber/baliqchiliqda_ilk_defe_mehsul_subsidiyasi_tetbiq_olunacaq-4401193",
   t:{az:"Balıqçılıqda ilk dəfə məhsul subsidiyası tətbiq olunacaq",
      en:"Product subsidy to be applied in fisheries for the first time",
      ru:"В рыбном хозяйстве впервые вводится продуктовая субсидия"},
   d:{az:"İlk dəfə növ əsaslı məhsul subsidiyası tətbiq olunur: yerli istehsal qırmızıbalıq və nərə üçün 2,000 AZN/t, çəki və kefal tipli növlər üçün 600 AZN/t — məqsəd akvakultura üzrə özünütəminatı artırmaqdır. Yalnız EKTİS-də qeydiyyatlı təsərrüfatların məhsulu rəsmi satış sənədləri ilə tədarükçüyə təhvil verildikdə tətbiq olunur.",
      en:"A first-ever species-based product subsidy pays 2,000 AZN/t for domestically produced salmonids and sturgeon and 600 AZN/t for carp- and mullet-type species, aiming to raise aquaculture self-sufficiency. It applies only where produce from EKTIS-registered farms is delivered to procurers with official sales documents.",
      ru:"Впервые вводится продуктовая субсидия по видам: 2 000 AZN/т за лососёвых и осетровых отечественного производства и 600 AZN/т за карповые и кефалевые виды — с целью повышения самообеспеченности продукцией аквакультуры. Применяется только при сдаче продукции хозяйств, зарегистрированных в ЕКТИС, заготовителям с официальными документами о продаже."}},

  {id:"n9",src:"AZERTAC",bucket:"A",tag:"trade",date:"2026-09-07",
   url:"https://azertag.az/xeber/aqrar_sahede_beynelxalq_sertifikatlarin_alinmasina_dovlet_desteyi_verilecek-4401113",
   t:{az:"Aqrar sahədə beynəlxalq sertifikatların alınmasına dövlət dəstəyi verilecək",
      en:"State support for obtaining international certificates in agriculture",
      ru:"Государственная поддержка получения международных сертификатов в АПК"},
   d:{az:"Global G.A.P., FSSC 22000, HACCP, GRASP, BRCGS, FSMA və beynəlxalq üzvi sertifikatlaşdırma növündən asılı olaraq 7,000–36,000 AZN həcmində subsidiyalaşdırılacaq — məqsəd xarici bazarlara çıxışı asanlaşdırmaqdır. Sertifikatların qüvvədə saxlanmasına illik dəstək müvafiq məbləğin 10%-i həcmində müəyyən edilib.",
      en:"Global G.A.P., FSSC 22000, HACCP, GRASP, BRCGS, FSMA and international organic certification will be subsidised at 7,000–36,000 AZN depending on certificate type, to ease access to foreign markets. Annual support for keeping certificates active is set at 10% of the relevant amount.",
      ru:"Сертификация Global G.A.P., FSSC 22000, HACCP, GRASP, BRCGS, FSMA и международная органическая сертификация будут субсидироваться в размере 7 000–36 000 AZN в зависимости от типа сертификата — для облегчения доступа на внешние рынки. Ежегодная поддержка на поддержание сертификатов установлена в размере 10% от соответствующей суммы."}},

  {id:"n10",src:"AZERTAC",bucket:"A",tag:"harvest",date:"2026-09-07",
   url:"https://azertag.az/xeber/sertifikatli_toxumun_istehsalina_destek_genislendirilir-4401101",
   t:{az:"Sertifikatlı toxumun istehsalına dəstək genişləndirilir",
      en:"Support for certified seed production expanded",
      ru:"Расширяется поддержка производства сертифицированных семян"},
   d:{az:"Yerli mənşəli superelit buğda və arpa istehsal edən toxumçular əlavə 470 AZN/ha, xarici mənşəli üzrə 300 AZN/ha alacaq. Buğda və arpa üzrə sertifikatlı toxum tələbi həddi 5 ha-ya düşür; həddən yuxarı uyğunsuz fermerlər 2026-2027-də əkin subsidiyasının 50%-ni, 2027-2028-də isə tam itirir.",
      en:"Seed growers producing super-elite wheat and barley of local origin receive an extra 470 AZN/ha, and of foreign origin an extra 300 AZN/ha. The certified-seed requirement threshold for wheat and barley drops to 5 ha; non-compliant farmers above that threshold lose 50% of their sowing subsidy in 2026-2027 and fall to a zero coefficient in 2027-2028.",
      ru:"Семеноводы, производящие суперэлитную пшеницу и ячмень местного происхождения, получают дополнительно 470 AZN/га, иностранного происхождения — 300 AZN/га. Порог требования по сертифицированным семенам для пшеницы и ячменя снижается до 5 га; несоблюдающие его фермеры теряют 50% посевной субсидии в 2026-2027 гг. и переходят на нулевой коэффициент в 2027-2028 гг."}},

  {id:"n11",src:"AZERTAC",bucket:"A",tag:"water",date:"2026-09-07",
   url:"https://azertag.az/xeber/pambiq_sahelerinde_qurasdirilan_damci_suvarma_sistemi_uchun_elave_destek_verilecek-4401041",
   t:{az:"Pambıq sahələrində quraşdırılan damcı suvarma sistemi üçün əlavə dəstək verilecək",
      en:"Additional support for drip irrigation installed in cotton fields",
      ru:"Дополнительная поддержка капельного орошения на хлопковых полях"},
   d:{az:"Pambıq üzrə məhsul subsidiyası suvarma texnologiyasına görə differensiallaşdırılır: ənənəvi suvarma üçün 200 AZN/t, yağış və pivot sistemləri üçün 215 AZN/t, damcı suvarma üçün 300 AZN/t.",
      en:"The cotton product subsidy is now differentiated by irrigation technology: 200 AZN/t for traditional irrigation, 215 AZN/t for sprinkler and pivot systems, and 300 AZN/t for drip irrigation.",
      ru:"Продуктовая субсидия на хлопок дифференцирована по технологии орошения: 200 AZN/т при традиционном орошении, 215 AZN/т при дождевании и пивотных системах и 300 AZN/т при капельном орошении."}},

  {id:"n12",src:"AZERTAC",bucket:"A",tag:"policy",date:"2026-09-07",
   url:"https://azertag.az/xeber/serhedboyu_ekinchiliye_elave_destek_verilecek-4401181",
   t:{az:"Sərhədboyu əkinçiliyə əlavə dəstək verilecək",
      en:"Additional support for farming in border areas",
      ru:"Дополнительная поддержка земледелия в приграничных районах"},
   d:{az:"Sərhədboyu rayonlarda kənd təsərrüfatı fəaliyyətinin davamlılığını təmin edən əlavə subsidiya mexanizmi tətbiq olunur. Siyahıya alınmış sərhədboyu yaşayış məntəqələrindəki bitkiçilik fermerləri üçün subsidiya əmsalı ümumrespublika baza əmsalından 0.5 bənd yuxarı hesablanır.",
      en:"An additional subsidy mechanism will sustain agricultural activity in border districts. For crop farmers in listed border settlements the subsidy coefficient is calculated 0.5 points above the national base coefficient.",
      ru:"Вводится дополнительный механизм субсидирования для поддержания сельхоздеятельности в приграничных районах. Для растениеводов в включённых в перечень приграничных населённых пунктах коэффициент субсидии рассчитывается на 0,5 пункта выше общереспубликанского базового."}},

  {id:"n13",src:"AZERTAC",bucket:"A",tag:"trade",date:"2026-09-07",
   url:"https://azertag.az/xeber/emala_tehvil_verilen_mehsullar_uzre_subsidiyalarin_ehatesi_genislendirilir-4401073",
   t:{az:"Emala təhvil verilən məhsullar üzrə subsidiyaların əhatəsi genişləndirilir",
      en:"Coverage of subsidies for produce delivered to processing expanded",
      ru:"Расширяется охват субсидий на продукцию, сданную на переработку"},
   d:{az:"Emala təhvil üzrə yeni subsidiyalar: texniki üzüm 50 AZN/t, zeytun 30, xurma 50, bərkqabıqlı badam 30, ətirli gül 100, biyan 10, pivəbişirmə arpası 50 AZN/t. 22 buğda rayonunda lazer hamarlanmış sahələrdən dəyirmanlara təhvil verilən buğda 40 AZN/t, Naxçıvanda tədarükçülərə təhvil verilən buğda 50 AZN/t qazanır.",
      en:"New processing-delivery subsidies are set at 50 AZN/t for technical grapes, 30 for olives, 50 for persimmon, 30 for hard-shell almonds, 100 for essential-oil roses, 10 for liquorice and 50 for brewing barley. In the 22 wheat districts, wheat from laser-levelled fields delivered to mills earns 40 AZN/t, and wheat delivered to procurers in Nakhchivan 50 AZN/t.",
      ru:"Новые субсидии за сдачу на переработку установлены на уровне 50 AZN/т для технического винограда, 30 — для оливок, 50 — для хурмы, 30 — для миндаля в твёрдой скорлупе, 100 — для эфиромасличной розы, 10 — для солодки и 50 — для пивоваренного ячменя. В 22 пшеничных районах пшеница с лазерно выровненных полей, сданная на мельницы, получает 40 AZN/т, а сданная заготовителям в Нахчыване — 50 AZN/т."}},

  {id:"n14",src:"AZERTAC",bucket:"A",tag:"trade",date:"2026-09-07",
   url:"https://azertag.az/xeber/yeni_subsidiya_mexanizmleri_kend_teserrufati_mehsullarinin_ixracini_ve_beynelxalq_sertifikatlasdirmani_tesviq_edecek___serh-4401609",
   t:{az:"Yeni subsidiya mexanizmləri aqrar ixracı və beynəlxalq sertifikatlaşdırmanı təşviq edəcək — ŞƏRH",
      en:"New subsidy mechanisms will encourage agri exports and international certification — COMMENTARY",
      ru:"Новые механизмы субсидирования будут стимулировать агроэкспорт и международную сертификацию — КОММЕНТАРИЙ"},
   d:{az:"İqtisadi Reformaların Təhlili və Kommunikasiya Mərkəzindən (Azexport.az) Ayxan Qadaşov paketi ixrac yönümlü kimi qiymətləndirir: aroniya bağlarına 7,500 AZN/ha, ətirli gül plantasiyalarına 6,000 AZN/ha, süperintensiv üzümlüklərə 20,000 AZN/ha — 2030-a qədər 20 yeni butik şərab evi hədəfi ilə.",
      en:"Ayxan Qadashov of the Centre for Analysis of Economic Reforms and Communication (Azexport.az) frames the package as export-oriented, citing 7,500 AZN/ha for aronia orchards, 6,000 AZN/ha for essential-oil rose plantations and 20,000 AZN/ha for super-intensive vineyards, with a target of 20 new boutique wine houses by 2030.",
      ru:"Айхан Гадашов из Центра анализа экономических реформ и коммуникации (Azexport.az) характеризует пакет как экспортно ориентированный, отмечая 7 500 AZN/га для садов аронии, 6 000 AZN/га для плантаций эфиромасличной розы и 20 000 AZN/га для суперинтенсивных виноградников — с целью открытия 20 новых бутиковых винодельческих домов к 2030 году."}},

  {id:"g1",src:"FAO",bucket:"B",tag:"food-security",date:"2026-09-04",pin:true,
   url:"https://www.fao.org/newsroom/detail/supply-concerns-drive-fao-food-price-index-higher/en",
   t:{az:"Təchizat riskləri FAO Ərzaq Qiymət İndeksini yuxarı qaldırdı",
      en:"Supply concerns drive FAO Food Price Index higher in August",
      ru:"Опасения по поставкам подняли Индекс продовольственных цен ФАО в августе"},
   d:{az:"FAO Ərzaq Qiymət İndeksi avqustda 133.3 bənd təşkil edib — iyula nisbətən 1.9% artım; taxıl indeksi 2.2%, buğda 2.6% (illik 15.0%) yüksəlib. FAO 2026-cı il üzrə dünya taxıl istehsalı proqnozunu 2,980 mln tona endirib — 2025-dən 2.0% az, lakin tarixdə ikinci ən yüksək göstərici.",
      en:"The FAO Food Price Index averaged 133.3 points in August 2026, up 1.9% on July, with the cereal index up 2.2% and wheat up 2.6% (15.0% above a year earlier). FAO cut its 2026 world cereal output forecast to 2,980 Mt, down 2.0% on 2025 but still the second-largest on record.",
      ru:"Индекс продовольственных цен ФАО в августе 2026 года составил в среднем 133,3 пункта, что на 1,9% выше июля; индекс зерновых вырос на 2,2%, пшеница — на 2,6% (на 15,0% выше уровня года назад). ФАО снизила прогноз мирового производства зерна на 2026 год до 2 980 млн т — на 2,0% ниже 2025 года, но это по-прежнему второй по величине результат за всю историю."}},

  {id:"g2",src:"FoodNavigator",bucket:"B",tag:"climate",date:"2026-08-28",
   url:"https://www.foodnavigator.com/Article/2026/08/28/climate-change-is-existential-threat-to-food-production/",
   t:{az:"İqlim dəyişikliyi ərzaq istehsalı üçün mövcudluq təhlükəsidir",
      en:"Climate change is an existential threat to food production",
      ru:"Изменение климата — экзистенциальная угроза для производства продовольствия"},
   d:{az:"Avropada quraqlıq və istilik qarğıdalı, buğda və günəbaxan məhsuldarlığını azaldıb; məhsul itkilərinin Avropaya təxminən 2 mlrd avroya baş gələcəyi gözlənilir. Rabobank-ın hesablamasına görə qlobal məhsuldarlıq iqlim dəyişikliyi olmasa çatacağı səviyyədən 21% aşağıdır.",
      en:"Drought and heat across Europe pushed down maize, wheat and sunflower yields, with crop losses projected to cost Europe nearly EUR 2bn. Rabobank estimates global crop productivity is now 21% lower than it would have been without climate change — wiping out more than seven years of productivity gains.",
      ru:"Засуха и жара в Европе снизили урожайность кукурузы, пшеницы и подсолнечника; потери урожая, по прогнозам, будут стоить Европе почти 2 млрд евро. По оценке Rabobank, мировая производительность сельхозкультур сейчас на 21% ниже уровня, который был бы достигнут без изменения климата."}},

  {id:"g3",src:"Agriland",bucket:"B",tag:"water",date:"2026-09-06",
   url:"https://www.agriland.ie/farming-news/drought-highlights-urgent-need-for-irish-irrigation-infrastructure/",
   t:{az:"Quraqlıq suvarma infrastrukturuna təcili ehtiyacı ortaya qoyur",
      en:"Drought highlights urgent need for irrigation infrastructure",
      ru:"Засуха выявила острую необходимость в инфраструктуре орошения"},
   d:{az:"Teagasc mütəxəssisi Shay Phelan bildirib ki, son altı-səkkiz həftə kartof və tərəvəz istehsalçıları üçün çox ağır olub: suvarılan əkinlər nisbətən yaxşı vəziyyətdədir, bəzi dəmyə əkinlər isə bərpaolunmaz şəkildə quruyub. O, qışda dolduralan su anbarları kimi planlı suvarma infrastrukturunun zəruriliyini vurğulayıb.",
      en:"Teagasc specialist Shay Phelan said the past six to eight weeks were very difficult for potato and vegetable growers: irrigated crops are reasonably good while some non-irrigated crops senesced beyond recovery. He argued for planned irrigation infrastructure such as winter-filled reservoirs, noting current grant aid covers guns, piping and pumps but not reservoirs.",
      ru:"Специалист Teagasc Шей Фелан заявил, что последние шесть-восемь недель были очень трудными для производителей картофеля и овощей: орошаемые культуры в приемлемом состоянии, тогда как часть неорошаемых засохла без возможности восстановления. Он подчёркивает необходимость планового строительства инфраструктуры орошения, например заполняемых зимой водохранилищ."}},

  {id:"g4",src:"USDA",bucket:"B",tag:"public-sector",date:"2026-09-01",
   url:"https://www.usda.gov/about-usda/news/press-releases/2026/09/01/secretary-rollins-unveils-plan-modernize-agricultural-data-collection-and-put-farmers-first",
   t:{az:"ABŞ Kənd Təsərrüfatı Departamenti aqrar məlumat toplanmasının modernləşdirilməsi planını açıqlayıb",
      en:"USDA unveils plan to modernise agricultural data collection",
      ru:"Минсельхоз США представил план модернизации сбора сельхозданных"},
   d:{az:"Ayova ştatındakı Farm Progress sərgisində USDA-nın Məlumatların Modernləşdirilməsi Planı təqdim olunub. Departament planın istehsalçılar üçün lüzumsuz hesabatlılıq yükünü azaltmaq və aqrar məlumatların operativliyini artırmaq məqsədi daşıdığını bildirir.",
      en:"USDA's Data Modernization Plan was announced at the Farm Progress Show in Boone, Iowa. The department says it is intended to reduce unnecessary reporting burdens on producers and improve the timeliness of agricultural data.",
      ru:"План модернизации данных Минсельхоза США был представлен на выставке Farm Progress Show в Буне, штат Айова. По заявлению ведомства, план призван снизить излишнюю отчётную нагрузку на производителей и повысить оперативность сельхозданных."}},

  {id:"g5",src:"FAO",bucket:"B",tag:"public-sector",date:"2026-09-03",
   url:"https://www.fao.org/newsroom/detail/fao-calls-for-systemic-action-to-advance-generational-renewal-in-rural-areas/en",
   t:{az:"FAO kənd yerlərində nəsil yeniləşməsi üçün sistemli tədbirlərə çağırır",
      en:"FAO calls for systemic action on generational renewal in rural areas",
      ru:"ФАО призывает к системным мерам для смены поколений в сельских районах"},
   d:{az:"Xorvatiyanın Osiyek şəhərindəki Yüksək Səviyyəli Nazirlər Konfransında FAO-nun Baş Direktoru bildirib ki, gənclərin kənd təsərrüfatında saxlanması yalnız fermer dəstəyi ilə deyil, torpaq, maliyyə, texnologiya, mənzil, rabitə, təhsil və səhiyyə xidmətləri ilə mümkündür. İşləyən gənclərin 44%-i aqroərzaq sistemlərindən asılıdır.",
      en:"At Croatia's High-Level Ministerial Conference in Osijek, FAO's Director-General argued that keeping young people in farming requires land, finance, technology, housing, connectivity, education and health services — not farm support alone. He cited that 44% of working youth depend on agrifood systems and 46% of young people live in rural areas.",
      ru:"На конференции высокого уровня на уровне министров в Осиеке (Хорватия) Генеральный директор ФАО заявил, что удержание молодёжи в сельском хозяйстве требует земли, финансирования, технологий, жилья, связи, образования и здравоохранения, а не только поддержки фермеров. Он отметил, что 44% работающей молодёжи зависят от агропродовольственных систем."}},

  {id:"g6",src:"Agriland",bucket:"B",tag:"policy",date:"2026-09-06",
   url:"https://www.agriland.ie/farming-news/cap-future-discussed-with-eu-commissioner-at-dublin-farm/",
   t:{az:"Aİ komissarı ilə Dublində Ümumi Aqrar Siyasətin gələcəyi müzakirə edilib",
      en:"Future of the Common Agricultural Policy discussed with EU Commissioner",
      ru:"Будущее Единой сельскохозяйственной политики обсуждено с комиссаром ЕС"},
   d:{az:"Aİ-nin kənd təsərrüfatı komissarı Christophe Hansen İrlandiyanın kənd təsərrüfatı naziri Martin Heydon ilə Dublin yaxınlığındaki pomidor təsərrüfatında görüşüb; gündəlikdə 2027-dən sonrakı Ümumi Aqrar Siyasət və ərzaq təhlükəsizliyi olub. Danışıqlar geniş Çoxillik Maliyyə Çərçivəsi müzakirələri daxilində davam edir.",
      en:"EU Agriculture Commissioner Christophe Hansen met Irish Agriculture Minister Martin Heydon at a tomato farm near Dublin, with the post-2027 Common Agricultural Policy and food security topping the agenda. Negotiations continue inside the wider Multiannual Financial Framework talks, with Ireland building consensus among member states as Council President.",
      ru:"Комиссар ЕС по сельскому хозяйству Кристоф Хансен встретился с министром сельского хозяйства Ирландии Мартином Хейдоном на томатной фермe под Дублином; в центре повестки — Единая сельскохозяйственная политика после 2027 года и продовольственная безопасность. Переговоры продолжаются в рамках более широких обсуждений Многолетней финансовой рамочной программы."}},

  {id:"a1",src:"World Bank",bucket:"C",tag:"ai-innovation",date:"2026-08-31",pin:true,
   url:"https://www.worldbank.org/en/news/feature/2026/08/27/small-ai-transforms-farming-in-india",
   t:{az:"«Kiçik süni intellekt» Hindistanda əkinçiliyi dəyişdirir",
      en:"'Small AI' is transforming farming in India",
      ru:"«Малый ИИ» преобразует сельское хозяйство в Индии"},
   d:{az:"Dünya Bankı sadə smartfonlar və zəif internet üçün qurulmuş süni intellekt alətlərini təqdim edir: onlar xırda fermerlərə səpin, zərərverici, hava, bazar və dövlət proqramları barədə öz dillərində məsləhət verir. Kerala ştatının KATHIR platforması peyk təsvirləri və süni intellekt analitikası ilə 3 mln-dan çox fermer və 1.1 mln ha üzrə məlumatı subsidiyaların ünvanlanması və məhsuldarlığın qiymətləndirilməsi üçün istifadə edir.",
      en:"The World Bank profiles AI tools built for basic smartphones and low connectivity that give smallholders localised advice on sowing, pests, weather, markets and government schemes in their own languages. Kerala's KATHIR platform combines satellite imagery and AI analytics over data on 3m+ farmers and 1.1m+ hectares mapped, for subsidy targeting and yield estimation.",
      ru:"Всемирный банк описывает инструменты ИИ, созданные для простых смартфонов и слабой связи, которые дают мелким фермерам локальные рекомендации по посеву, вредителям, погоде, рынкам и господдержке на их языках. Платформа KATHIR штата Керала объединяет спутниковые снимки и ИИ-аналитику по данным о более 3 млн фермеров и 1,1 млн га — для адресности субсидий и оценки урожайности."}},

  {id:"a2",src:"Trend",bucket:"C",tag:"public-sector",date:"2026-09-04",
   url:"https://www.trend.az/casia/uzbekistan/4220741.html",
   t:{az:"Özbəkistan və Cənubi Koreya rəqəmsal kənd təsərrüfatı platforması layihəsinə başlayıb",
      en:"Uzbekistan and South Korea launch digital agriculture platform project",
      ru:"Узбекистан и Южная Корея начали проект цифровой платформы для сельского хозяйства"},
   d:{az:"Özbəkistan Kənd Təsərrüfatı Nazirliyi və Cənubi Koreyanın EPIS agentliyi milli rəqəmsal kənd təsərrüfatı platformasının birinci mərhələsinə başlayıb: inzibati məlumatların inteqrasiyası sistemi, CİS platforması, ictimai portal və süni intellekt əsaslı proqnoz modeli. Layihə həmçinin özbək mütəxəssislərinin müasir proqramlaşdırma, açıq mənbə CİS və Big Data üzrə hazırlanmasını maliyyələşdirir.",
      en:"Uzbekistan's Agriculture Ministry and South Korea's EPIS agency began phase one of a national digital agriculture platform comprising an administrative data integration system, a GIS platform, a public portal and an AI-based forecasting model. The project also funds capacity building, training Uzbek specialists in modern programming, open-source GIS and Big Data.",
      ru:"Министерство сельского хозяйства Узбекистана и южнокорейское агентство EPIS начали первый этап национальной цифровой сельскохозяйственной платформы, включающей систему интеграции административных данных, ГИС-платформу, публичный портал и модель прогнозирования на базе ИИ. Проект также финансирует подготовку узбекских специалистов по современному программированию, открытым ГИС и Big Data."}},

  {id:"a3",src:"Qazinform",bucket:"C",tag:"public-sector",date:"2026-08-21",
   url:"https://qazinform.com/news/kazakhstan-fao-deepen-cooperation-on-digital-agriculture-3281ae",
   t:{az:"Qazaxıstan və FAO rəqəmsal kənd təsərrüfatı üzrə əməkdaşlığı dərinləşdirir",
      en:"Kazakhstan and FAO deepen cooperation on digital agriculture",
      ru:"Казахстан и ФАО углубляют сотрудничество в цифровом сельском хозяйстве"},
   d:{az:"Qazaxıstan Kənd Təsərrüfatı Nazirliyi və FAO monitorinq alətləri və dronlarla toplanan məlumatların rəqəmsal platformalara və idarəetmə panellərinə inteqrasiyası üzrə əməkdaşlığı genişləndirmək barədə görüş keçirib. Tərəflər aqrar torpaq məlumatlarının toplanması, işlənməsi və vizuallaşdırılmasının avtomatlaşdırılmasını müzakirə edib.",
      en:"Kazakhstan's Ministry of Agriculture and FAO met to expand cooperation on agricultural digitalisation, focused on monitoring tools and integrating UAV-collected data into digital platforms and dashboards. They discussed automating the collection, processing and visualisation of agricultural land data to improve analytics and forecasting.",
      ru:"Министерство сельского хозяйства Казахстана и ФАО провели встречу по расширению сотрудничества в цифровизации сельского хозяйства с акцентом на инструменты мониторинга и интеграцию данных с дронов в цифровые платформы и панели. Обсуждалась автоматизация сбора, обработки и визуализации данных о сельхозземлях для улучшения аналитики и прогнозирования."}},

  {id:"a4",src:"AgFunderNews",bucket:"C",tag:"ai-innovation",date:"2026-09-02",
   url:"https://agfundernews.com/%f0%9f%8e%a5-orchard-robotics-ceo-growers-shouldnt-have-to-be-data-analysts",
   t:{az:"Orchard Robotics: «İstehsalçılar məlumat analitiki olmağa məcbur qalmamalıdır»",
      en:"Orchard Robotics CEO: growers 'shouldn't have to be data analysts'",
      ru:"Глава Orchard Robotics: «Производители не должны быть аналитиками данных»"},
   d:{az:"Orchard Robotics traktora quraşdırılan süni intellekt kamera sistemi satır: təsvirlər fermalarda internet olmadığı üçün birbaşa NVIDIA Jetson üzərində işlənir və hər ağac səviyyəsində meyvə sayı, ölçüsü, rəngi, çətir sağlamlığı, su stresi, xəstəlik və məhsuldarlıq ölçülür. Şirkət 95%-dən yuxarı dəqiqliklə məhsuldarlıq proqnozu və birinci ildə 3-10 dəfə investisiya qaytarımı bildirir.",
      en:"Orchard Robotics sells a tractor-mounted AI camera system that processes images onboard an NVIDIA Jetson — because farms lack connectivity — to measure fruit count, size, colour, canopy health, water stress, disease and yield at individual-tree level. The company reports yield prediction with 95%+ accuracy and 3-10x first-year return on investment.",
      ru:"Orchard Robotics продаёт устанавливаемую на трактор систему ИИ-камер, которая обрабатывает изображения непосредственно на NVIDIA Jetson — поскольку на фермах нет связи — и измеряет количество, размер и цвет плодов, состояние кроны, водный стресс, болезни и урожайность на уровне отдельного дерева. Компания заявляет о точности прогноза урожайности выше 95% и возврате инвестиций в 3-10 раз в первый год."}},

  {id:"a5",src:"AgFunderNews",bucket:"C",tag:"ai-innovation",date:"2026-08-25",
   url:"https://agfundernews.com/terrablaster-raises-12-5m-for-real-time-npk-soil-mapping-at-tractor-speed",
   t:{az:"TerraBlaster real vaxtda NPK torpaq xəritələməsi üçün 12.5 mln dollar cəlb etdi",
      en:"TerraBlaster raises $12.5m for real-time NPK soil mapping at tractor speed",
      ru:"TerraBlaster привлекла 12,5 млн долларов на NPK-картирование почв в реальном времени"},
   d:{az:"TerraBlaster ilkin olaraq Mars roveri üçün hazırlanmış lazerlə induksiya olunan parçalanma spektroskopiyası sensorlarını kommersiyalaşdırmaq üçün 12.5 mln dollar cəlb etdi: sensorlar torpaqdan çəkilərək pH, azot, fosfor və kaliumu 0.15 akr dəqiqliklə real vaxtda xəritələyir. Şirkət hektar başına test xərcini azaldacağını və qarğıdalı-soya məhsuldarlığına əlavə dəyər qatacağını bildirir.",
      en:"TerraBlaster raised $12.5m to commercialise laser-induced breakdown spectroscopy sensors, originally developed for the Mars rover, towed through soil to map pH, nitrogen, phosphorus and potassium in real time at 0.15-acre resolution. The company says it replaces slow 2.5-acre-grid lab sampling, saving on testing costs and adding yield value in corn and soy, shipping commercially in spring 2027.",
      ru:"TerraBlaster привлекла 12,5 млн долларов на коммерциализацию датчиков лазерно-искровой спектроскопии, изначально разработанных для марсохода: их протягивают через почву, чтобы в реальном времени картировать pH, азот, фосфор и калий с разрешением 0,15 акра. Компания утверждает, что это заменяет медленный лабораторный отбор по сетке 2,5 акра, снижая расходы на анализы и повышая урожайность кукурузы и сои."}},

  {id:"a6",src:"AgFunderNews",bucket:"C",tag:"ai-innovation",date:"2026-08-25",
   url:"https://agfundernews.com/can-smarter-surveillance-help-poultry-farms-catch-bird-flu-earlier",
   t:{az:"Daha ağıllı nəzarət quş fermalarında quş qripini daha erkən aşkarlaya bilərmi?",
      en:"Can smarter surveillance help poultry farms catch bird flu earlier?",
      ru:"Может ли более умный мониторинг помочь птицефермам раньше выявлять птичий грипп?"},
   d:{az:"Alveo Technologies və AgriNerds daşınan 45 dəqiqəlik molekulyar quş qripi testini radar, peyk təsvirləri və quş telemetriyası əsasında gündəlik vəhşi quş yoluxma riskini proqnozlaşdıran şəbəkə ilə birləşdirib — 160,000-dən çox ABŞ kommersiya quşçuluq obyektinin ətrafında. Məqsəd fasiləsiz yoxlama yerinə riskə əsaslanan test rejimidir.",
      en:"Alveo Technologies and AgriNerds combined a portable 45-minute molecular avian-flu test with a network that uses radar, satellite imagery and bird telemetry to predict daily wild-bird infection risk around more than 160,000 US commercial poultry facilities. The aim is risk-triggered rather than continuous testing, replacing 2-3 day PCR lab waits.",
      ru:"Alveo Technologies и AgriNerds объединили портативный 45-минутный молекулярный тест на птичий грипп с сетью, которая по данным радаров, спутниковых снимков и телеметрии птиц прогнозирует ежедневный риск заражения от дикой птицы вокруг более 160 000 коммерческих птицеводческих объектов США. Цель — тестирование по риску вместо непрерывного, вместо 2-3 дней ожидания ПЦР-лаборатории."}},

  {id:"a7",src:"AgFunderNews",bucket:"C",tag:"ai-innovation",date:"2026-09-04",
   url:"https://agfundernews.com/orbit-ventures-on-innovation-theater-ai-to-turbocharge-emerging-markets-and-the-risks-of-blitzscaling",
   t:{az:"Orbit Ventures: süni intellekt inkişaf edən bazarlara daha güclü təsir edəcək",
      en:"Orbit Ventures: AI will affect emerging markets more than rich ones",
      ru:"Orbit Ventures: ИИ сильнее повлияет на развивающиеся рынки, чем на богатые"},
   d:{az:"Orbit Ventures-dan William Bao Bean bildirir ki, proqram təminatının çatdırılma xərclərinin kəskin azalması rəqəmsal xidmətləri ilk dəfə əlçatan etdiyi üçün süni intellekt kasıb bazarlara daha güclü təsir edəcək. O, portfel şirkətinin WhatsApp və Messenger üzərindən tam süni intellektlə idarə olunan fermer kredit prosesini kredit üçün 1 dollara işlətdiyini nümunə gətirir.",
      en:"Orbit Ventures' William Bao Bean argues AI will affect poorer markets more than richer ones, because collapsing software delivery costs finally make digital services affordable. He cites a portfolio company running a fully AI-driven farm loan process over WhatsApp and Messenger for $1 per loan, and warns that corporate innovation programmes often amount to 'innovation theatre'.",
      ru:"Уильям Бао Бин из Orbit Ventures утверждает, что ИИ сильнее повлияет на более бедные рынки, чем на богатые, поскольку резкое падение стоимости доставки ПО наконец делает цифровые услуги доступными. Он приводит в пример портфельную компанию, которая проводит полностью управляемый ИИ процесс выдачи фермерских кредитов через WhatsApp и Messenger за 1 доллар за кредит."}},

  {id:"a8",src:"AgFunderNews",bucket:"C",tag:"ai-innovation",date:"2026-08-26",
   url:"https://agfundernews.com/cropx-acquires-nir-spectroscopy-firm-scio-in-biggest-deal-yet-eyes-profitability-in-2027",
   t:{az:"CropX NIR spektroskopiya şirkəti SCIO-nu satın aldı",
      en:"CropX acquires NIR spectroscopy firm SCIO in its biggest deal yet",
      ru:"CropX приобрела компанию NIR-спектроскопии SCIO — крупнейшая сделка"},
   d:{az:"Rəqəmsal aqronomiya şirkəti CropX təxminən 10,000 cihazı istifadədə olan portativ yaxın infraqırmızı spektroskopiya şirkəti SCIO-nu satın aldı — altı ildə səkkizinci və ən böyük alışı. Bu, platformanı mövsüm içi qərarlardan rütubət, protein, yağ və şəkərin əkinqabağı və məhsulsonrası ölçülməsinə qədər genişləndirir.",
      en:"Digital agronomy firm CropX acquired portable near-infrared spectroscopy company SCIO, with roughly 10,000 devices deployed — its eighth and largest acquisition in six years. The deal extends its platform from in-season decisions into pre- and post-harvest measurement of moisture, protein, oil and sugar.",
      ru:"Компания цифровой агрономии CropX приобрела производителя портативной ближней инфракрасной спектроскопии SCIO с примерно 10 000 устройств в эксплуатации — это её восьмая и крупнейшая покупка за шесть лет. Сделка расширяет платформу от внутрисезонных решений до измерения влажности, протеина, масла и сахара до и после уборки."}}
  ],

     d:{az:"Taxıl əkinlərinin təxminən yarısı dəmyə torpaqlardadır, müasir suvarma isə ümumi suvarılan sahənin (təxminən 1.45 mln ha) yalnız 130 min ha-nı əhatə edir. 2030 hədəfi 300 min ha-dır. Avropada bu il quraqlıq qarğıdalı, buğda və günəbaxan məhsuldarlığını aşağı salıb — məhsuldarlığın havadan asılılığı real riskdir.",
        en:"About half of grain area is on rain-fed land, while modern irrigation covers only 130k ha of roughly 1.45 mn ha of irrigated land. The 2030 target is 300k ha. Europe's drought this year cut maize, wheat and sunflower yields — weather-dependent yield is a live risk, not a theoretical one.",
        ru:"Около половины площадей под зерновыми — неорошаемые земли, тогда как современное орошение охватывает лишь 130 тыс. га из примерно 1,45 млн га орошаемых земель. Цель на 2030 год — 300 тыс. га. Засуха в Европе в этом году снизила урожайность кукурузы, пшеницы и подсолнечника — зависимость урожая от погоды является реальным риском."},

     rec:{az:"<b>Səbəb diaqnostikasını sifariş edin, yeni subsidiya elan etməyin.</b> 30% eniş enerji xərcləri, bazar itkisi, xəstəlik və ya sahədən çıxma səbəbindən ola bilər — hər biri fərqli müdaxilə tələb edir. İstixana texnoloji avadanlığına 20% güzəşt mövcuddur; onun uptake-i diaqnostikadan sonra qiymətləndirilməlidir.",

  /* ---------------- ASK-YOUR-DATA KNOWLEDGE BASE ---------------- */
  qa:[
    {k:["buğda","özünütəminat","wheat","self","самообеспеч","пшениц","import","idxal","импорт"],
     q:{az:"Buğda üzrə özünütəminat vəziyyəti nədir?",en:"What is our wheat self-sufficiency position?",ru:"Каково наше положение по самообеспеченности пшеницей?"},
     a:{az:"Ərzaq buğdası üzrə özünütəminat <b>55%</b>-dir: istehsal 1.573 mln ton, idxal 1.267 mln ton. Prezident may 2026-da bu nisbətin artmadığını qeyd etmişdir. Cari Qara dəniz FOB qiyməti (<b>287.5 USD/t</b>) ilə illik idxal hesabı təxminən <b>364 mln dollar</b> təşkil edir. Digər taxıllar (əsasən yem) üzrə özünütəminat 95%, paxlalılar üzrə 63%-dir. Bazar riski hazırda yüksəkdir: CBOT buğda illik <b>+42.9%</b>, Rusiyanın ixracı illik 50%-dən çox azalıb.",
        en:"Food-wheat self-sufficiency is <b>55%</b>: output 1.573 mn t against imports of 1.267 mn t. The President noted in May 2026 that this ratio is not improving. At the current Black Sea FOB price (<b>USD 287.5/t</b>) the annual import bill is roughly <b>USD 364 mn</b>. Other grains, mainly feed, are 95% self-sufficient and legumes 63%. Market risk is currently high: CBOT wheat is <b>+42.9% y/y</b> and Russian exports are down more than 50% y/y.",
        ru:"Самообеспеченность продовольственной пшеницей составляет <b>55%</b>: производство 1,573 млн т при импорте 1,267 млн т. В мае 2026 года Президент отметил, что этот показатель не растёт. При текущей цене FOB Чёрное море (<b>287,5 USD/т</b>) годовой счёт за импорт составляет около <b>364 млн долларов</b>. По прочим зерновым (в основном фуражным) самообеспеченность 95%, по зернобобовым — 63%. Рыночный риск сейчас высок: пшеница CBOT <b>+42,9% г/г</b>, российский экспорт упал более чем на 50% г/г.",
        },
     c:"president.az (05.2026) · Trading Economics · UkrAgroConsult", go:"simulator"},

    {k:["ixrac","export","экспорт","satış","top","ən böyük","крупнейш"],
     q:{az:"Ən böyük aqrar ixrac maddələrimiz hansılardır?",en:"What are our largest agri export lines?",ru:"Каковы наши крупнейшие агроэкспортные позиции?"},
     a:{az:"Yan–İyul 2026 üzrə: <b>meyvə-tərəvəz 589.2 mln dollar</b>, <b>pambıq 172.2 mln dollar</b>, <b>pomidor 172.1 mln dollar</b>, pambıq ipliyi 30.9, kartof 29.7, çay 5.0 mln dollar. Cəmi aqrar və aqrosənaye ixracı <b>896.4 mln dollar</b> (+22.8%). Həcm baxımından pomidor 142,909 ton (−0.5%), alma 50,107 ton (−7.9%), fındıq 8,893 ton (−22.3%). Fındıq üzrə 22.3% enmə ən ciddi siqnaldır.",
        en:"For Jan–Jul 2026: <b>fruit and vegetables USD 589.2 mn</b>, <b>cotton USD 172.2 mn</b>, <b>tomatoes USD 172.1 mn</b>, cotton yarn 30.9, potatoes 29.7 and tea 5.0. Combined agri and agro-industrial exports reached <b>USD 896.4 mn</b> (+22.8%). By volume: tomatoes 142,909 t (−0.5%), apples 50,107 t (−7.9%), hazelnuts 8,893 t (−22.3%). The 22.3% hazelnut decline is the sharpest signal.",
        ru:"За янв–июл 2026: <b>плодоовощная продукция 589,2 млн долларов</b>, <b>хлопок 172,2 млн долларов</b>, <b>помидоры 172,1 млн долларов</b>, хлопковая пряжа 30,9, картофель 29,7, чай 5,0. Совокупный агро- и агропромышленный экспорт достиг <b>896,4 млн долларов</b> (+22,8%). По объёму: помидоры 142 909 т (−0,5%), яблоки 50 107 т (−7,9%), фундук 8 893 т (−22,3%). Падение фундука на 22,3% — самый резкий сигнал."},
     c:"FreshPlaza · APA · AzerNews (Yan–İyul 2026)", go:"markets"},

    {k:["subsidiya","subsidy","субсид","dəstək","поддержк","support","rate","dərəcə","ставк"],
     q:{az:"2026-cı ilin yeni subsidiya dərəcələri nədir?",en:"What are the new 2026 subsidy rates?",ru:"Каковы новые ставки субсидий на 2026 год?"},
     a:{az:"7 sentyabr 2026-da Aqrar Subsidiya Şurası paketi təsdiqləyib. Əsas dərəcələr: buğda müasir suvarma ilə <b>400 AZN/ha</b> (ənənəvi 200), kartof-tərəvəz-paxlalılar müasir suvarma <b>500 AZN/ha</b>, lazer hamarlama ilk il <b>+250 AZN/ha</b>, pambıq damcı suvarma <b>300 AZN/t</b>, soyudulmuş xam süd <b>70 AZN/t</b>, qırmızıbalıq və nərə <b>2,000 AZN/t</b> (ilk dəfə). Texnika və suvarmaya güzəşt payı 50%-ə (yerli damcı 60%) qaldırılıb. 2024-cü ildə ödənilmiş subsidiya 362.5 mln AZN, 380,704 fermerə olub. 2026–2030 Dövlət Proqramının maliyyəsi təxminən 2 mlrd AZN-dir.",
        en:"The Agrarian Subsidy Council approved the package on 7 September 2026. Headline rates: wheat under modern irrigation <b>400 AZN/ha</b> (traditional 200), potatoes/vegetables/legumes under modern irrigation <b>500 AZN/ha</b>, laser levelling first year <b>+250 AZN/ha</b>, cotton under drip <b>300 AZN/t</b>, chilled raw milk <b>70 AZN/t</b>, salmonids and sturgeon <b>2,000 AZN/t</b> (first ever). Concessions on machinery and irrigation rise to 50% (local drip 60%). Subsidies paid in 2024 were AZN 362.5 mn to 380,704 farmers, and the 2026–2030 State Programme envelope is around AZN 2 bn.",
        ru:"7 сентября 2026 года Аграрный совет по субсидиям утвердил пакет. Основные ставки: пшеница при современном орошении <b>400 AZN/га</b> (традиционное — 200), картофель/овощи/зернобобовые при современном орошении <b>500 AZN/га</b>, лазерное выравнивание в первый год <b>+250 AZN/га</b>, хлопок при капельном орошении <b>300 AZN/т</b>, охлаждённое сырое молоко <b>70 AZN/т</b>, лососёвые и осетровые <b>2 000 AZN/т</b> (впервые). Льготы на технику и орошение повышены до 50% (местное капельное — 60%). В 2024 году выплачено 362,5 млн AZN 380 704 фермерам, объём Госпрограммы 2026–2030 — около 2 млрд AZN."},
     c:"AZERTAC · BAKU.WS (07.09.2026) · APA (2024 faktiki)", go:"economy"},

    {k:["su","suvarma","water","irrigation","орошен","вод","quraqlıq","drought","засух"],
     q:{az:"Suvarma və su riski üzrə vəziyyət nədir?",en:"Where do we stand on irrigation and water risk?",ru:"Каково положение с орошением и водным риском?"},
     a:{az:"Müasir suvarma sistemləri <b>130,000 ha</b>-nı əhatə edir — ümumi suvarılan sahənin (təxminən 1.45 mln ha) 10%-dən azı. 2030 hədəfi <b>300,000 ha</b>-dır. Taxıl əkinlərinin təxminən <b>50%-i dəmyədir</b>, halbuki ixrac bitkilərinin praktiki olaraq hamısı suvarılan torpaqlarda yetişdirilir. Yeni subsidiya sistemi bunu birbaşa hədəfə alır: müasir suvarma ilə buğdaya 400 AZN/ha, ənənəvi üsulla 200 AZN/ha. Azad edilmiş ərazilərdə əlavə 80,000 ha-nın suvarma suyu ilə təchizatı planlaşdırılır.",
        en:"Modern irrigation systems cover <b>130,000 ha</b> — less than 10% of roughly 1.45 mn ha of irrigated land. The 2030 target is <b>300,000 ha</b>. About <b>50% of grain area is rain-fed</b>, while practically all export crops are grown on irrigated land. The new subsidy design targets this directly: 400 AZN/ha for wheat under modern irrigation against 200 AZN/ha under traditional methods. A further 80,000 ha in the liberated territories is planned for irrigation water supply.",
        ru:"Современные системы орошения охватывают <b>130 000 га</b> — менее 10% от примерно 1,45 млн га орошаемых земель. Цель на 2030 год — <b>300 000 га</b>. Около <b>50% площадей под зерновыми — неорошаемые</b>, тогда как практически все экспортные культуры выращиваются на орошаемых землях. Новая схема субсидий направлена именно на это: 400 AZN/га для пшеницы при современном орошении против 200 AZN/га при традиционных методах. Дополнительно планируется обеспечить поливной водой 80 000 га на освобождённых территориях."},
     c:"Trend · Caliber.az (Nazir bəyanatı) · APA · AZERTAC", go:"simulator"},

    {k:["inflyasiya","inflation","инфляц","qiymət","price","цен","ərzaq","food","продовольств","fao"],
     q:{az:"Ərzaq qiymətləri və inflyasiya necə hərəkət edir?",en:"How are food prices and inflation moving?",ru:"Как движутся цены на продовольствие и инфляция?"},
     a:{az:"Daxildə: ərzaq, alkoqol və tütün üzrə İQİ iyul 2026-da illik <b>+7.3%</b> (aylıq −0.4%), ümumi İQİ isə +5.8%. Yanvar-iyul ortalaması ərzaq üzrə +6.8%. Xaricdə: FAO Ərzaq Qiymət İndeksi avqustda <b>133.3 bənd</b> (aylıq +1.9%, illik +2.5%) — taxıl 116.3 (+2.2%, may 2024-dən ən yüksək), bitki yağları 196.9 (+0.6%, iyun 2022-dən ən yüksək), şəkər 106.4 (+11.9%). Xarici təzyiq daxili ərzaq inflyasiyasına növbəti aylarda ötürülə bilər.",
        en:"Domestically: CPI for food, alcohol and tobacco was <b>+7.3% y/y</b> in July 2026 (−0.4% m/m) against headline CPI of +5.8%, with a Jan–Jul food average of +6.8%. Externally: the FAO Food Price Index reached <b>133.3 points</b> in August (+1.9% m/m, +2.5% y/y) — cereals 116.3 (+2.2%, highest since May 2024), vegetable oils 196.9 (+0.6%, highest since June 2022), sugar 106.4 (+11.9%). External pressure may pass through to domestic food inflation in the coming months.",
        ru:"Внутри страны: ИПЦ на продукты питания, алкоголь и табак в июле 2026 года составил <b>+7,3% г/г</b> (−0,4% м/м) против общего ИПЦ +5,8%, средний показатель по продовольствию за янв–июл — +6,8%. Внешне: Индекс продовольственных цен ФАО в августе достиг <b>133,3 пункта</b> (+1,9% м/м, +2,5% г/г) — зерновые 116,3 (+2,2%, максимум с мая 2024), растительные масла 196,9 (+0,6%, максимум с июня 2022), сахар 106,4 (+11,9%). Внешнее давление может передаться на внутреннюю продовольственную инфляцию в предстоящие месяцы."},
     c:"stat.gov.az (İyul 2026) · FAO (Avqust 2026, 04.09.2026 buraxılışı)", go:"markets"},

    {k:["taxıl","yığım","harvest","grain","уборк","зерн","məhsuldarlıq","yield","урожай"],
     q:{az:"2026 taxıl yığımı necə gedir?",en:"How is the 2026 grain harvest going?",ru:"Как проходит уборка зерна 2026 года?"},
     a:{az:"28 iyul 2026 tarixinə buğda və arpa üzrə <b>3 mln tondan çox</b> yığılıb və payızlıq taxıl yığımının <b>92%-i</b> tamamlanıb. 15 iyul tarixinə 755,500 ha-dan 2.637 mln ton götürülmüşdü, orta məhsuldarlıq <b>34.9 sentner/ha</b> — 2025-in eyni tarixindəki 33.5 sentner/ha ilə müqayisədə artım. 2025-ci ilin tam nəticəsi 3.376 mln ton (+3%) olub; qeyd: SSK mənbələrində 3.278 mln ton alternativ göstərici də var və bu, təsdiqlənməlidir.",
        en:"As at 28 July 2026 more than <b>3 mn t</b> of wheat and barley had been gathered, with <b>92%</b> of the winter grain harvest complete. As at 15 July, 2.637 mn t had come off 755,500 ha at an average yield of <b>34.9 centners/ha</b>, up from 33.5 centners/ha on the same date in 2025. Full-year 2025 was 3.376 mn t (+3%); note that an alternative SSC-attributed figure of 3.278 mn t also circulates and should be reconciled.",
        ru:"На 28 июля 2026 года собрано более <b>3 млн т</b> пшеницы и ячменя, уборка озимых завершена на <b>92%</b>. На 15 июля с 755 500 га получено 2,637 млн т при средней урожайности <b>34,9 ц/га</b> против 33,5 ц/га на ту же дату 2025 года. Полный результат 2025 года — 3,376 млн т (+3%); отметим, что также встречается альтернативная оценка ГСК 3,278 млн т, которую следует сверить."},
     c:"AzerNews · Caliber.az (Mərkəzi Taxıl Qərargahı) · stat.gov.az", go:"economy"},

    {k:["ai","süni intellekt","ии","искусственн","artificial","rəqəmsal","digital","цифров","ektis","eagro"],
     q:{az:"Digər ölkələr kənd təsərrüfatında süni intellekti necə tətbiq edir?",en:"How are other countries deploying AI in agriculture?",ru:"Как другие страны применяют ИИ в сельском хозяйстве?"},
     a:{az:"<b>Hindistan</b> — Kerala ştatının KATHIR platforması peyk təsvirləri və süni intellekt analitikası ilə 3 mln-dan çox fermer və 1.1 mln ha üzrə məlumatı subsidiyaların ünvanlanması və məhsuldarlığın qiymətləndirilməsi üçün istifadə edir; Maharaştranın MahaVISTAAR səs botu bir necə ayda 3 mln-dan çox yüklənib. <b>Özbəkistan</b> — Cənubi Koreya ilə birlikdə CİS platforması və süni intellekt proqnoz modeli daxil milli platforma qurur. <b>Qazaxıstan</b> — FAO ilə dron məlumatlarının rəqəmsal panellərə inteqrasiyası üzərində işləyir. <b>ABŞ</b> — USDA aqrar məlumat toplanmasının modernləşdirilməsi planını açıqlayıb. Azərbaycanın nisbi üstünlüyü artıq işləyən eAgro/EKTİS platformasıdır: 7 sentyabr paketinin beş bəndi süni intellekt monitorinqini birbaşa subsidiya şərtinə çevirir.",
        en:"<b>India</b> — Kerala's KATHIR platform combines satellite imagery and AI analytics over data on 3m+ farmers and 1.1m+ ha mapped, for subsidy targeting and yield estimation; Maharashtra's MahaVISTAAR voice bot passed 3m downloads in a few months. <b>Uzbekistan</b> — building a national platform with South Korea, including a GIS platform and an AI forecasting model. <b>Kazakhstan</b> — working with FAO on integrating UAV data into digital dashboards. <b>USA</b> — USDA has announced a plan to modernise agricultural data collection. Azerbaijan's relative advantage is the eAgro/EKTIS platform already in production: five clauses of the 7 September package turn AI monitoring directly into a subsidy condition.",
        ru:"<b>Индия</b> — платформа KATHIR штата Керала объединяет спутниковые снимки и ИИ-аналитику по данным о более 3 млн фермеров и 1,1 млн га — для адресности субсидий и оценки урожайности; голосовой бот MahaVISTAAR в Махараштре превысил 3 млн загрузок за несколько месяцев. <b>Узбекистан</b> — строит национальную платформу совместно с Южной Кореей, включая ГИС-платформу и модель прогнозирования на ИИ. <b>Казахстан</b> — работает с ФАО над интеграцией данных дронов в цифровые панели. <b>США</b> — Минсельхоз объявил план модернизации сбора сельхозданных. Относительное преимущество Азербайджана — уже действующая платформа eAgro/ЕКТИС: пять пунктов пакета от 7 сентября превращают ИИ-мониторинг непосредственно в условие получения субсидии."},
     c:"World Bank · Trend · Qazinform · USDA · AZERTAC", go:"ai"},

    {k:["gübrə","fertiliser","fertilizer","удобрен","karbamid","urea","карбамид","dap","daf","giriş","input","затрат"],
     q:{az:"Gübrə və giriş xərcləri necə dəyişir?",en:"How are fertiliser and input costs moving?",ru:"Как меняются затраты на удобрения и ресурсы?"},
     a:{az:"Karbamid <b>443 USD/t</b> — həftədə +3.5%, ayda +13.6%, illik +13.2%. Qiymət aprelin ortasında Hörmüz boğazının bağlanması ilə 700 dolları keçib, avqustun əvvəlində təxminən 400 dollara düşüb, indi yenidən artır. DAF <b>792.5 USD/t</b> (illik +4.3%). Brent 97.02 dollar/barreldir (illik +47%) — bu, həm gübrə xərcinə təzyiq, həm də fiskal imkanın artması deməkdir. Praktik nəticə: hektar üzrə subsidiya dərəcələrinin real dəyəri 2027 səpin mövsümündə azalacaq.",
        en:"Urea is at <b>USD 443/t</b> — +3.5% w/w, +13.6% m/m, +13.2% y/y. It passed USD 700/t in mid-April on the Strait of Hormuz closure, fell to roughly USD 400/t by early August and is now rebounding. DAP is at <b>USD 792.5/t</b> (+4.3% y/y). Brent at USD 97.02/bbl (+47% y/y) means both pressure on fertiliser costs and greater fiscal headroom. The practical implication: the real value of per-hectare subsidy rates will erode into the 2027 sowing season.",
        ru:"Карбамид на уровне <b>443 USD/т</b> — +3,5% н/н, +13,6% м/м, +13,2% г/г. В середине апреля цена превышала 700 долларов из-за закрытия Ормузского пролива, к началу августа опустилась примерно до 400 долларов и сейчас снова растёт. ДАФ — <b>792,5 USD/т</b> (+4,3% г/г). Brent на уровне 97,02 доллара за баррель (+47% г/г) означает как давление на стоимость удобрений, так и рост фискальных возможностей. Практический вывод: реальная ценность гектарных ставок субсидий будет размываться к посевной 2027 года."},
     c:"Trading Economics (04.09.2026)", go:"markets"},

    {k:["heyvandarlıq","livestock","животноводств","süd","milk","молок","ət","meat","мяс"],
     q:{az:"Heyvandarlıq sektorunun vəziyyəti nədir?",en:"What is the state of the livestock sector?",ru:"Каково состояние животноводческого сектора?"},
     a:{az:"2025-ci ildə heyvandarlıq məhsulu <b>7,440 mln AZN</b> (+0.3%) — bitkiçilikdən (6,750 mln AZN) böyükdür. Fiziki həcm: ət 659,200 ton (dəyişməz), süd 2.306 mln ton (+0.3%), yumurta 2.343 mlrd ədəd (+1.8%), yun 14,600 ton (−1.3%), barama 186.6 ton (−22.1%). Sürü: 01.01.2026 tarixinə qoyun və keçi 6.758 mln baş, qaramal 2.436 mln baş (o cümlədən 1.207 mln sağmal). Sektorun artımı praktiki olaraq dayanıb — 7 sentyabr paketi bunu hədəfə alır: soyudulmuş xam südə 70 AZN/t, südlük cinsli heyvana 1,500 AZN/baş, otlaq heyvandarlığına 4 AZN/baş.",
        en:"In 2025 livestock output was <b>AZN 7,440 mn</b> (+0.3%), larger than crop production at AZN 6,750 mn. In volume: meat 659,200 t (flat), milk 2.306 mn t (+0.3%), eggs 2.343 bn (+1.8%), wool 14,600 t (−1.3%), silk cocoons 186.6 t (−22.1%). Herd as at 1 Jan 2026: sheep and goats 6.758 mn head, cattle 2.436 mn head (of which 1.207 mn milking). Growth has effectively stalled — the 7 September package targets exactly this: 70 AZN/t on chilled raw milk, 1,500 AZN/head for dairy breeding animals and 4 AZN/head for pasture livestock.",
        ru:"В 2025 году продукция животноводства составила <b>7 440 млн AZN</b> (+0,3%), что больше растениеводства (6 750 млн AZN). В натуральном выражении: мясо 659 200 т (без изменений), молоко 2,306 млн т (+0,3%), яйца 2,343 млрд шт. (+1,8%), шерсть 14 600 т (−1,3%), шелковичные коконы 186,6 т (−22,1%). Поголовье на 01.01.2026: овцы и козы 6,758 млн голов, КРС 2,436 млн голов (в т.ч. 1,207 млн дойных). Рост фактически остановился — пакет от 7 сентября направлен именно на это: 70 AZN/т за охлаждённое сырое молоко, 1 500 AZN/голова за молочных племенных животных и 4 AZN/голова за пастбищное животноводство."},
     c:"stat.gov.az / Interfax (2025) · AZERTAC (07.09.2026)", go:"economy"},

    {k:["fındıq","hazelnut","фундук","alma","apple","яблок","pomidor","tomato","помидор","istixana","greenhouse","теплиц"],
     q:{az:"Meyvə-tərəvəz ixracında hansı problemlər var?",en:"What problems are showing up in fruit and vegetable exports?",ru:"Какие проблемы видны в плодоовощном экспорте?"},
     a:{az:"Üç siqnal var. <b>Fındıq</b>: ixrac Yan–İyul 2026-da 8,892.5 tona düşüb (−22.3%), Türkiyə isə 2026/27 rəsmi alış qiymətini 50%-dən çox artırıb — bazar payı riski. <b>Alma</b>: ixrac 50,106.6 ton (−7.9%). <b>İstixana pomidoru</b>: istehsal 2024-də 224.9 min tondan 2025-də 156.8 min tona düşüb (−30%), halbuki pomidor 172.1 mln dollarla ikinci ən böyük ixrac maddəsidir. Ümumi meyvə-tərəvəz ixracı isə 589.2 mln dollarla artmaqda davam edir — problem həcmdə deyil, konkret xətlərdə.",
        en:"Three signals. <b>Hazelnuts</b>: exports fell to 8,892.5 t in Jan–Jul 2026 (−22.3%) while Türkiye raised its 2026/27 official purchase price by more than 50% — a market share risk. <b>Apples</b>: exports 50,106.6 t (−7.9%). <b>Greenhouse tomatoes</b>: output fell from 224.9k t in 2024 to 156.8k t in 2025 (−30%), even though tomatoes are the second-largest export line at USD 172.1 mn. Total fruit and vegetable exports are still growing at USD 589.2 mn — the problem is in specific lines, not in the aggregate.",
        ru:"Три сигнала. <b>Фундук</b>: экспорт упал до 8 892,5 т в янв–июл 2026 года (−22,3%), тогда как Турция повысила официальную закупочную цену на 2026/27 более чем на 50% — риск потери доли рынка. <b>Яблоки</b>: экспорт 50 106,6 т (−7,9%). <b>Тепличные помидоры</b>: производство упало с 224,9 тыс. т в 2024 году до 156,8 тыс. т в 2025 году (−30%), хотя помидоры — вторая по величине экспортная позиция с 172,1 млн долларов. Общий плодоовощной экспорт всё ещё растёт — 589,2 млн долларов; проблема в конкретных позициях, а не в агрегате."},
     c:"FreshPlaza · AzerNews · EastFruit · Commodity Board", go:"markets"},

    {k:["ümumi","overall","общ","iqtisadiyyat","economy","эконом","üdm","gdp","ввп","vəziyyət","state","состоян"],
     q:{az:"Aqrar sektorun ümumi vəziyyəti necədir?",en:"What is the overall state of the agricultural sector?",ru:"Каково общее состояние аграрного сектора?"},
     a:{az:"Yan–İyul 2026-da kənd təsərrüfatı məhsulunun həcmi <b>8,797.2 mln AZN</b> olub, real artım <b>+2.8%</b> — 2025-ci ilin tam ili üzrə +0.9%-dən sürətlidir. Sektor ÜDM-in <b>5.9%</b>-ni, qeyri-neft ÜDM-in isə 8.3%-ni təşkil edir, məşğulluğun təxminən 34.7%-i bu sahə ilə bağlıdır. 2025-ci ildə ümumi məhsul 14,190 mln AZN (bitkiçilik 6,750, heyvandarlıq 7,440) olub. Ən güclü tərəf ixracdır: Yan–İyul 2026-da <b>+22.8%</b> artımla 896.4 mln dollar. Ən zəif tərəf ticarət balansıdır: 2025-də ərzaq idxalı 2,591 mln dollar, aqrar ixrac isə 1,300 mln dollar — təxminən <b>1.3 mlrd dollar kəsir</b>.",
        en:"Agricultural output in Jan–Jul 2026 was <b>AZN 8,797.2 mn</b> with real growth of <b>+2.8%</b>, faster than the +0.9% recorded for full-year 2025. The sector is <b>5.9%</b> of GDP and 8.3% of non-oil GDP, and roughly 34.7% of employment is connected to it. Full-year 2025 output was AZN 14,190 mn (crops 6,750, livestock 7,440). The strongest feature is exports: USD 896.4 mn in Jan–Jul 2026, up <b>22.8%</b>. The weakest is the trade balance: 2025 food imports of USD 2,591 mn against agri exports of USD 1,300 mn — a deficit of roughly <b>USD 1.3 bn</b>.",
        ru:"Производство сельхозпродукции в янв–июл 2026 года составило <b>8 797,2 млн AZN</b> при реальном росте <b>+2,8%</b>, что быстрее +0,9% за весь 2025 год. Сектор составляет <b>5,9%</b> ВВП и 8,3% ненефтяного ВВП, около 34,7% занятости связано с ним. Полный результат 2025 года — 14 190 млн AZN (растениеводство 6 750, животноводство 7 440). Сильнейшая сторона — экспорт: 896,4 млн долларов в янв–июл 2026 года, рост на <b>22,8%</b>. Слабейшая — торговый баланс: в 2025 году импорт продовольствия 2 591 млн долларов против агроэкспорта 1 300 млн долларов, дефицит около <b>1,3 млрд долларов</b>."},
     c:"stat.gov.az · APA · Interfax · ereforms.gov.az", go:"economy"}
  ],

     aisum:{az:"Aran su anbarları beşillik ortadan ~11% aşağıdır; 2027 mövsümü üçün müasir suvarma subsidiyasının (400/200 AZN/ha) təsdiqi və ~15 000 ha keçid təcili qərar tələb edir.",en:"Aran reservoirs are ~11% below the five-year average; confirming the modern-irrigation subsidy (400/200 AZN/ha) and ~15,000 ha of conversion is an urgent decision for the 2027 season.",ru:"Водохранилища Арана ~на 11% ниже среднепятилетнего; для сезона 2027 срочно нужно утвердить субсидию на современное орошение (400/200 AZN/га) и перевести ~15 000 га."},

        body:[{az:"Aran zonası üzrə su anbarlarındakı ehtiyat beşillik ortadan təxminən 11% aşağıdır; bunun səbəbi payızın daha isti və quraq keçməsidir.",en:"Reservoir storage across the Aran zone is running approximately 11% below the five-year average, driven by a warmer, drier autumn.",ru:"Запасы водохранилищ по Аранской зоне примерно на 11% ниже среднепятилетнего показателя из-за более тёплой и засушливой осени."},
              {az:"Bu payız damcı və pivot sistemlərinə keçid sürətləndirilməzsə, 2027-ci ilin buğda və pambıq mövsümləri ciddi su təminatı riski daşıyır.",en:"Without accelerated conversion to drip and pivot systems this autumn, the 2027 wheat and cotton seasons carry a material water-supply risk.",ru:"Без ускоренного перехода на капельные и круговые системы этой осенью сезоны пшеницы и хлопка 2027 года несут существенный риск водоснабжения."},
              {az:"Tövsiyə: hektar başına subsidiya dərəcəsini indi təsdiqləmək lazımdır ki, sentyabrın sonuna qədər podratçılar üçün tender keçirilsin və yazadək təxminən 15 000 hektar sahə keçid alsın.",en:"Recommendation: confirm the per-hectare subsidy rate now so contractors can be tendered before the end of September and ~15,000 ha can be converted before spring.",ru:"Рекомендация: утвердить ставку субсидии на гектар сейчас, чтобы до конца сентября провести тендер для подрядчиков и до весны перевести около 15 000 га."}]},

       {id:"m1-d4", type:"decree", fmt:"PDF", pages:3, mod:"2026-09-08",
        t:{az:"Qərar layihəsi — müasir suvarma subsidiyasının bölgüsü (hektara 400/200 AZN)",en:"Draft decree — modern-irrigation subsidy split (400/200 AZN/ha)",ru:"Проект постановления — распределение субсидии на современное орошение (400/200 AZN/га)"},
        body:[{az:"Maddə 1. Hektara 400 AZN subsidiya təsdiqlənmiş müasir (damcı/pivot) suvarma sistemləri üçün nəzərdə tutulur; qismən modernləşdirmələrə hektara 200 AZN tətbiq edilir.",en:"Article 1. A subsidy of 400 AZN/ha is reserved for verified modern (drip/pivot) irrigation systems; 200 AZN/ha applies to partial upgrades.",ru:"Статья 1. Субсидия 400 AZN/га предназначена для подтверждённых современных (капельных/круговых) систем орошения; 200 AZN/га применяется к частичной модернизации."},

     transcript:[
       {sp:"Rəşad Məmmədov", r:{az:"Nazir müavini",en:"Deputy Minister",ru:"Заместитель министра"}, x:{az:"Aran zonasında su anbarlarının səviyyəsi beşillik ortadan 11% aşağıdır. Bu payız müasir suvarmanı sürətləndirməsək, 2027-ci ilin buğda və pambıq mövsümləri real su riski daşıyacaq.",en:"Reservoir levels in the Aran zone are eleven percent below the five-year average. If we do not accelerate modern irrigation this autumn, the 2027 wheat and cotton seasons carry a real water risk.",ru:"Уровни водохранилищ в Аранской зоне на одиннадцать процентов ниже среднепятилетних. Если этой осенью мы не ускорим современное орошение, сезоны пшеницы и хлопка 2027 года понесут реальный водный риск."}},
       {sp:"Leyla Orucova", r:{az:"Su Təsərrüfatı ASC",en:"Water Farm OJSC",ru:"ОАО «Водное хозяйство»"}, x:{az:"Yazadək təxminən on beş min hektarı damcı və pivot sistemlərinə keçirə bilərik, amma yalnız hektar başına subsidiya indi təsdiqlənsə. Podratçılara sentyabrın sonuna qədər tender lazımdır.",en:"We can convert roughly fifteen thousand hectares to drip and pivot systems before spring, but only if the per-hectare subsidy is confirmed now. Contractors need the tender by the end of September.",ru:"До весны мы можем перевести примерно пятнадцать тысяч гектаров на капельные и круговые системы, но только если субсидия на гектар будет утверждена сейчас. Подрядчикам нужен тендер до конца сентября."}},
       {sp:{az:"Nazir",en:"Minister",ru:"Министр"}, r:{az:"Kənd təsərrüfatı naziri",en:"Minister of Agriculture",ru:"Министр сельского хозяйства"}, x:{az:"Onda bölgünü bu həftə təsdiqləyin. İstəyirəm ki, dörd yüz manatlıq dərəcə təsdiqlənmiş müasir sistemlər üçün ayrılsın və quraşdırılmış sahənin bəyannaməyə uyğunluğunu yoxlamaq üçün eAgro peyk qatlarından istifadə edilsin.",en:"Then confirm the split this week. I want the four-hundred manat rate reserved for verified modern systems, and I want eAgro satellite layers used to check that installed area matches the declaration.",ru:"Тогда утвердите распределение на этой неделе. Я хочу, чтобы ставка в четыреста манатов была закреплена за подтверждёнными современными системами, и чтобы спутниковые слои eAgro использовались для проверки соответствия установленной площади декларации."}},
       {sp:"Kamran Rəhimov", r:{az:"eAgro",en:"eAgro",ru:"eAgro"}, x:{az:"Su qıtlığı və bitkinin su tələbatı qatları artıq bütün rayonları əhatə edir. Ödənişdən sonra iki həftə ərzində suvarma bəyan edilib, lakin infrastruktur imzası görünmürsə, istənilən sahəni işarələyə bilərik.",en:"The water-stress and crop-water-demand layers already cover all districts. We can flag any parcel where irrigation is claimed but no infrastructure signature appears within two weeks of payment.",ru:"Слои водного стресса и потребности культур в воде уже охватывают все районы. Мы можем отметить любой участок, где орошение заявлено, но подпись инфраструктуры не появляется в течение двух недель после оплаты."}}],

    {id:"m2",
     t:{az:"Fermer subsidiya mexanizminin baxışı", en:"Farmer subsidy mechanism review", ru:"Обзор механизма фермерских субсидий"},
     dt:"2026-09-08T14:30", end:"15:30", virtual:true, loc:null,
     tags:["subsidy","digital"],
     imp:true, urg:false, readiness:"high", delegate:"Aygün Hüseynova",
     aisum:{az:"30% əkin avansı üçün geri qaytarma qaydası və ilk mövsüm zərf həddi tələb olunur; hər süni intellekt işarəsi əl ilə apellyasiya kanalı ilə tamamlanmalıdır.",en:"The 30% sowing advance needs a clawback rule and a first-season envelope cap; every AI flag must be paired with a manual appeal channel.",ru:"Для 30% посевного аванса нужны правило возврата и предел объёма на первый сезон; каждую отметку ИИ следует сопровождать ручным каналом апелляции."},
     docs:[
       {id:"m2-d1", type:"agenda", fmt:"PDF", pages:1, mod:"2026-09-07",
        t:{az:"Gündəlik — fermer subsidiya mexanizminin baxışı",en:"Agenda — farmer subsidy mechanism review",ru:"Повестка — обзор механизма фермерских субсидий"},
        body:[{az:"1. 30%-lik əkin avansı subsidiyasının vəziyyəti (Subsidiya Departamenti).",en:"1. Status of the 30% advance sowing subsidy (Subsidy Department).",ru:"1. Статус 30% авансовой субсидии на посев (Департамент субсидий)."},
              {az:"2. Əkin baş tutmadığı hallarda avansların geri qaytarılması qaydası.",en:"2. Clawback rule for advances where sowing does not occur.",ru:"2. Правило возврата авансов в случаях, когда посев не состоялся."},
              {az:"3. Süni intellekt monitorinqinin işarələdiyi hallar üçün əl ilə apellyasiya kanalı.",en:"3. Manual appeal channel for AI monitoring flags.",ru:"3. Ручной канал апелляции для отметок ИИ-мониторинга."},
              {az:"4. İlk mövsüm avans zərfinin yuxarı həddi.",en:"4. First-season advance envelope cap.",ru:"4. Предельный объём аванса на первый сезон."}]},
       {id:"m2-d2", type:"briefing", fmt:"DOCX", pages:5, mod:"2026-09-07",
        t:{az:"Əkin avansı subsidiyası — geri qaytarma və apellyasiya dizaynı",en:"Advance sowing subsidy — clawback & appeal design",ru:"Авансовая субсидия на посев — механизм возврата и апелляции"},
        body:[{az:"30%-lik avans prinsipcə təsdiqlənib, lakin hazırda avans götürülüb əkin edilmədiyi hallar üçün müəyyən edilmiş geri qaytarma qaydası yoxdur.",en:"The 30% advance is approved in principle but currently lacks a defined clawback rule for cases where an advance is taken and sowing does not occur.",ru:"30% аванс в принципе одобрен, но пока отсутствует чёткое правило возврата для случаев, когда аванс получен, а посев не произведён."},
              {az:"Təklif: ilk mövsümün ümumi avans zərfinə yuxarı hədd qoymaq, geri qaytarmanı ilk ödənişdən əvvəl normativ aktda müəyyən etmək və hər avtomatik işarəni EKTİS-də məmur baxışı növbəsinə yönəltmək.",en:"Proposal: cap the total first-season advance envelope, define the clawback in regulation before the first payment, and route every automated flag into an EKTIS officer-review queue.",ru:"Предложение: установить предел общего объёма аванса на первый сезон, закрепить возврат в нормативном акте до первой выплаты и направлять каждую автоматическую отметку в очередь проверки сотрудником ЕКТИС."},
              {az:"Yanlış müsbət nəticələrdən qorunmaq üçün hər hansı geri tələbdən əvvəl əl ilə apellyasiya kanalı olmalıdır.",en:"A manual appeal channel must precede any reclaim to protect against false positives.",ru:"Перед любым возвратом средств должен действовать ручной канал апелляции для защиты от ложных срабатываний."}]},
       {id:"m2-d3", type:"memo", fmt:"PDF", pages:2, mod:"2026-09-06",
        t:{az:"Hüquqi memo: mütənasiblik və apellyasiya kanalı",en:"Legal memo: proportionality & appeal channel",ru:"Юридическая записка: соразмерность и канал апелляции"},
        body:[{az:"Hüquq və uyğunluq bölməsi bildirir ki, avtomatik monitorinq yanlış müsbət nəticələr verəcək; mütənasiblik hər hansı geri qaytarmadan əvvəl insan iştirakı ilə apellyasiya tələb edir.",en:"Legal & Compliance advises that automated monitoring will produce false positives; proportionality requires a human-in-the-loop appeal before any clawback.",ru:"Юридический отдел и комплаенс отмечают, что автоматический мониторинг даст ложные срабатывания; соразмерность требует апелляции с участием человека до любого возврата."},
              {az:"Geri qaytarma müddəası ilk ödənişdən əvvəl normativ aktda yazılmalıdır.",en:"The clawback provision should be written into the regulation prior to the first disbursement.",ru:"Положение о возврате должно быть закреплено в нормативном акте до первой выплаты."},
              {az:"Bu memo nümayiş məqsədli məlumatdır.",en:"This memo is demonstration data.",ru:"Эта записка является демонстрационными данными."}]}],
     attendees:[
       {n:"Aygün Hüseynova", r:{az:"Subsidiya Departamentinin rəhbəri",en:"Head of Subsidy Department",ru:"Начальник Департамента субсидий"}},
       {n:"Kamran Rəhimov", r:{az:"eAgro / EKTİS baş texnologiya direktoru",en:"CTO, eAgro / EKTIS",ru:"Технический директор eAgro / ЕКТИС"}},
       {n:"Elnur Səfərov", r:{az:"Hüquq və uyğunluq",en:"Legal & Compliance",ru:"Юридический отдел и комплаенс"}}],
     transcript:[
       {sp:"Aygün Hüseynova", r:{az:"Subsidiya Departamenti",en:"Subsidy Dept",ru:"Департамент субсидий"}, x:{az:"Otuz faizlik əkin avansı subsidiyası prinsipcə təsdiqlənib, lakin fermer avansı götürüb əkin etmədikdə nə baş verəcəyini müəyyən etməmişik. Geri qaytarma qaydası olmadan mexanizm risk altındadır.",en:"The thirty percent advance sowing subsidy is approved in principle, but we have not defined what happens when a farmer takes the advance and does not sow. Without a clawback rule the mechanism is exposed.",ru:"Тридцатипроцентная авансовая субсидия на посев в принципе одобрена, но мы не определили, что происходит, когда фермер берёт аванс и не сеет. Без правила возврата механизм уязвим."}},
       {sp:"Elnur Səfərov", r:{az:"Hüquqşünas",en:"Legal",ru:"Юрист"}, x:{az:"Geri qaytarma ilk ödənişdən əvvəl normativ aktda yazılmalıdır. Narahatlığım mütənasiblikdir — süni intellekt monitorinqi yanlış müsbət nəticələr verəcək və pul geri tələb edilməzdən əvvəl fermerin apellyasiya imkanı olmalıdır.",en:"We need the clawback written into the regulation before the first payment. My concern is proportionality — the AI monitoring will produce false positives, and a farmer must have a way to appeal before money is reclaimed.",ru:"Возврат должен быть прописан в нормативном акте до первой выплаты. Меня беспокоит соразмерность — ИИ-мониторинг даст ложные срабатывания, и у фермера должна быть возможность апелляции до возврата средств."}},
       {sp:{az:"Nazir",en:"Minister",ru:"Министр"}, r:{az:"Kənd təsərrüfatı naziri",en:"Minister of Agriculture",ru:"Министр сельского хозяйства"}, x:{az:"Razıyam. İlk mövsüm üçün ümumi avans zərfinə hədd qoyun, geri qaytarmanı müəyyən edin və hər avtomatik işarəni əl ilə apellyasiya kanalı ilə tamamlayın. Haqsız cəzalandırılan fermerlər barədə xəbər başlığı istəmirəm.",en:"Agreed. Cap the total advance envelope for the first season, define the clawback, and pair every automated flag with a manual appeal channel. I do not want a headline about wrongly penalised farmers.",ru:"Согласен. Установите предел общего объёма аванса на первый сезон, определите возврат и сопроводите каждую автоматическую отметку ручным каналом апелляции. Я не хочу заголовков о несправедливо наказанных фермерах."}},
       {sp:"Kamran Rəhimov", r:{az:"eAgro",en:"eAgro",ru:"eAgro"}, x:{az:"İşarələri EKTİS-də baxış növbəsinə yönəldə bilərik ki, hər hansı geri qaytarma tətbiq edilməzdən əvvəl məmur təsdiqləsin. Bu, prosesdə insan iştirakını saxlayır.",en:"We can route flags into a review queue in EKTIS so an officer confirms before any clawback is triggered. That keeps a human in the loop.",ru:"Мы можем направлять отметки в очередь проверки в ЕКТИС, чтобы сотрудник подтверждал их до запуска любого возврата. Так в процессе сохраняется участие человека."}}],
     analysis:{
       actions:[
         {az:"İlk ödənişdən əvvəl əkin baş tutmadığı avanslar üçün geri qaytarma qaydasını hazırlamaq.",en:"Write a clawback rule for advances where sowing does not occur, before the first payment.",ru:"Разработать правило возврата авансов при несостоявшемся посеве до первой выплаты."},
         {az:"Fiskal riski məhdudlaşdırmaq üçün ilk mövsümün ümumi avans zərfinə hədd qoymaq.",en:"Cap the total first-season advance envelope to limit fiscal exposure.",ru:"Ограничить общий объём аванса на первый сезон для снижения фискального риска."},
         {az:"Hər süni intellekt monitorinq işarəsini EKTİS-də əl ilə apellyasiya / məmur baxışı kanalı ilə tamamlamaq.",en:"Pair every AI monitoring flag with a manual appeal / officer-review channel in EKTIS.",ru:"Сопроводить каждую отметку ИИ-мониторинга ручным каналом апелляции / проверки сотрудником в ЕКТИС."}],
       people:[
         {n:"Aygün Hüseynova", r:{az:"Subsidiya Departamentinin rəhbəri",en:"Head of Subsidy Department",ru:"Начальник Департамента субсидий"}, o:{az:"Avans subsidiyasının parametrlərinə və zərf həddinə cavabdehdir.",en:"Owns the advance-subsidy parameters and envelope cap.",ru:"Отвечает за параметры авансовой субсидии и предельный объём."}},
         {n:"Elnur Səfərov", r:{az:"Hüquq və uyğunluq",en:"Legal & Compliance",ru:"Юридический отдел и комплаенс"}, o:{az:"Geri qaytarma normativ aktının hazırlanmasına cavabdehdir.",en:"Owns drafting of the clawback regulation.",ru:"Отвечает за разработку нормативного акта о возврате."}},
         {n:"Kamran Rəhimov", r:{az:"eAgro / EKTİS",en:"eAgro / EKTIS",ru:"eAgro / ЕКТИС"}, o:{az:"Baxış növbəsi və apellyasiya iş axınına cavabdehdir.",en:"Owns the review-queue and appeal workflow.",ru:"Отвечает за очередь проверки и процесс апелляции."}}],
       topics:["subsidy","digital"]}},

        body:[{az:"1. CBOT buğda qiymət proqnozu və Qara dəniz logistikası (Dövlət Taxıl Fondu).",en:"1. CBOT wheat price outlook and Black Sea logistics (State Grain Fund).",ru:"1. Прогноз цен на пшеницу CBOT и черноморская логистика (Государственный зерновой фонд)."},
