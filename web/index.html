    <div class="nm"><span class="src-b ${SRCCLS(n.src)}">${esc(n.src)}</span>
      <time>${esc(dfmt(n.date))}</time>
      <span class="tg">${esc(tx(TAGN[n.tag] || {en:n.tag}))}</span></div>
    <div class="nt">${esc(tx(n.t))}</div>
    ${LG !== 'az' && n.bucket === 'A' ? `<div class="no">${esc(n.t.az)}</div>` : ''}
    <div class="nd">${esc(tx(n.d))}</div></a>`;
}
function filtBtns(el, cur, opts, cb){
  document.getElementById(el).innerHTML = opts.map(([v,l]) =>
    `<button data-v="${esc(v)}" class="${v === cur ? 'on' : ''}">${esc(l)}</button>`).join('');
  document.getElementById(el).querySelectorAll('button').forEach(b =>
    b.onclick = () => cb(b.dataset.v));
}
function renderNews(){
  const bo = [['all',T('fAll')],['A',T('fLocal')],['B',T('fGlobal')],['C',T('fAI')]];
  filtBtns('ovFilt', ovBucket, bo, v => { ovBucket = v; renderNews(); });
  filtBtns('nwFilt', nwBucket, bo, v => { nwBucket = v; renderNews(); });
  const tags = [...new Set(F.news.map(n => n.tag))];
  filtBtns('nwTag', nwTag, [['all',T('fAll')], ...tags.map(t => [t, tx(TAGN[t] || {en:t})])],
    v => { nwTag = v; renderNews(); });

  const ov = F.news.filter(n => ovBucket === 'all' || n.bucket === ovBucket);
  document.getElementById('ovNews').innerHTML = ov.length
    ? ov.slice(0,10).map(newsItem).join('') : `<div class="empty">—</div>`;
  document.getElementById('newsCount').textContent = ov.length + ' ' + T('chipNews');

  const all = F.news.filter(n => (nwBucket === 'all' || n.bucket === nwBucket) && (nwTag === 'all' || n.tag === nwTag));
  document.getElementById('allNews').innerHTML = all.length
    ? all.map(newsItem).join('') : `<div class="empty">—</div>`;
  document.getElementById('newsCount2').textContent = all.length + ' / ' + F.news.length;
  document.getElementById('newsSync').textContent = T('newsSyncPrefix') + ' ' + dfmt(F.meta.synced.slice(0,10)) + ' 08:00';
}

/* ========================= CHARTS ========================= */
const CC = {dark:'#0E462A', green:'#0FA54F', mid:'#6BC182', light:'#B1D3BE', grey:'#DFDFDF',
  red:'#D0342C', warn:'#E08A15', ink:'#4A5C53', grid:'#EEF2EF'};
function killCharts(){ Object.keys(CH).forEach(k => { try{CH[k].destroy();}catch(e){} delete CH[k]; }); }
function mkChart(id, cfg){
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  /* plugins merge deeper than the rest: a chart that supplies its own legend
     or tooltip callbacks keeps the palette tooltip instead of falling back
     to the Chart.js default grey */
  const po = (cfg.options || {}).plugins || {};
  const pl = Object.assign({legend:{display:false}}, po,
    {tooltip:Object.assign({backgroundColor:CC.dark, padding:10, cornerRadius:6,
      titleFont:{family:'Segoe UI',size:12}, bodyFont:{family:'Segoe UI',size:12}}, po.tooltip || {})});
  cfg.options = Object.assign({responsive:true, maintainAspectRatio:false,
    scales:{x:{grid:{display:false}, ticks:{font:{family:'Segoe UI',size:10.5}, color:CC.ink}},
      y:{grid:{color:CC.grid}, border:{display:false}, ticks:{font:{family:'Segoe UI',size:10.5}, color:CC.ink}}}
  }, cfg.options || {});
  cfg.options.plugins = pl;
  CH[id] = new Chart(el, cfg);
}

  const cropL = {az:'Bitkiçilik',en:'Crop production',ru:'Растениеводство'}[LG];

  const expL = {az:'İxrac (aqrar + aqrosənaye)',en:'Exports (agri + agro-industrial)',ru:'Экспорт (агро + агропром)'}[LG];
  const impL = {az:'Ərzaq idxalı',en:'Food imports',ru:'Импорт продовольствия'}[LG];
  const defL = {az:'Kəsir',en:'Deficit',ru:'Дефицит'}[LG];
  mkChart('cTrade', {type:'bar',

      backgroundColor:[CC.green, CC.mid, CC.red], borderRadius:5, barPercentage:.6}]}});

  mkChart('cExp', {type:'bar',
    data:{labels:F.expo.filter(e => e.v != null).map(e => tx(e.n)),

  mkChart('cFao', {type:'bar',
    data:{labels:F.fao.sub.map(s => tx(s.n)),
      datasets:[{data:F.fao.sub.map(s => s.v),
        backgroundColor:F.fao.sub.map(s => s.d > 5 ? CC.red : (s.d > 1.5 ? CC.warn : CC.green)),

  const mv = F.comm.filter(c => c.m != null && c.m !== 0);

    options:{indexAxis:'y', scales:{y:{grid:{display:false}}}}});

/* ========================= SIMULATORS ========================= */
const DEM = 2.84, BASE_PROD = 1.573, BASE_IMP = 1.267, BASE_GRAIN = 3.376;
function rc(l, v, d, col){
  return `<div class="rc"><div class="rl">${esc(l)}</div>
    <div class="rv"${col ? ` style="color:${col}"` : ''}>${v}</div>
    <div class="rd">${esc(d || '')}</div></div>`;
}
function simWheat(){
  const ss = +document.getElementById('ss').value, y = +document.getElementById('y').value,
    ip = +document.getElementById('ip').value, im = +document.getElementById('im').value;
  document.getElementById('ssV').textContent = ss + '%';
  document.getElementById('yV').textContent = y.toFixed(2);
  document.getElementById('ipV').textContent = Math.round(ip);
  document.getElementById('imV').textContent = im + '%';

  const need = DEM * ss / 100, add = Math.max(0, need - BASE_PROD);
  const area = add * 1e6 / y;
  const rate = 400 * im / 100 + 200 * (1 - im / 100);
  const sub = area * rate / 1e6;                 // AZN mn
  const save = add * 1e6 * ip / 1e6;             // USD mn
  const saveA = save * 1.7;                      // AZN mn
  const net = sub - saveA;
  const imp = Math.max(0, DEM - need);
  document.getElementById('wRes').innerHTML =
    rc(T('resAddProd'), nf(add,3) + ' <small style="font-size:11px">mn t</small>', ss + '% → ' + nf(need,3) + ' mn t') +
    rc(T('resAddArea'), nf(area/1000,1) + ' <small style="font-size:11px">k ha</small>', y.toFixed(2) + ' t/ha') +
    rc(T('resSubCost'), nf(sub,1) + ' <small style="font-size:11px">AZN mn</small>', nf(rate,0) + ' AZN/ha', CC.red) +
    rc(T('resImpSave'), nf(save,1) + ' <small style="font-size:11px">USD mn</small>', nf(ip,1) + ' USD/t', CC.green) +
    rc(T('resNetCost'), (net > 0 ? '+' : '') + nf(net,1) + ' <small style="font-size:11px">AZN mn</small>',
       net > 0 ? (LG === 'az' ? 'xərc' : (LG === 'ru' ? 'затраты' : 'net cost')) : (LG === 'az' ? 'qənaət' : (LG === 'ru' ? 'экономия' : 'net saving')),
       net > 0 ? CC.red : CC.green) +
    rc(T('resImpVol'), nf(imp,3) + ' <small style="font-size:11px">mn t</small>',
       nf(BASE_IMP - imp,3) + ' mn t ' + (LG === 'az' ? 'azalma' : (LG === 'ru' ? 'снижение' : 'reduction')));

  const pts = [], lab = [];
  for (let s = 55; s <= 100; s += 5){
    const n = DEM * s / 100, a = Math.max(0, n - BASE_PROD);
    lab.push(s + '%');
    pts.push(+(a * 1e6 / y * rate / 1e6 - a * 1e6 * ip / 1e6 * 1.7).toFixed(1));
  }
  mkChart('cWheat', {type:'line',
    data:{labels:lab, datasets:[{data:pts, borderColor:CC.dark, backgroundColor:'rgba(15,165,79,.13)',
      fill:true, tension:.32, pointRadius:3, pointBackgroundColor:CC.green, borderWidth:2}]},
    options:{plugins:{tooltip:{callbacks:{label:c => (LG === 'az' ? 'Xalis: ' : (LG === 'ru' ? 'Чистый: ' : 'Net: ')) + nf(c.parsed.y,1) + ' AZN mn'}}}}});
}
function simIrr(){
  const it = +document.getElementById('it').value, yu = +document.getElementById('yu').value,
    ws = +document.getElementById('ws').value, cx = +document.getElementById('cx').value;
  document.getElementById('itV').textContent = it;
  document.getElementById('yuV').textContent = '+' + yu + '%';
  document.getElementById('wsV').textContent = ws + '%';
  document.getElementById('cxV').textContent = nf(cx);

  const add = Math.max(0, (it - 130) * 1000);
  const capex = add * cx / 1e6, state = capex * .5;
  const gain = add * 3.49 * yu / 100 / 1e6;          // mn t
  const gainV = gain * 1e6 * 287.5 / 1e6 * 1.7;      // AZN mn
  const water = add * 6000 * ws / 100 / 1e6;         // mn m3 at 6000 m3/ha
  const pay = gainV > 0 ? state / gainV : null;
  document.getElementById('iRes').innerHTML =
    rc(T('resAddIrr'), nf(add/1000,0) + ' <small style="font-size:11px">k ha</small>', '130k → ' + it + 'k ha') +

    rc(T('resStateShare'), nf(state,0) + ' <small style="font-size:11px">AZN mn</small>',
       LG === 'az' ? 'güzəşt 50%' : (LG === 'ru' ? 'льгота 50%' : 'concession 50%'), CC.red) +
    rc(T('resYieldGain'), nf(gain,3) + ' <small style="font-size:11px">mn t</small>',
       nf(gainV,0) + ' AZN mn ' + (LG === 'az' ? 'dəyər' : (LG === 'ru' ? 'стоимость' : 'value')), CC.green) +
    rc(T('resWaterSaved'), nf(water,0) + ' <small style="font-size:11px">mn m³</small>', ws + '% · 6,000 m³/ha') +
    rc(T('resPayback'), pay ? nf(pay,1) : '—',
       LG === 'az' ? 'il (dövlət payı üzrə)' : (LG === 'ru' ? 'лет (по доле государства)' : 'years (on state share)'),
       pay && pay < 8 ? CC.green : CC.warn);

  const lab = [], c1 = [], c2 = [];
  for (let t = 130; t <= 500; t += 50){
    const a = (t - 130) * 1000;
    lab.push(t + 'k'); c1.push(+(a * cx / 1e6 * .5).toFixed(0));
    c2.push(+(a * 3.49 * yu / 100 * 287.5 * 1.7 / 1e6).toFixed(0));
  }
  mkChart('cIrr', {type:'bar',
    data:{labels:lab, datasets:[
      {label:T('resStateShare'), data:c1, backgroundColor:CC.mid, borderRadius:4},
      {label:T('resYieldGain'), data:c2, backgroundColor:CC.dark, borderRadius:4}]},
    options:{plugins:{legend:{display:true, position:'bottom',
      labels:{font:{family:'Segoe UI',size:10.5}, boxWidth:10, padding:12, color:CC.ink}}}}});
}
function simDr(){
  const rn = +document.getElementById('rn').value, el = +document.getElementById('el').value,
    rf = +document.getElementById('rf').value, wp = +document.getElementById('wp').value;
  document.getElementById('rnV').textContent = (rn > 0 ? '+' : '') + rn + '%';
  document.getElementById('elV').textContent = el.toFixed(2);
  document.getElementById('rfV').textContent = rf + '%';
  document.getElementById('wpV').textContent = Math.round(wp);

  const eff = -rn / 100 * el;                                    // fractional yield loss on rain-fed
  const loss = BASE_GRAIN * (rf / 100) * eff;                    // mn t (positive = loss)
  const newProd = BASE_GRAIN - loss;
  const newImp = Math.max(0, BASE_IMP + loss);
  const extra = loss * 1e6 * wp / 1e6;                           // USD mn
  const newSS = Math.max(0, Math.min(100, (BASE_PROD - BASE_GRAIN * (rf/100) * eff * (BASE_PROD/BASE_GRAIN)) / DEM * 100));
  const newY = 3.49 * (1 - (rf/100) * eff);
  const sc = Math.abs(loss);
  const sev = sc < .1 ? [T('sevLow'), CC.green] : (sc < .3 ? [T('sevMed'), CC.warn] : (sc < .6 ? [T('sevHigh'), CC.red] : [T('sevCrit'), '#8A1810']));
  document.getElementById('dRes').innerHTML =
    rc(T('resLoss'), (loss >= 0 ? '−' : '+') + nf(Math.abs(loss),3) + ' <small style="font-size:11px">mn t</small>',
       nf(BASE_GRAIN,3) + ' → ' + nf(newProd,3) + ' mn t', loss > 0 ? CC.red : CC.green) +
    rc(T('resYieldNew'), nf(newY,2) + ' <small style="font-size:11px">t/ha</small>', '3.49 t/ha → ' + nf(newY,2)) +
    rc(T('resNewImport'), nf(newImp,3) + ' <small style="font-size:11px">mn t</small>',
       nf(BASE_IMP,3) + ' mn t ' + (LG === 'az' ? 'bazadan' : (LG === 'ru' ? 'от базы' : 'from base'))) +
    rc(T('resExtraCost'), (extra >= 0 ? '+' : '') + nf(extra,1) + ' <small style="font-size:11px">USD mn</small>',
       nf(wp,1) + ' USD/t', extra > 0 ? CC.red : CC.green) +
    rc(T('resNewSS'), nf(newSS,1) + '%', '55% → ' + nf(newSS,1) + '%', newSS < 50 ? CC.red : CC.warn) +
    rc(T('resSevere'), '<span style="font-size:16px">' + esc(sev[0]) + '</span>',
       nf(Math.abs(loss/BASE_GRAIN*100),1) + '% ' + (LG === 'az' ? 'istehsal itkisi' : (LG === 'ru' ? 'потери производства' : 'of output')), sev[1]);

  const lab = [], pts = [];
  for (let r = -60; r <= 20; r += 10){
    lab.push((r > 0 ? '+' : '') + r + '%');
    pts.push(+(BASE_GRAIN - BASE_GRAIN * (rf/100) * (-r/100*el)).toFixed(3));
  }
  mkChart('cDr', {type:'line',
    data:{labels:lab, datasets:[{data:pts, borderColor:CC.red, backgroundColor:'rgba(208,52,44,.11)',
      fill:true, tension:.3, pointRadius:3, pointBackgroundColor:CC.red, borderWidth:2}]},
    options:{plugins:{tooltip:{callbacks:{label:c => nf(c.parsed.y,3) + ' mn t'}}}}});
}
function runSims(){ simWheat(); simIrr(); simDr(); }

/* ========================= CHAT =========================
   Answers come from POST api/chat, which proxies to whichever LLM
   endpoint the deployment is configured with. The model is grounded
   in this panel's own data: the use-case demonstration figures and
   the curated Q&A are sent as context with every turn, so answers
   stay inside what the dashboard actually shows.                  */

const CHAT = [];
const CHAT_MAX = 24;               /* turns kept in the thread and sent as history */
let CHAT_BUSY = false;

function stripTags(s){ return String(s).replace(/<[^>]*>/g, ''); }

/* Escapes first, then adds markup — safe against anything the model returns.
   Bold is resolved per line so a stray ** cannot straddle two blocks. */
function mdToHtml(s){
  const lines = esc(String(s)).split(/\r?\n/);
  const bold = t => t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  let out = '', list = false;
  lines.forEach(ln => {
    const li = ln.match(/^\s*[-*\u2022]\s+(.*)$/);
    if (li){ if (!list){ out += '<ul>'; list = true; } out += `<li>${bold(li[1])}</li>`; return; }
    if (list){ out += '</ul>'; list = false; }
    if (ln.trim()) out += `<p>${bold(ln)}</p>`;
  });
  if (list) out += '</ul>';
  return out;
}

/* Compact grounding payload assembled from the panel's own data. */
function chatContext(){
  return {
    synced: F.meta.synced,
    headline_indicators: F.kpi.map(k => ({
      id:k.id, value:k.val, unit:k.unit, period:tx(k.per),
      note:k.note ? tx(k.note) : undefined, source:k.src})),
    use_cases: F.dash.map(d => {
      const u = (F.uc && F.uc[d.id]) || {};
      return {
        id:d.id, name:tx(d.t), description:tx(d.d),
        indicators:(u.kpi || []).map(k => `${tx(k.l)}: ${k.v}${k.u ? ' ' + k.u : ''}`),
        charts:(u.ch || []).map(c => ({
          title:ucLbl(c.ttl), unit:ucLbl(c.sub), labels:c.lb.map(ucLbl),
          series:c.ds.map(s => ({name:ucLbl(s.n), values:s.d}))})),
        table:u.tbl ? {title:tx(u.tbl.ttl), columns:u.tbl.cols.map(tx), rows:u.tbl.rows} : undefined,
        takeaway:u.note ? tx(u.note) : undefined
      };
    }),
    curated_answers: F.qa.map(x => ({question:tx(x.q), answer:stripTags(tx(x.a)), source:x.c}))
  };
}

function setChatState(s){ document.getElementById('chatState').textContent = s || ''; }

/* Nothing may be sent while a turn is in flight, and clearing mid-flight
   would orphan the reply. */
function chatLock(b){
  document.getElementById('ask').disabled = b;
  document.getElementById('chatClear').disabled = b;
}

function chatBubble(m){
  if (m.role === 'user')
    return `<div class="msg u"><div class="av">${esc(T('chatYou'))}</div>
      <div class="bub">${esc(m.content)}</div></div>`;
  /* m.err holds an I18N key so the message follows a language switch */
  const body = m.err
    ? `<div class="bub err">${esc(T(m.err))}</div>`
    : `<div class="bub">${mdToHtml(m.content)}${m.cite ? `<div class="cite">${esc(m.cite)}</div>` : ''}</div>`;
  return `<div class="msg a"><div class="av">AI</div>${body}</div>`;
}

function renderChat(){
  const log = document.getElementById('chatLog');
  if (!log) return;
  if (!CHAT.length && !CHAT_BUSY){
    log.innerHTML = `<div class="chat-empty">${esc(T('chatEmpty'))}</div>`;
  } else {
    log.innerHTML = CHAT.map(chatBubble).join('') + (CHAT_BUSY
      ? `<div class="msg a"><div class="av">AI</div>
          <div class="bub"><span class="typing"><i></i><i></i><i></i></span></div></div>`
      : '');
  }
  log.scrollTop = log.scrollHeight;
}

async function askChat(text){
  const q = String(text || '').trim();
  if (!q || CHAT_BUSY) return;
  CHAT.push({role:'user', content:q});
  if (CHAT.length > CHAT_MAX) CHAT.splice(0, CHAT.length - CHAT_MAX);
  CHAT_BUSY = true;
  chatLock(true);
  const box = document.getElementById('q');
  box.value = ''; box.style.height = 'auto';
  renderChat();
  setChatState(T('chatThinking'));
  let ek = 'chatErr';
  try {
    const r = await fetch('api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        lang:LG,
        messages:CHAT.filter(m => !m.err).map(m => ({role:m.role, content:m.content})),
        context:chatContext()
      })
    });
    if (!r.ok){
      ek = r.status === 503 ? 'chatErrCfg' : (r.status === 502 ? 'chatErrUp' : 'chatErrHttp');
      throw new Error('HTTP ' + r.status);
    }
    const j = await r.json();
    /* an empty reply would render as a blank bubble — treat it as an upstream fault */
    if (j.error || !j.reply){ ek = 'chatErrUp'; throw new Error(j.error || 'empty reply'); }
    CHAT.push({role:'assistant', content:j.reply,
      cite:j.model ? `${T('chatVia')} ${j.model}` : ''});
  } catch (e){
    CHAT.push({role:'assistant', err:ek});
  }
  CHAT_BUSY = false;
  chatLock(false);
  renderChat();
  setChatState('');
}

function renderAI(){
  document.getElementById('sugg').innerHTML = F.qa.slice(0,6).map(x =>

  document.getElementById('sugg').querySelectorAll('button').forEach(b =>

function ucPage(d){
  const u = (F.uc && F.uc[d.id]) || {};

  /* eAgro replica layout when one exists for this module */
  if (EG[d.id]) return `<section class="page eg" id="p-uc-${esc(d.id)}">
    ${egCrumb(d)}${EG[d.id](d, u)}
    <div class="mock-b">${esc(T('ucMock'))}</div>

  const kpi = (u.kpi || []).map(k =>
    `<div class="kpi${k.s ? ' ' + k.s : ''}">
      <div class="lb">${esc(tx(k.l))}</div>

/* deterministic pseudo-random so the synthetic parcels look the same on every render */
function egSeed(n){ let s = n >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function egInside(lat, lon, ring){
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++){
    const yi = ring[i][0], xi = ring[i][1], yj = ring[j][0], xj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
/* synthetic parcel grid clipped to the country outline; each cell knows its
   nearest district so district-level values can be painted as a choropleth */
let EG_CELLS = null;
function egCells(){
  if (EG_CELLS) return EG_CELLS;
  const rnd = egSeed(7), out = [], st = 0.062;
  for (let lat = 38.40; lat < 41.95; lat += st) for (let lon = 44.75; lon < 50.45; lon += st){
    const cy = lat + st / 2, cx = lon + st / 2;
    if (!egInside(cy, cx, AZ_OUTLINE[0]) && !egInside(cy, cx, AZ_OUTLINE[1])) continue;
    let best = null, bd = 1e9;
    F.districts.forEach(d => { const dd = (d.lat - cy) * (d.lat - cy) + (d.lon - cx) * (d.lon - cx); if (dd < bd){ bd = dd; best = d; } });
    const j = () => (rnd() - .5) * st * .5;
    out.push({lat:cy, lon:cx, d:best, r:rnd(), r2:rnd(), box:[[lat, lon], [lat + st, lon + st]],
      ring:[[lat + j(), lon + j()], [lat + j(), lon + st + j()], [lat + st + j(), lon + st + j()], [lat + st + j(), lon + j()]]});
  }
  EG_CELLS = out;
  return out;
}
/* regions with little or no declaration data on the rating maps */
const egNoData = d => /Qarabağ|Zəngəzur|Naxçıvan/.test(d.r);

    'Şirvan-Salyan':31,'Abşeron-Xızı':28,'Bakı':26,'Qarabağ':18,'Naxçıvan':24,'Şərqi Zəngəzur':15}[d.r] || 30;
  const h = (d.lat * 13 + d.lon * 7) % 1;
  return Math.round(base + h * 44 - 12);
}
/* economic-region alias for the district regions used in F.districts */
const EG_REG_ALIAS = {'Aran':'Mərkəzi Aran', 'Bakı':'Abşeron-Xızı', 'Şərqi Zəngəzur':'Kəlbəcər-Laçın'};
/* red → green ramp for ranked region strips */

/* finer grid (no jitter) for smooth district / region choropleths */
let EG_CELLS_F = null;
function egCellsFine(){
  if (EG_CELLS_F) return EG_CELLS_F;
  const out = [], st = 0.034;
  for (let lat = 38.40; lat < 41.95; lat += st) for (let lon = 44.75; lon < 50.45; lon += st){
    const cy = lat + st / 2, cx = lon + st / 2;

    let best = null, bd = 1e9;
    F.districts.forEach(d => { const dd = (d.lat - cy) * (d.lat - cy) + (d.lon - cx) * (d.lon - cx); if (dd < bd){ bd = dd; best = d; } });
    out.push({d:best, box:[[lat, lon], [lat + st, lon + st]]});
  }
  EG_CELLS_F = out;
  return out;
}
/* the 14 official economic regions, derived from the coarser region tag in F.districts */
const EG_REG_BY_DIST = {'İmişli':'Mil-Muğan','Beyləqan':'Mil-Muğan','Saatlı':'Mil-Muğan','Sabirabad':'Mil-Muğan',
  'Şamaxı':'Dağlıq Şirvan','İsmayıllı':'Dağlıq Şirvan','Ağsu':'Dağlıq Şirvan','Qobustan':'Dağlıq Şirvan',
  'Qazax':'Qazax-Tovuz','Ağstafa':'Qazax-Tovuz','Tovuz':'Qazax-Tovuz','Şəmkir':'Qazax-Tovuz','Gədəbəy':'Qazax-Tovuz'};

/* rough highland mask: Greater Caucasus ridge, Lesser Caucasus, Talış — few or no declared parcels */
function egHighland(lat, lon){
  const ridge = 41.35 - (lon - 46) * 0.19;
  if (lon > 45.9 && Math.abs(lat - ridge) < 0.16) return .8;
  if (lat < 40.95 && lon < 45.95 + (40.95 - lat) * 0.55) return .7;
  if (lat < 39.25 && lon < 48.55) return .65;
  if (lat > 40.25 && lat < 40.75 && lon > 48.75 && lon < 49.5) return .45;
  return 0;
}

/* semicircular gauge (farmer score) */
function egGauge(v, rank){
  const cx = 110, cy = 100, R = 82, r = 60;
  const pt = (a, rad) => [cx + rad * Math.cos(Math.PI * (1 - a)), cy - rad * Math.sin(Math.PI * (1 - a))];
  const seg = (a0, a1, col) => { const [x0,y0] = pt(a0,R), [x1,y1] = pt(a1,R), [x2,y2] = pt(a1,r), [x3,y3] = pt(a0,r);
    return `<path d="M${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}L${x2.toFixed(1)} ${y2.toFixed(1)}A${r} ${r} 0 0 0 ${x3.toFixed(1)} ${y3.toFixed(1)}Z" fill="${col}"/>`; };
  const cols = ['#D0342C','#EE7A2C','#F2C94C','#8BC34A','#2E7D32'];
  const ticks = [0,20,40,60,80,100].map(t => { const [x,y] = pt(t/100, R + 12); return `<text x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}" font-size="9" text-anchor="middle" fill="#4A5C53">${t}</text>`; }).join('');
  const [nx,ny] = pt(v / 100, R - 6);
  return `<svg viewBox="0 0 220 125" style="width:100%;max-width:240px;display:block;margin:0 auto">

  </svg>`;
}
function egWrap(s, n){
  const w = s.split(' '), out = [], cur = [];

  if (cur.length) out.push(cur.join(' '));

}

/* synthetic cadastral mosaic: irregular 4–7-vertex parcels of varying size, thinned out
   in the highlands, grey in the no-data regions, scores skewed to the low bands as in eAgro */
let EG_PARCELS = null;
function egParcels(){
  if (EG_PARCELS) return EG_PARCELS;
  const rnd = egSeed(11), out = [], st = 0.05;
  for (let lat = 38.40; lat < 41.95; lat += st) for (let lon = 44.75; lon < 50.45; lon += st){
    const cy = lat + st / 2 + (rnd() - .5) * st * .6, cx = lon + st / 2 + (rnd() - .5) * st * .6;
    if (!egInside(cy, cx, AZ_OUTLINE[0]) && !egInside(cy, cx, AZ_OUTLINE[1])) continue;
    let best = null, bd = 1e9;
    F.districts.forEach(d => { const dd = (d.lat - cy) * (d.lat - cy) + (d.lon - cx) * (d.lon - cx); if (dd < bd){ bd = dd; best = d; } });
    const nd = egNoData(best) || best.r === 'Bakı';
    if (rnd() < egHighland(cy, cx) + (nd ? .3 : .08)) continue;
    const n = 4 + Math.floor(rnd() * 4), sz = st * (0.5 + rnd() * 1.0), ex = 0.6 + rnd() * 0.9, rot = rnd() * Math.PI;
    const ring = [], kx = 1 / Math.cos(cy * Math.PI / 180);
    for (let i = 0; i < n; i++){
      const a = (i / n) * Math.PI * 2 + rnd() * (Math.PI * 2 / n) * .7, r = sz * (0.55 + rnd() * 0.45);
      const x = Math.cos(a) * r * ex, y = Math.sin(a) * r / ex;
      ring.push([cy + x * Math.sin(rot) + y * Math.cos(rot), cx + (x * Math.cos(rot) - y * Math.sin(rot)) * kx]);
    }
    const s = nd ? 0 : Math.max(0, Math.min(99, egDistScore(best) - 12 + (rnd() - .5) * 50 + (rnd() > .93 ? 30 : 0)));
    out.push({ring, nd, s});
  }
  EG_PARCELS = out;
  return out;
}

      L.polygon(c.ring, {renderer:cv, stroke:false, fillColor:EG_SPRAY[k], fillOpacity:.9, interactive:false}).addTo(m);
    });
  }
  mkChart('eg-st-t', egLineCfg(lb, [{n:'t', d:g.temp, c:'#E0782C'}], {min:20, max:40, yt:3, xt:21}));
  mkChart('eg-st-p', egLineCfg(lb, [{n:'p', d:g.prec, c:'#3B6FD1'}], {min:0, max:1.5, yt:4, xt:21}));

/* Built after renderCharts() so killCharts() does not wipe them. */
function renderUcCharts(){
  const AX = {font:{family:'Segoe UI',size:10.5}, color:CC.ink};
  F.dash.forEach(d => {
    const u = (F.uc && F.uc[d.id]) || {};
    if (EG[d.id]){
      try { if (EGD[d.id]) EGD[d.id](d, u); }
      catch (e) { console.error('EGD failed for ' + d.id, e); }
      return;
    }
    (u.ch || []).forEach(c => {
      const ds = c.ds.map(s => {
        const b = {label:ucLbl(s.n), data:s.d};
        if (s.ax) b.yAxisID = s.ax;
        if (c.ty === 'doughnut') return Object.assign(b,
          {backgroundColor:(s.cols || []).map(k => CC[k] || CC.green), borderWidth:0});
        if (c.ty === 'line') return Object.assign(b,
          {borderColor:CC[s.c] || CC.green, backgroundColor:'transparent', borderWidth:2,
           tension:.34, pointRadius:2.4, pointBackgroundColor:CC[s.c] || CC.green});
        return Object.assign(b, {backgroundColor:CC[s.c] || CC.green, borderRadius:3, maxBarThickness:38});
      });
      const cfg = {type:c.ty, data:{labels:c.lb.map(ucLbl), datasets:ds}};
      if (c.ty === 'doughnut'){
        cfg.options = {cutout:'60%', plugins:{legend:{display:true, position:'bottom',
          labels:{font:{family:'Segoe UI',size:11.5}, boxWidth:11, padding:12, color:CC.ink}}},
          scales:{x:{display:false}, y:{display:false}}};
      } else if (c.stack){
        cfg.options = {scales:{x:{stacked:true, grid:{display:false}, ticks:AX},
          y:{stacked:true, grid:{color:CC.grid}, border:{display:false}, ticks:AX}}};
      } else if (c.horiz){
        cfg.options = {indexAxis:'y',
          scales:{x:{grid:{color:CC.grid}, border:{display:false}, ticks:AX},
            y:{grid:{display:false}, ticks:AX}}};
      } else if (c.ds.some(s => s.ax === 'y1')){
        /* two units in one chart — the second series gets its own right-hand axis */
        cfg.options = {scales:{x:{grid:{display:false}, ticks:AX},
          y:{grid:{color:CC.grid}, border:{display:false}, ticks:AX},
          y1:{position:'right', grid:{display:false}, border:{display:false}, ticks:AX}}};
      }
      mkChart(`uc-${d.id}-${c.k}`, cfg);
    });
  });
}

  const c = mtgCrit(m);
  if (c && c !== 'none') return c;
  return (m.imp && m.urg) ? 'high' : (m.imp ? 'medium' : 'low');
}
function delegateOf(m){
  if (!m.delegate) return null;
  const a = (m.attendees || []).find(x => x.n === m.delegate);
  return a ? {n:a.n, r:a.r} : {n:m.delegate, r:null};
}
function renderPrio(){
  const list = mtgsForDay(PRIO_DAY);
  document.getElementById('prioSchedule').textContent =
    T('prioSchedWord') + ' · ' + dfmt(PRIO_DAY) + ' · ' + list.length + ' ' + T('prioMtgWord');
  document.getElementById('prioBrief').innerHTML = `<p>${esc(tx(PRIO_BRIEF))}</p>`;

  const quad = (imp, urg) => list.filter(m => !!m.imp === imp && !!m.urg === urg);
  const QDEF = [['q-iu','eisIU',quad(true,true)], ['q-inu','eisINU',quad(true,false)],
                ['q-niu','eisNIU',quad(false,true)], ['q-ninu','eisNINU',quad(false,false)]];
  document.getElementById('eisGrid').innerHTML = QDEF.map(([cls,lblK,ms]) => {
    const chips = ms.length ? ms.map(m => `
      <button class="eis-chip ${esc(prioLevel(m))}" data-go="mtg-${esc(m.id)}">
        <span class="ec-tm">${esc(m.dt.slice(11,16))}</span>
        <span class="ec-t">${esc(tx(m.t))}</span></button>`).join('')
      : `<div class="eq-empty">${esc(T('eisEmpty'))}</div>`;
    return `<div class="eis-q ${cls}">
      <div class="eq-h">${esc(T(lblK))}<span class="cnt">${ms.length}</span></div>
      <div class="eq-body">${chips}</div></div>`;
  }).join('');

  const RANK = {critical:4,high:3,medium:2,low:1,none:0};
  const ag = list.slice();
  if (prioOpt) ag.sort((a,b) => (RANK[prioLevel(b)] - RANK[prioLevel(a)]) || a.dt.localeCompare(b.dt));
  else ag.sort((a,b) => a.dt.localeCompare(b.dt));
  const RDY = {high:'rdyHigh',medium:'rdyMed',low:'rdyLow'};
  document.getElementById('prioAgenda').innerHTML = `<div class="agn">` + ag.map(m => {
    const del = delegateOf(m);
    const rdy = m.readiness || 'medium';
    const tags = m.tags.map(t => `<span class="chp">${esc(topN(t))}</span>`).join('');
    const delHtml = del
      ? `<span class="av">${esc(initials(del.n))}</span><b>${esc(del.n)}</b>${del.r ? ' · ' + esc(tx(del.r)) : ''}`
      : '—';
    return `<button class="agn-row" data-go="mtg-${esc(m.id)}">
      <div class="ag-time"><b>${esc(m.dt.slice(11,16))}</b><small>${esc(m.end || '')}</small></div>
      <div class="ag-b">
        <div class="ag-top"><div class="ag-t">${esc(tx(m.t))}</div>
          <span class="rdy ${esc(rdy)}">${esc(T('rdyLabel'))}: ${esc(T(RDY[rdy] || 'rdyMed'))}</span></div>
        <div class="ag-sum">✦ ${esc(tx(m.aisum))}</div>
        <div class="ag-tags" style="margin-top:9px">${tags}</div>
        <div class="ag-foot"><div class="ag-dlg">◧ ${esc(T('prioDelegate'))}: ${delHtml}</div></div>
      </div></button>`;
  }).join('') + `</div>`;

  document.getElementById('prioAgendaNote').textContent = T('prioAgendaNote');
  document.getElementById('prioOpt').classList.toggle('done', prioOpt);
  bindGo();
}

function renderMeetings(){
  document.getElementById('mtgList').innerHTML = (F.meetings || []).map(mtgRow).join('');
  document.getElementById('mtgPages').innerHTML = (F.meetings || []).map(mtgDetail).join('');

/* ========================= KANBAN / ACTION BOARD =========================
   Reads FEED.todos (shared with meeting detail). Status changes are in-memory. */
const KB_COLS = [['todo','colTodo'],['doing','colDoing'],['blocked','colBlocked'],['done','colDone']];
function kbCard(t){
  const m = t.mtg ? mtgById(t.mtg) : null;
  const src = m
    ? `<div class="ksrc lk" data-mtg="${esc(m.id)}">▣ ${esc(tx(m.t))} · ${esc(dfmt(m.dt.slice(0,10)))}</div>`
    : `<div class="ksrc">◆ ${esc(T('kbStandalone'))}</div>`;
  const opts = KB_COLS.map(([v,k]) =>
    `<option value="${v}"${v === t.status ? ' selected' : ''}>${esc(T(k))}</option>`).join('');
  return `<div class="kc ${esc(t.pri)}">
    <div class="kbadges">${critB(t.pri)}<span class="chp">${esc(topN(t.topic))}</span>${riskI(t.risk)}</div>
    <div class="kt">${esc(tx(t.t))}</div>
    <div class="kmeta"><b>${esc(t.owner)}</b> · ${esc(tx(t.role))}<br>${esc(T('kbDue'))}: ${esc(dfmt(t.due))}</div>
    ${src}
    <div class="kfoot"><select data-todo="${esc(t.id)}" aria-label="${esc(T('kbMove'))}">${opts}</select></div>
  </div>`;
}
function kbFiltered(){
  return (F.todos || []).filter(t =>
    (kbCrit === 'all' || t.pri === kbCrit) && (kbTopic === 'all' || t.topic === kbTopic));
}
function renderKanban(){
  const crOpts = [['all',T('fAll')],['critical',T('priCritical')],['high',T('priHigh')],['medium',T('priMedium')],['low',T('priLow')]];
  filtBtns('kbCritFilt', kbCrit, crOpts, v => { kbCrit = v; renderKanban(); });
  const topics = [...new Set((F.todos || []).map(t => t.topic))];
  filtBtns('kbTopicFilt', kbTopic, [['all',T('fAll')], ...topics.map(t => [t, topN(t)])],
    v => { kbTopic = v; renderKanban(); });

  const items = kbFiltered();
  document.getElementById('kbBoard').innerHTML = KB_COLS.map(([st,k]) => {
    const cards = items.filter(t => t.status === st);
    const body = cards.length ? cards.map(kbCard).join('') : `<div class="kb-empty">—</div>`;
    return `<div class="kb-col ${st}">
      <div class="kb-ch"><span class="kb-dot"></span><b>${esc(T(k))}</b><span class="cnt">${cards.length}</span></div>
      ${body}</div>`;
  }).join('');

  const board = document.getElementById('kbBoard');
  board.querySelectorAll('select[data-todo]').forEach(sel =>
    sel.onchange = () => {
      const t = (F.todos || []).find(x => x.id === sel.dataset.todo);
      if (t){ t.status = sel.value; renderKanban(); }
    });
  board.querySelectorAll('.ksrc.lk').forEach(el =>
    el.onclick = () => go('mtg-' + el.dataset.mtg));
  document.getElementById('kb').textContent = (F.todos || []).length;
}

/* ========================= MINISTER'S CALENDAR =========================
   Day view of the Minister's schedule (FEED.meetings) with per-meeting
   documents (m.docs) and a document preview modal. All demonstration data. */
const WD = {
  az:["Bazar","Bazar ertəsi","Çərşənbə axşamı","Çərşənbə","Cümə axşamı","Cümə","Şənbə"],
  en:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
  ru:["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"]};
const DOCTYPE = {agenda:'docTypeAgenda',briefing:'docTypeBriefing',report:'docTypeReport',
  memo:'docTypeMemo',stats:'docTypeStats',decree:'docTypeDecree'};
const PRI_RANK = {critical:4,high:3,medium:2,low:1};
function calShift(days){
  const d = new Date(calDay + 'T00:00:00');
  d.setDate(d.getDate() + days);
  calDay = d.toISOString().slice(0,10);
  calSel = null;
  renderCalendar();
}
function mtgsForDay(day){
  return (F.meetings || []).filter(m => m.dt.slice(0,10) === day)
    .sort((a,b) => a.dt.localeCompare(b.dt));
}
function mtgCrit(m){
  const ts = todosFor(m.id);
  if (!ts.length) return 'none';
  return ts.reduce((acc,t) => (PRI_RANK[t.pri] > (PRI_RANK[acc] || 0) ? t.pri : acc), 'low');
}
function docSizeLabel(dc){ return dc.pages != null ? dc.pages + ' ' + T('docPages') : (dc.size || ''); }
function fmtCls(fmt){ return (fmt || '').toLowerCase(); }
function docTypeLabel(dc){ return T(DOCTYPE[dc.type] || dc.type); }

function renderCalendar(){
  const d = new Date(calDay + 'T00:00:00');
  document.getElementById('calWd').textContent = (WD[LG] || WD.en)[d.getDay()];
  document.getElementById('calDt').textContent = dfmt(calDay);
  document.getElementById('calPrev').setAttribute('aria-label', T('calPrev'));
  document.getElementById('calNext').setAttribute('aria-label', T('calNext'));

  const list = mtgsForDay(calDay);
  document.getElementById('calCount').textContent = list.length + ' ' + T('calMeetings');
  if (calSel && !list.some(m => m.id === calSel)) calSel = null;

  const agenda = document.getElementById('calAgenda');
  if (!list.length){
    calSel = null;
    agenda.innerHTML = `<div class="cal-empty"><div class="cal-empty-ic">◷</div>${esc(T('calEmpty'))}</div>`;
  } else {
    agenda.innerHTML = list.map(m => {
      const cr = mtgCrit(m);
      const tags = m.tags.map(t => `<span class="chp">${esc(topN(t))}</span>`).join('');
      const nd = (m.docs || []).length;
      return `<button class="cal-item${m.id === calSel ? ' sel' : ''}" data-cal="${esc(m.id)}">
        <div class="cal-time">${esc(m.dt.slice(11,16))}<small>${esc(m.end || '')}</small></div>
        <div class="cal-body ${esc(cr)}">
          <div class="cal-item-t">${esc(tx(m.t))}</div>
          <div class="cal-item-m">◷ ${esc(mtgLoc(m))} · ${esc(T('mtgAttendees'))}: ${m.attendees.length}${nd ? ' · ▤ ' + nd : ''}</div>
          <div class="cal-item-tags">${tags}<span class="cal-item-arrow">${esc(T('calDocs'))} →</span></div>
        </div></button>`;
    }).join('');
    agenda.querySelectorAll('.cal-item').forEach(el =>
      el.onclick = () => { calSel = el.dataset.cal; renderCalendar(); });
  }
  renderCalDocs();
}
function renderCalDocs(){
  const panel = document.getElementById('calDocs');
  const badge = document.getElementById('calDocsBadge');
  const m = calSel ? mtgById(calSel) : null;
  if (!m){
    badge.style.display = 'none';
    panel.innerHTML = `<div class="cal-docs-empty">${esc(T('calSelectMtg'))}</div>`;
    return;
  }
  badge.style.display = '';
  const rows = (m.docs || []).map(dc => {
    const typeCls = dc.type === 'decree' ? ' decree' : '';
    return `<div class="doc-row">
      <div class="doc-ic ${esc(fmtCls(dc.fmt))}">${esc(dc.fmt)}</div>
      <div class="doc-meta">
        <div class="doc-t">${esc(tx(dc.t))}</div>
        <div class="doc-sub"><span class="doc-type${typeCls}">${esc(docTypeLabel(dc))}</span>
          <span>${esc(dc.fmt)}</span><span class="doc-dot">·</span><span>${esc(docSizeLabel(dc))}</span>
          <span class="doc-dot">·</span><span>${esc(T('docModified'))}: ${esc(dfmt(dc.mod))}</span></div>
      </div>
      <button class="btn sm doc-view" data-doc="${esc(dc.id)}">${esc(T('docView'))}</button>
    </div>`;
  }).join('') || `<div class="cal-docs-empty">—</div>`;
  panel.innerHTML = `<div class="cal-docs-head">
      <div class="cdh-t">${esc(tx(m.t))}</div>
      <div class="cdh-open"><button class="btn sm" data-go="mtg-${esc(m.id)}">${esc(T('calOpenMtg'))} →</button>
        <button class="btn pri sm" data-share="${esc(m.id)}">↗ ${esc(T('shareBtn'))}</button></div>
    </div>${rows}`;
  panel.querySelectorAll('.doc-view').forEach(b =>
    b.onclick = () => openDoc(m.id, b.dataset.doc));
  const openBtn = panel.querySelector('.cdh-open [data-go]');
  if (openBtn) openBtn.onclick = () => go(openBtn.dataset.go);
}
function openDoc(mtgId, docId){
  const m = mtgById(mtgId); if (!m) return;
  const dc = (m.docs || []).find(x => x.id === docId); if (!dc) return;
  const ic = document.getElementById('docDlgIc');
  ic.className = 'doc-dlg-ic ' + fmtCls(dc.fmt); ic.textContent = dc.fmt;
  document.getElementById('docDlgKick').textContent = docTypeLabel(dc);
  document.getElementById('docDlgTitle').textContent = tx(dc.t);
  document.getElementById('docDlgMeta').textContent =
    dc.fmt + ' · ' + docSizeLabel(dc) + ' · ' + T('docModified') + ': ' + dfmt(dc.mod);
  document.getElementById('docDlgBody').innerHTML =
    `<div class="doc-page">${(dc.body || []).map(p => `<p>${esc(tx(p))}</p>`).join('')}</div>`;
  document.getElementById('docClose').setAttribute('aria-label', T('docClose'));
  document.getElementById('docDlgDemo').textContent = T('docDemo');
  const md = document.getElementById('docModal');
  md.classList.add('on'); md.setAttribute('aria-hidden', 'false');
}
function closeDoc(){
  const md = document.getElementById('docModal');
  md.classList.remove('on'); md.setAttribute('aria-hidden', 'true');
}

/* ========================= SHARE MEETING OUTPUTS =========================
   Lets the Minister share a meeting's outputs with its participants. Recipients
   are pre-populated from the meeting attendees. Sending is demonstration only —
   nothing leaves the browser. */
let shareMtg = null;                 /* current meeting id */
let shareExtra = [];                 /* free-text recipients added in the dialog */
let shareChannel = 'email';          /* email | link */
const SHARE_OPTS = [['summary','shareOptSummary'],['actions','shareOptActions'],
  ['todos','shareOptTodos'],['docs','shareOptDocs']];

function shareToastTimer(){ return window._shareToastTimer; }
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('on'), 3600);
}

function openShare(mtgId){
  const m = mtgById(mtgId); if (!m) return;
  shareMtg = mtgId; shareExtra = []; shareChannel = 'email';
  const md = document.getElementById('shareModal');
  document.getElementById('shareDlgKick').textContent = T('shareKick');
  document.getElementById('shareDlgTitle').textContent = tx(m.t);
  document.getElementById('shareDlgMeta').textContent = dtfmt(m.dt) + ' · ' + mtgLoc(m);
  document.getElementById('shareClose').setAttribute('aria-label', T('shareClose'));
  renderShareBody();
  md.classList.add('on'); md.setAttribute('aria-hidden', 'false');
}
function closeShare(){
  const md = document.getElementById('shareModal');
  md.classList.remove('on'); md.setAttribute('aria-hidden', 'true');
  shareMtg = null;
}
function shareRecipientRows(m){
  const att = m.attendees.map((a,i) => `<label class="sh-rec">
    <input type="checkbox" class="sh-reci" data-i="${i}" checked>
    <span class="av">${esc(initials(a.n))}</span>
    <span class="sh-rn"><b>${esc(a.n)}</b><small>${esc(tx(a.r))}</small></span></label>`).join('');
  const extra = shareExtra.map((r,i) => `<label class="sh-rec sh-rec-x">
    <input type="checkbox" class="sh-recx" data-x="${i}" checked>
    <span class="av av-x">+</span>
    <span class="sh-rn"><b>${esc(r)}</b><small>${esc(T('shareCustom'))}</small></span></label>`).join('');
  return att + extra;
}
function renderShareBody(){
  const m = mtgById(shareMtg); if (!m) return;
  const optRows = SHARE_OPTS.map(([v,k]) =>
    `<label class="sh-opt"><input type="checkbox" class="sh-content" data-v="${v}" checked><span>${esc(T(k))}</span></label>`).join('');
  const body = `
    <div class="sh-sec">
      <div class="sh-t">${esc(T('shareRecipients'))} <span class="sh-hint">· ${esc(T('shareRecipientsHint'))}</span></div>
      <div class="sh-recs" id="shRecs">${shareRecipientRows(m)}</div>
      <div class="sh-add">
        <input type="text" id="shAddIn" placeholder="${esc(T('shareAddPh'))}">
        <button class="btn sm" id="shAddBtn">+ ${esc(T('shareAdd'))}</button>
      </div>
    </div>
    <div class="sh-sec">
      <div class="sh-t">${esc(T('shareWhat'))}</div>
      <div class="sh-opts">${optRows}</div>
    </div>
    <div class="sh-sec">
      <div class="sh-t">${esc(T('shareMsg'))}</div>
      <textarea id="shMsg" class="sh-msg" rows="3" placeholder="${esc(T('shareMsgPh'))}"></textarea>
    </div>
    <div class="sh-sec">
      <div class="sh-t">${esc(T('shareChannel'))}</div>
      <div class="sh-chan" id="shChan">
        <button class="sh-ch${shareChannel==='email'?' on':''}" data-ch="email">✉ ${esc(T('shareEmail'))}</button>
        <button class="sh-ch${shareChannel==='link'?' on':''}" data-ch="link">🔒 ${esc(T('shareLink'))}</button>
      </div>
    </div>`;
  document.getElementById('shareDlgBody').innerHTML = body;
  document.getElementById('shareFoot').innerHTML =
    `<span class="disc" id="shareDemo">${T('shareDemo')}</span><div class="sp" style="flex:1"></div>
     <button class="btn" id="shareCancel">${esc(T('shareCancel'))}</button>
     <button class="btn pri" id="shareSend">↗ ${esc(T('shareSend'))}</button>`;
  bindShareBody();
}
function bindShareBody(){
  const addBtn = document.getElementById('shAddBtn');
  const addIn = document.getElementById('shAddIn');
  const doAdd = () => {
    const v = (addIn.value || '').trim();
    if (v){ shareExtra.push(v); renderShareBody(); setTimeout(() => { const i=document.getElementById('shAddIn'); if(i) i.focus(); }, 0); }
  };
  if (addBtn) addBtn.onclick = doAdd;
  if (addIn) addIn.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); doAdd(); } };
  document.querySelectorAll('#shChan .sh-ch').forEach(b =>
    b.onclick = () => { shareChannel = b.dataset.ch; document.querySelectorAll('#shChan .sh-ch').forEach(x => x.classList.toggle('on', x === b)); });
  document.getElementById('shareCancel').onclick = closeShare;
  document.getElementById('shareSend').onclick = shareSend;
}
function shareSend(){
  const m = mtgById(shareMtg); if (!m) return;
  const recN = document.querySelectorAll('#shRecs input:checked').length;
  const contentN = document.querySelectorAll('.sh-content:checked').length;
  const demo = document.getElementById('shareDemo');
  if (!recN){ if (demo){ demo.innerHTML = '<b style="color:var(--down)">' + esc(T('shareNoRec')) + '</b>'; } return; }
  if (!contentN){ if (demo){ demo.innerHTML = '<b style="color:var(--down)">' + esc(T('shareNoContent')) + '</b>'; } return; }
  const chan = shareChannel === 'email' ? T('shareEmail') : T('shareLink');
  document.getElementById('shareDlgBody').innerHTML =
    `<div class="sh-done">
       <div class="sh-done-ic">✓</div>
       <div class="sh-done-t">${esc(T('shareSuccess').replace('{n}', recN))}</div>
       <div class="sh-done-sub">${esc(T('shareSuccessSub'))}</div>
       <div class="sh-done-meta">${esc(T('shareSuccessVia'))}: <b>${esc(chan)}</b> · ${contentN} ${esc(T('shareOfWhich'))}</div>
     </div>`;
  document.getElementById('shareFoot').innerHTML =
    `<span class="disc">${T('shareDemo')}</span><div class="sp" style="flex:1"></div>
     <button class="btn pri" id="shareDone">${esc(T('shareDone'))}</button>`;
  document.getElementById('shareDone').onclick = closeShare;
  showToast(T('shareSuccess').replace('{n}', recN));
}

function bindGo(){

document.getElementById('navBtn').onclick = () => document.body.classList.toggle('nav-on');
document.getElementById('scrim').onclick = () => document.body.classList.remove('nav-on');
document.getElementById('refresh').onclick = e => {

document.getElementById('ask').onclick = () => askChat(document.getElementById('q').value);
document.getElementById('q').addEventListener('keydown', e => {

document.getElementById('q').addEventListener('input', e => {

document.getElementById('prioOpt').onclick = () => {

document.getElementById('calPrev').onclick = () => calShift(-1);
document.getElementById('calNext').onclick = () => calShift(1);
document.getElementById('calToday').onclick = () => { calDay = CAL_DEFAULT_DAY; calSel = null; renderCalendar(); };
document.getElementById('docClose').onclick = closeDoc;
document.getElementById('docScrim').onclick = closeDoc;
document.getElementById('shareClose').onclick = closeShare;
document.getElementById('shareScrim').onclick = closeShare;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-share]');
  if (el){ e.preventDefault(); openShare(el.dataset.share); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeDoc(); closeShare(); } });
document.getElementById('chatClear').onclick = () => { CHAT.length = 0; renderChat(); };
document.getElementById('regen').onclick = () => renderBrief();
['ss','y','ip','im'].forEach(id => document.getElementById(id).addEventListener('input', simWheat));
['it','yu','ws','cx'].forEach(id => document.getElementById(id).addEventListener('input', simIrr));
['rn','el','rf','wp'].forEach(id => document.getElementById(id).addEventListener('input', simDr));

tickClock(); setInterval(tickClock, 20000);
renderAll();
go('hub');   /* start on the standalone entry chooser (chrome hidden) */
initMap();
</script>
