              {az:"4. İstehsal alətləri: ölçülmüş məhsuldarlıq artımına bağlanmış lazerlə hamarlama.",en:"4. Production levers: laser levelling tied to measured yield uplift.",ru:"4. Производственные рычаги: лазерное выравнивание, привязанное к измеренному приросту урожайности."}]},
       {id:"m3-d2", type:"report", fmt:"PDF", pages:9, mod:"2026-09-06",
        t:{az:"IV rüb buğda satınalması və strateji ehtiyat variantları",en:"Q4 wheat procurement & strategic reserve options",ru:"Закупка пшеницы в IV квартале и варианты стратегического резерва"},
        body:[{az:"Ərzaqlıq buğda üzrə özünütəminat təxminən 55% təşkil edir. CBOT buğdası illik müqayisədə demək olar ki 43% bahalaşıb və Qara dəniz dəhlizləri yenidən istiqamətləndirilir.",en:"Food-wheat self-sufficiency stands at ~55%. CBOT wheat is up nearly 43% year-on-year and Black Sea corridors are being re-routed.",ru:"Самообеспеченность продовольственной пшеницей составляет около 55%. Пшеница CBOT подорожала почти на 43% в годовом выражении, а черноморские коридоры перенаправляются."},
              {az:"Tövsiyə: qiymətlərin düşməsini gözləmək əvəzinə IV rüb satınalma pəncərəsini dərhal açmaq və Qazaxıstanla paralel danışıqlar vasitəsilə tədarükü şaxələndirmək.",en:"Recommendation: open the Q4 procurement window immediately rather than waiting for prices to fall, and diversify supply via parallel talks with Kazakhstan.",ru:"Рекомендация: немедленно открыть окно закупок IV квартала, не дожидаясь падения цен, и диверсифицировать поставки через параллельные переговоры с Казахстаном."},
              {az:"Həcmləri göstərən strateji ehtiyatın artırılması təklifi bir həftə ərzində təqdim ediləcək.",en:"A strategic-reserve top-up proposal with volumes is to follow within the week.",ru:"Предложение по пополнению стратегического резерва с объёмами будет представлено в течение недели."}]},
       {id:"m3-d3", type:"stats", fmt:"XLSX", size:"241 KB", mod:"2026-09-05",
        t:{az:"CBOT buğda qiymətləri və özünütəminat (verilənlər bazası)",en:"CBOT wheat prices & self-sufficiency (dataset)",ru:"Цены на пшеницу CBOT и самообеспеченность (набор данных)"},
        body:[{az:"1-ci vərəq — CBOT buğda fyuçersləri, həftəlik bağlanış, son 12 ay.",en:"Worksheet 1 — CBOT wheat futures, weekly close, trailing 12 months.",ru:"Лист 1 — Фьючерсы на пшеницу CBOT, недельное закрытие, последние 12 месяцев."},
              {az:"2-ci vərəq — Daxili ərzaqlıq buğda balansı və özünütəminat əmsalı.",en:"Worksheet 2 — Domestic food-wheat balance and self-sufficiency ratio.",ru:"Лист 2 — Внутренний баланс продовольственной пшеницы и коэффициент самообеспеченности."},
              {az:"3-cü vərəq — Həcm və mənşə dəhlizi üzrə satınalma ssenariləri.",en:"Worksheet 3 — Procurement scenarios by volume and origin corridor.",ru:"Лист 3 — Сценарии закупок по объёму и коридору происхождения."}]}],
     attendees:[
       {n:"Elçin Qasımov", r:{az:"Dövlət Taxıl Fondunun direktoru",en:"Director, State Grain Fund",ru:"Директор Государственного зернового фонда"}},
       {n:"Rəşad Məmmədov", r:{az:"Nazir müavini (su təsərrüfatı)",en:"Deputy Minister (Water)",ru:"Заместитель министра (водные ресурсы)"}},
       {n:"Nigar Əliyeva", r:{az:"İxracın Təşviqi şöbəsinin rəhbəri",en:"Head of Export Promotion",ru:"Начальник отдела продвижения экспорта"}}],
     transcript:[
       {sp:"Elçin Qasımov", r:{az:"Dövlət Taxıl Fondu",en:"State Grain Fund",ru:"Государственный зерновой фонд"}, x:{az:"CBOT buğdası illik müqayisədə demək olar ki, qırx üç faiz bahalaşıb və Qara dəniz logistikası yenidən istiqamətləndirilir. Ərzaqlıq buğda üzrə özünütəminatımız hələ də əlli beş faizdir, ona görə də dördüncü rüb üçün satınalmanı gözlədiyimiz hər həftə bizə baha başa gəlir.",en:"CBOT wheat is up nearly forty-three percent year on year and Black Sea logistics are being re-routed. Our food-wheat self-sufficiency is still fifty-five percent, so every week we wait to procure for the fourth quarter costs us.",ru:"Пшеница CBOT подорожала почти на сорок три процента за год, и черноморская логистика перенаправляется. Наша самообеспеченность продовольственной пшеницей всё ещё пятьдесят пять процентов, поэтому каждая неделя ожидания закупки на четвёртый квартал обходится нам дорого."}},
       {sp:{az:"Nazir",en:"Minister",ru:"Министр"}, r:{az:"Kənd təsərrüfatı naziri",en:"Minister of Agriculture",ru:"Министр сельского хозяйства"}, x:{az:"Satınalma pəncərəsini indi açın. Qiymətlərin düşəcəyinə bel bağlamaq istəmirəm. Qazaxıstanla paralel danışıqlar aparın ki, tək bir dəhlizdən asılı qalmayaq.",en:"Open the procurement window now. I do not want to gamble on prices falling. Run parallel negotiations with Kazakhstan so we are not dependent on a single corridor.",ru:"Откройте окно закупок сейчас. Я не хочу делать ставку на падение цен. Проведите параллельные переговоры с Казахстаном, чтобы мы не зависели от единственного коридора."}},
       {sp:"Rəşad Məmmədov", r:{az:"Nazir müavini",en:"Deputy Minister",ru:"Заместитель министра"}, x:{az:"İstehsal tərəfində əlli beş faizlik göstəricini hərəkətə gətirən yeganə struktur alətlər lazerlə hamarlama və müasir suvarmadır. Effektivliyi sübut edə bilmək üçün hamarlama subsidiyasını ölçülmüş məhsuldarlıq artımına bağlamalıyıq.",en:"On the production side, laser levelling and modern irrigation are the only structural levers that move the fifty-five percent number. We should tie the levelling subsidy to measured yield uplift so we can prove effectiveness.",ru:"Со стороны производства лазерное выравнивание и современное орошение — единственные структурные рычаги, которые сдвигают показатель в пятьдесят пять процентов. Нам следует привязать субсидию на выравнивание к измеренному приросту урожайности, чтобы доказать эффективность."}},
       {sp:"Elçin Qasımov", r:{az:"Dövlət Taxıl Fondu",en:"State Grain Fund",ru:"Государственный зерновой фонд"}, x:{az:"Aydındır. Bir həftə ərzində satınalma həcmi və strateji ehtiyatın artırılması təklifi təqdim edəcəyəm.",en:"Understood. I will bring a procurement volume and a strategic-reserve top-up proposal within the week.",ru:"Понятно. В течение недели я представлю объём закупок и предложение по пополнению стратегического резерва."}}],
     analysis:{
       actions:[
         {az:"Qiymətlərin düşməsini gözləmək əvəzinə IV rüb buğda satınalma pəncərəsini dərhal açmaq.",en:"Open the Q4 wheat procurement window immediately rather than waiting for prices to fall.",ru:"Немедленно открыть окно закупок пшеницы IV квартала, не дожидаясь падения цен."},
         {az:"Tədarük dəhlizini şaxələndirmək üçün Qazaxıstanla paralel satınalma danışıqları aparmaq.",en:"Run parallel procurement talks with Kazakhstan to diversify the supply corridor.",ru:"Провести параллельные закупочные переговоры с Казахстаном для диверсификации коридора поставок."},
         {az:"Lazerlə hamarlama subsidiyasını eAgro vasitəsilə təsdiqlənmiş ölçülmüş məhsuldarlıq artımına bağlamaq.",en:"Tie the laser-levelling subsidy to measured yield uplift verified via eAgro.",ru:"Привязать субсидию на лазерное выравнивание к измеренному приросту урожайности, подтверждённому через eAgro."}],

    {id:"m4",
     t:{az:"Aqrar ixracın təşviqi və bazara çıxış", en:"Agri-export promotion & market access", ru:"Продвижение агроэкспорта и доступ к рынкам"},
     dt:"2026-09-07T10:00", end:"11:00", virtual:false,
     loc:{az:"AZPROMO, Bakı", en:"AZPROMO, Baku", ru:"AZPROMO, Баку"},

     imp:true, urg:false, readiness:"high", delegate:"Nigar Əliyeva",
     aisum:{az:"İlin əvvəlindən aqrar ixrac artıb; Körfəz bazarına çıxış üçün fitosanitar maneənin aradan qaldırılması prioritetdir.",en:"Agri-exports are up year-to-date; clearing the phytosanitary bottleneck for Gulf market access is the priority.",ru:"Агроэкспорт вырос с начала года; приоритет — устранение фитосанитарного узкого места для доступа на рынок Залива."},
     docs:[
       {id:"m4-d1", type:"agenda", fmt:"PDF", pages:1, mod:"2026-09-04",
        t:{az:"Gündəlik — aqrar ixracın təşviqi və bazara çıxış",en:"Agenda — agri-export promotion & market access",ru:"Повестка — продвижение агроэкспорта и доступ к рынкам"},
        body:[{az:"1. İlin əvvəlindən aqrar ixracın nəticələri (İxracın Təşviqi).",en:"1. Agri-export performance year-to-date (Export Promotion).",ru:"1. Показатели агроэкспорта с начала года (Продвижение экспорта)."},
              {az:"2. Körfəz bazarına çıxış və fitosanitar maneə.",en:"2. Gulf market access and the phytosanitary bottleneck.",ru:"2. Доступ к рынку Залива и фитосанитарное узкое место."},
              {az:"3. Sabit ixrac partiyaları üçün kooperativlər vasitəsilə konsolidasiya.",en:"3. Cooperative consolidation for consistent export lots.",ru:"3. Кооперативная консолидация для стабильных экспортных партий."},
              {az:"4. Fitosanitar və baytarlıq üçün vahid sertifikatlaşdırma pəncərəsi.",en:"4. Single certification window for phytosanitary and veterinary.",ru:"4. Единое окно сертификации для фитосанитарии и ветеринарии."}]},
       {id:"m4-d2", type:"report", fmt:"PDF", pages:7, mod:"2026-09-04",
        t:{az:"Körfəz bazarına çıxış və fitosanitar protokol",en:"Gulf market access & phytosanitary protocol",ru:"Доступ к рынку Залива и фитосанитарный протокол"},
        body:[{az:"Bu il aqrar ixrac, əsasən meyvə və tərəvəzin hesabına, təxminən 23% artıb; Körfəz bazarında Azərbaycan almalarına tələbat güclüdür.",en:"Agri exports are up almost 23% this year, led by fruit and vegetables; Gulf demand for Azerbaijani apples is strong.",ru:"В этом году агроэкспорт вырос почти на 23%, прежде всего за счёт фруктов и овощей; спрос на азербайджанские яблоки в Заливе высокий."},
              {az:"Alma ixracını genişləndirmək üçün əsas maneə fitosanitar protokoldur; tövsiyə onun sürətləndirilməsidir.",en:"The phytosanitary protocol is the primary bottleneck to scaling apple exports; recommendation is to fast-track it.",ru:"Фитосанитарный протокол — главное узкое место для наращивания экспорта яблок; рекомендуется его ускорить."},
              {az:"Baytarlıq sertifikatlaşdırmasını fitosanitar prosesə uyğunlaşdırmaq ixracatçılara vahid pəncərə verərdi.",en:"Aligning veterinary certification with the phytosanitary track would give exporters a single window.",ru:"Согласование ветеринарной сертификации с фитосанитарным процессом дало бы экспортёрам единое окно."}]},
       {id:"m4-d3", type:"memo", fmt:"DOCX", pages:3, mod:"2026-09-03",
        t:{az:"Kooperativ konsolidasiyası pilot təklifi",en:"Cooperative consolidation pilot proposal",ru:"Предложение по пилоту кооперативной консолидации"},
        body:[{az:"Kiçik təsərrüfatlar Körfəzin həcm və qablaşdırma standartlarını təkbaşına ödəyə bilmir; kooperativlər vasitəsilə konsolidasiya sabit partiyalara imkan verir.",en:"Smallholders cannot individually meet Gulf volume and packaging standards; consolidation through cooperatives enables consistent lots.",ru:"Мелкие хозяйства не могут поодиночке соответствовать стандартам объёма и упаковки Залива; консолидация через кооперативы обеспечивает стабильные партии."},
              {az:"Üç meyvə kooperativi ixrac konsolidasiyası sxemini pilot qismində sınamağa hazırdır.",en:"Three fruit cooperatives are ready to pilot an export-consolidation scheme.",ru:"Три фруктовых кооператива готовы опробовать схему экспортной консолидации в пилотном режиме."},
              {az:"Bu memo nümayiş məqsədli məlumatdır.",en:"This memo is demonstration data.",ru:"Эта записка является демонстрационными данными."}]}],
     attendees:[
       {n:"Nigar Əliyeva", r:{az:"İxracın Təşviqi şöbəsinin rəhbəri",en:"Head of Export Promotion",ru:"Начальник отдела продвижения экспорта"}},
       {n:"Ramil Cəfərov", r:{az:"AZPROMO əlaqələndiricisi",en:"AZPROMO liaison",ru:"Координатор AZPROMO"}},
       {n:"Səbinə Abbasova", r:{az:"Baş baytar həkim",en:"Chief Veterinary Officer",ru:"Главный ветеринарный врач"}}],
     transcript:[
       {sp:"Nigar Əliyeva", r:{az:"İxracın təşviqi",en:"Export Promotion",ru:"Продвижение экспорта"}, x:{az:"Bu il aqrar ixrac, əsasən meyvə və tərəvəzin hesabına, təxminən iyirmi üç faiz artıb. Körfəz bazarı daha çox Azərbaycan alması istəyir, lakin fitosanitar protokol maneədir.",en:"Agri exports are up almost twenty-three percent this year, driven by fruit and vegetables. The Gulf market wants more Azerbaijani apples, but the phytosanitary protocol is the bottleneck.",ru:"В этом году агроэкспорт вырос почти на двадцать три процента за счёт фруктов и овощей. Рынок Залива хочет больше азербайджанских яблок, но фитосанитарный протокол — узкое место."}},
       {sp:"Ramil Cəfərov", r:{az:"AZPROMO",en:"AZPROMO",ru:"AZPROMO"}, x:{az:"Kiçik təsərrüfatlar Körfəzin həcm və qablaşdırma standartlarını təkbaşına ödəyə bilmir. Kooperativlər vasitəsilə konsolidasiya etsək, sabit partiyalar təklif edə bilərik. Üç meyvə kooperativi pilota hazırdır.",en:"Smallholders cannot meet Gulf volume and packaging standards individually. If we consolidate through cooperatives we can offer consistent lots. Three fruit cooperatives are ready to pilot.",ru:"Мелкие хозяйства не могут поодиночке соответствовать стандартам объёма и упаковки Залива. Если мы консолидируемся через кооперативы, то сможем предлагать стабильные партии. Три фруктовых кооператива готовы к пилоту."}},
       {sp:{az:"Nazir",en:"Minister",ru:"Министр"}, r:{az:"Kənd təsərrüfatı naziri",en:"Minister of Agriculture",ru:"Министр сельского хозяйства"}, x:{az:"Fitosanitar protokolu sürətləndirin və həmin kooperativləri sistemə qoşun. İxrac artımı bu il ən güclü hekayəmizdir — kağız işi ucbatından sürəti itirməyək.",en:"Fast-track the phytosanitary protocol and onboard those cooperatives. Export growth is our strongest story this year — let us not lose momentum on paperwork.",ru:"Ускорьте фитосанитарный протокол и подключите эти кооперативы. Рост экспорта — наша самая сильная история в этом году; не будем терять темп из-за бумажной работы."}},
       {sp:"Səbinə Abbasova", r:{az:"Baytarlıq",en:"Veterinary",ru:"Ветеринария"}, x:{az:"Heyvandarlıq məhsulları üçün mənə eyni protokol aydınlığı lazımdır. Baytarlıq sertifikatlaşdırma prosesini fitosanitar proseslə uyğunlaşdıra bilərəm ki, ixracatçılar vahid pəncərə ilə üzləşsin.",en:"For animal products I will need the same protocol clarity. I can align the veterinary certification track with the phytosanitary one so exporters face a single window.",ru:"Для продукции животноводства мне понадобится такая же ясность протокола. Я могу согласовать процесс ветеринарной сертификации с фитосанитарным, чтобы экспортёры имели единое окно."}}],
     analysis:{
       actions:[
         {az:"Körfəz bazarlarına alma ixracı üçün fitosanitar protokolu sürətləndirmək.",en:"Fast-track the phytosanitary protocol for apple exports to Gulf markets.",ru:"Ускорить фитосанитарный протокол для экспорта яблок на рынки Залива."},
         {az:"Üç meyvə kooperativini ixrac konsolidasiyası sxeminə qoşmaq.",en:"Onboard three fruit cooperatives into an export-consolidation scheme.",ru:"Подключить три фруктовых кооператива к схеме экспортной консолидации."},
         {az:"Baytarlıq sertifikatlaşdırmasını fitosanitar sertifikatlaşdırma ilə vahid ixracatçı pəncərəsinə birləşdirmək.",en:"Align veterinary certification with phytosanitary certification into a single exporter window.",ru:"Объединить ветеринарную сертификацию с фитосанитарной в единое окно для экспортёра."}],
       people:[
         {n:"Nigar Əliyeva", r:{az:"İxracın Təşviqi şöbəsinin rəhbəri",en:"Head of Export Promotion",ru:"Начальник отдела продвижения экспорта"}, o:{az:"Bazara çıxışa və fitosanitar sürətləndirməyə cavabdehdir.",en:"Owns market access and the phytosanitary fast-track.",ru:"Отвечает за доступ к рынкам и ускорение фитосанитарии."}},
         {n:"Ramil Cəfərov", r:{az:"AZPROMO əlaqələndiricisi",en:"AZPROMO liaison",ru:"Координатор AZPROMO"}, o:{az:"Kooperativlərin qoşulmasına və konsolidasiyaya cavabdehdir.",en:"Owns cooperative onboarding and consolidation.",ru:"Отвечает за подключение кооперативов и консолидацию."}}],
       topics:["export","coop","veterinary"]}},

    {id:"m5",
     t:{az:"Çəyirtkə və zərərvericilərə qarşı hazırlıq", en:"Locust & pest control preparedness", ru:"Готовность к борьбе с саранчой и вредителями"},
     dt:"2026-09-08T16:00", end:"17:00", virtual:true, loc:null,
     tags:["pest","climate"],
     imp:false, urg:true, readiness:"medium", delegate:"Tural Vəliyev",
     aisum:{az:"Aran zonasında çəyirtkə riski mövsümi olaraq artır; eAgro monitorinqi və dərmanlama ehtiyatlarının regional hazırlığı təsdiqlənməlidir.",en:"Locust risk rises seasonally in the Aran zone; eAgro monitoring and regional readiness of spraying stocks should be confirmed.",ru:"Риск саранчи сезонно растёт в Аранской зоне; следует подтвердить мониторинг eAgro и региональную готовность запасов средств опрыскивания."},
     docs:[
       {id:"m5-d1", type:"agenda", fmt:"PDF", pages:1, mod:"2026-09-03",
        t:{az:"Gündəlik — çəyirtkə və zərərvericilərə qarşı hazırlıq",en:"Agenda — locust & pest control preparedness",ru:"Повестка — готовность к борьбе с саранчой и вредителями"},
        body:[{az:"1. Aran rayonlarında payız çəyirtkə artımı riski (Bitki Mühafizəsi).",en:"1. Autumn locust build-up risk in the Aran districts (Plant Protection).",ru:"1. Риск осеннего роста численности саранчи в районах Арана (Защита растений)."},
              {az:"2. Yumurtaqoyma dövründən əvvəl mübarizə ehtiyatlarının əvvəlcədən yerləşdirilməsi.",en:"2. Pre-positioning of treatment stocks ahead of the egg-laying window.",ru:"2. Предварительное размещение запасов средств обработки до периода откладки яиц."},
              {az:"3. 22 rayon üzrə bitki sağlamlığı monitorinq xəbərdarlıqları.",en:"3. Plant-health monitoring alerts across 22 districts.",ru:"3. Оповещения мониторинга здоровья растений по 22 районам."},
              {az:"4. Optimal çiləmə vaxtlarının eAgro vasitəsilə regional koordinatorlara ötürülməsi.",en:"4. Spray-timing windows pushed to regional coordinators via eAgro.",ru:"4. Оптимальные окна опрыскивания, передаваемые региональным координаторам через eAgro."}]},
       {id:"m5-d2", type:"briefing", fmt:"DOCX", pages:4, mod:"2026-09-03",
        t:{az:"Çəyirtkə artımı riski — Aran rayonları",en:"Locust build-up risk — Aran districts",ru:"Риск роста численности саранчи — районы Арана"},
        body:[{az:"Daha isti və quraq payız gələn yaz Aran rayonlarında çəyirtkə artımı riskini artırır; keçən mövsümkü gecikmiş mübarizə təkrarlanmamalıdır.",en:"A warmer, drier autumn raises the risk of a locust build-up in the Aran districts next spring; late treatment last season must not be repeated.",ru:"Более тёплая и засушливая осень повышает риск роста численности саранчи в районах Арана следующей весной; запоздалая обработка прошлого сезона не должна повториться."},
              {az:"Mübarizə ehtiyatları indidən əvvəlcədən yerləşdirilməli, çiləmə əhatəsi isə yumurtaqoyma dövründən əvvəl təsdiqlənməlidir.",en:"Treatment stocks should be pre-positioned now, with spray coverage confirmed before the egg-laying window.",ru:"Запасы средств обработки следует разместить заранее уже сейчас, а охват опрыскивания подтвердить до периода откладки яиц."},
              {az:"Bütün rayonlar üzrə erkən xəbərdarlıq təcili çiləmədən əhəmiyyətli dərəcədə ucuzdur.",en:"Early warning across all districts is materially cheaper than emergency spraying.",ru:"Раннее предупреждение по всем районам существенно дешевле экстренного опрыскивания."}]},
       {id:"m5-d3", type:"report", fmt:"PDF", pages:6, mod:"2026-09-02",
        t:{az:"Bitki sağlamlığı monitorinqinin tətbiq planı",en:"Plant-health monitoring rollout plan",ru:"План развёртывания мониторинга здоровья растений"},
        body:[{az:"Bitki sağlamlığı və çiləmə vaxtı modulları bütün 22 rayonda tətbiqə hazırdır.",en:"The plant-health and spray-timing modules are ready for deployment across all 22 districts.",ru:"Модули здоровья растений и определения сроков опрыскивания готовы к развёртыванию во всех 22 районах."},
              {az:"Rayon səviyyəsində risk xəbərdarlıqları və optimal çiləmə vaxtları birbaşa regional koordinatorlara çatdırıla bilər.",en:"District-level risk alerts and optimal spraying windows can be delivered directly to regional coordinators.",ru:"Оповещения о рисках на уровне районов и оптимальные окна опрыскивания могут доставляться напрямую региональным координаторам."},
              {az:"Bu hesabat nümayiş məqsədli məlumatdır.",en:"This report is demonstration data.",ru:"Этот отчёт является демонстрационными данными."}]}],
     attendees:[
       {n:"Tural Vəliyev", r:{az:"Bitki Mühafizəsi Xidmətinin rəhbəri",en:"Head of Plant Protection Service",ru:"Начальник Службы защиты растений"}},
       {n:"Kamran Rəhimov", r:{az:"eAgro / EKTİS baş texnologiya direktoru",en:"CTO, eAgro / EKTIS",ru:"Технический директор eAgro / ЕКТИС"}},
       {n:"Günel Bayramova", r:{az:"Aran üzrə regional koordinator",en:"Regional coordinator, Aran",ru:"Региональный координатор, Аран"}}],
     transcript:[
       {sp:"Tural Vəliyev", r:{az:"Bitki mühafizəsi",en:"Plant Protection",ru:"Защита растений"}, x:{az:"Daha isti və quraq payız gələn yaz Aran rayonlarında çəyirtkə artımı riskini artırır. Bu il mübarizəni gec apardıq; bunu təkrarlaya bilmərik. Mübarizə ehtiyatları indidən əvvəlcədən yerləşdirilməlidir.",en:"A warmer, drier autumn raises the risk of a locust build-up in the Aran districts next spring. We treated late this year; we cannot repeat that. Treatment stocks must be pre-positioned now.",ru:"Более тёплая и засушливая осень повышает риск роста численности саранчи в районах Арана следующей весной. В этом году мы обработали поздно; повторять это нельзя. Запасы средств обработки нужно разместить заранее уже сейчас."}},
       {sp:"Günel Bayramova", r:{az:"Aran regionu",en:"Aran region",ru:"Аранский регион"}, x:{az:"Rayonlara yumurtaqoyma dövründən əvvəl çiləmə əhatəsinin təsdiqlənməsi lazımdır. Keçən mövsüm mərkəzi bölüşdürməni gözləyərək vaxt itirdik.",en:"Districts need spray coverage confirmed before the egg-laying window. Last season we lost time waiting for central allocation.",ru:"Районам нужно подтверждение охвата опрыскивания до периода откладки яиц. В прошлом сезоне мы потеряли время в ожидании централизованного распределения."}},
       {sp:{az:"Nazir",en:"Minister",ru:"Министр"}, r:{az:"Kənd təsərrüfatı naziri",en:"Minister of Agriculture",ru:"Министр сельского хозяйства"}, x:{az:"Ehtiyatları Aran rayonlarında əvvəlcədən yerləşdirin və bitki sağlamlığı monitorinq xəbərdarlıqlarını bütün iyirmi iki rayonda işə salın. Erkən xəbərdarlıq təcili çiləmədən ucuzdur.",en:"Pre-position stocks in the Aran districts and put the plant-health monitoring alerts live across all twenty-two districts. Early warning is cheaper than emergency spraying.",ru:"Разместите запасы заранее в районах Арана и запустите оповещения мониторинга здоровья растений во всех двадцати двух районах. Раннее предупреждение дешевле экстренного опрыскивания."}},
       {sp:"Kamran Rəhimov", r:{az:"eAgro",en:"eAgro",ru:"eAgro"}, x:{az:"Bitki sağlamlığı və çiləmə vaxtı modulları hazırdır. Rayon səviyyəsində risk xəbərdarlıqlarını və optimal çiləmə vaxtlarını birbaşa regional koordinatorlara ötürə bilərik.",en:"The plant-health and spray-timing modules are ready. We can push district-level risk alerts and optimal spraying windows straight to the regional coordinators.",ru:"Модули здоровья растений и сроков опрыскивания готовы. Мы можем передавать оповещения о рисках на уровне районов и оптимальные окна опрыскивания напрямую региональным координаторам."}}],
     analysis:{
       actions:[
         {az:"Yumurtaqoyma dövründən əvvəl Aran rayonlarında çəyirtkə mübarizəsi ehtiyatlarını əvvəlcədən yerləşdirmək.",en:"Pre-position locust treatment stocks in Aran districts ahead of the egg-laying window.",ru:"Заранее разместить запасы средств борьбы с саранчой в районах Арана до периода откладки яиц."},
         {az:"Bitki sağlamlığı monitorinq xəbərdarlıqlarını bütün 22 rayonda tətbiq etmək.",en:"Deploy plant-health monitoring alerts across all 22 districts.",ru:"Развернуть оповещения мониторинга здоровья растений во всех 22 районах."},
         {az:"Optimal çiləmə vaxtlarını eAgro vasitəsilə regional koordinatorlara ötürmək.",en:"Push optimal spray-timing windows to regional coordinators via eAgro.",ru:"Передавать оптимальные окна опрыскивания региональным координаторам через eAgro."}],
       people:[
         {n:"Tural Vəliyev", r:{az:"Bitki Mühafizəsi Xidmətinin rəhbəri",en:"Head of Plant Protection Service",ru:"Начальник Службы защиты растений"}, o:{az:"Mübarizə ehtiyatlarına və çiləmə əhatəsinə cavabdehdir.",en:"Owns treatment stock and spray coverage.",ru:"Отвечает за запасы средств обработки и охват опрыскивания."}},
         {n:"Günel Bayramova", r:{az:"Aran üzrə regional koordinator",en:"Regional coordinator, Aran",ru:"Региональный координатор, Аран"}, o:{az:"Rayon səviyyəsində hazırlığa cavabdehdir.",en:"Owns district-level readiness.",ru:"Отвечает за готовность на уровне районов."}},
         {n:"Kamran Rəhimov", r:{az:"eAgro / EKTİS",en:"eAgro / EKTIS",ru:"eAgro / ЕКТИС"}, o:{az:"Monitorinq xəbərdarlıqlarına və çiləmə vaxtı tətbiqinə cavabdehdir.",en:"Owns monitoring alerts and spray-timing rollout.",ru:"Отвечает за оповещения мониторинга и развёртывание сроков опрыскивания."}}],
       topics:["pest","climate","digital"]}},

     imp:true, urg:false, readiness:"medium", delegate:"Kamran Rəhimov",
     aisum:{az:"eAgro / EKTİS tətbiqi subsidiya və məlumat inteqrasiyasını genişləndirir; qalan modulların yayımı və məlumat keyfiyyəti diqqət tələb edir.",en:"The eAgro/EKTIS rollout expands subsidy and data integration; releasing the remaining modules and data quality need attention.",ru:"Внедрение eAgro/ЕКТИС расширяет интеграцию субсидий и данных; требуется внимание к выпуску оставшихся модулей и качеству данных."},
     docs:[
       {id:"m6-d1", type:"agenda", fmt:"PDF", pages:1, mod:"2026-09-02",
        t:{az:"Gündəlik — rəqəmsal eAgro / EKTİS tətbiqi",en:"Agenda — digital eAgro / EKTIS rollout",ru:"Повестка — внедрение цифровой eAgro / ЕКТИС"},
        body:[{az:"1. EKTİS-in subsidiya bəyannamələri üçün vahid həqiqət mənbəyi kimi çıxış etməsi.",en:"1. EKTIS as the single source of truth for subsidy declarations.",ru:"1. ЕКТИС как единый источник достоверных данных по декларациям на субсидии."},
              {az:"2. Bəyannamə inteqrasiyasının vəziyyəti (hazırda təxminən 80% tamamlanıb).",en:"2. Declaration integration status (currently ~80% complete).",ru:"2. Статус интеграции деклараций (сейчас выполнено около 80%)."},
              {az:"3. Peyk məlumatlarının sinxronlaşma gecikməsi və onun real vaxt yoxlamasına təsiri.",en:"3. Satellite data-sync latency and its impact on real-time verification.",ru:"3. Задержка синхронизации спутниковых данных и её влияние на проверку в реальном времени."},
              {az:"4. Fermerlərin eAgro Fermer Balı üzrə təlimi.",en:"4. Farmer training on the eAgro Farmer Score.",ru:"4. Обучение фермеров по eAgro Farmer Score."}]},
       {id:"m6-d2", type:"report", fmt:"PDF", pages:8, mod:"2026-09-02",
        t:{az:"EKTİS inteqrasiyasının vəziyyəti və sinxronlaşma gecikməsi",en:"EKTIS integration status & sync latency",ru:"Статус интеграции ЕКТИС и задержка синхронизации"},
        body:[{az:"Subsidiyaları bəyannamələrdən asılı etmək üçün EKTİS vahid həqiqət mənbəyi olmalıdır; bəyannamə inteqrasiyası təxminən 80% tamamlanıb.",en:"To make subsidies conditional on declarations, EKTIS must be the single source of truth; declaration integration is ~80% complete.",ru:"Чтобы поставить субсидии в зависимость от деклараций, ЕКТИС должна быть единым источником достоверных данных; интеграция деклараций выполнена примерно на 80%."},
              {az:"Pik yük zamanı peyk məlumatlarının sinxronlaşma gecikməsi 48 saata çatır; ödəniş yoxlaması üçün bunun 6 saatdan az olması tələb olunur. Bu, yenidən dizayn deyil, infrastruktur düzəlişidir.",en:"Satellite data-sync lag reaches up to 48 hours at peak load; payment verification requires it under 6 hours. This is an infrastructure fix, not a redesign.",ru:"При пиковой нагрузке задержка синхронизации спутниковых данных достигает 48 часов; для проверки платежей требуется менее 6 часов. Это инфраструктурная доработка, а не переработка."},
              {az:"İşə düşdükdən sonra paralel kağız prosesi ləğv edilə bilər ki, bu da bir sıra uzlaşdırma səhvlərini aradan qaldırır.",en:"Once live, the parallel paper track can be retired, removing a class of reconciliation errors.",ru:"После запуска параллельный бумажный процесс можно упразднить, что устранит целый класс ошибок сверки."}]},
       {id:"m6-d3", type:"stats", fmt:"XLSX", size:"309 KB", mod:"2026-09-01",
        t:{az:"EKTİS bəyannamə əhatəsi (verilənlər bazası)",en:"EKTIS declaration coverage (dataset)",ru:"Охват деклараций ЕКТИС (набор данных)"},
        body:[{az:"1-ci vərəq — Modullar üzrə bəyannamə inteqrasiyasının əhatəsi.",en:"Worksheet 1 — Declaration integration coverage by module.",ru:"Лист 1 — Охват интеграции деклараций по модулям."},
              {az:"2-ci vərəq — Yük altında peyk sinxronlaşma gecikməsinin ölçmələri.",en:"Worksheet 2 — Satellite sync latency measurements under load.",ru:"Лист 2 — Замеры задержки спутниковой синхронизации под нагрузкой."},
              {az:"3-cü vərəq — Rayonlar üzrə Fermer Balının mənimsənilməsi.",en:"Worksheet 3 — Farmer Score adoption by district.",ru:"Лист 3 — Внедрение Farmer Score по районам."}]}],
     attendees:[
       {n:"Kamran Rəhimov", r:{az:"eAgro / EKTİS baş texnologiya direktoru",en:"CTO, eAgro / EKTIS",ru:"Технический директор eAgro / ЕКТИС"}},
       {n:"Aygün Hüseynova", r:{az:"Subsidiya Departamentinin rəhbəri",en:"Head of Subsidy Department",ru:"Начальник Департамента субсидий"}},
       {n:"Vüsal Məhərrəmov", r:{az:"Məlumat və inteqrasiya rəhbəri",en:"Data & Integration lead",ru:"Руководитель по данным и интеграции"}}],
     transcript:[
       {sp:"Kamran Rəhimov", r:{az:"eAgro",en:"eAgro",ru:"eAgro"}, x:{az:"Subsidiyaları bəyannamələrdən asılı etmək üçün EKTİS vahid həqiqət mənbəyi olmalıdır. Bəyannamə inteqrasiyası səksən faiz hazırdır, lakin peyk məlumatlarının sinxronlaşmasında real vaxt yoxlamasını əngəlləyən gecikmə problemi var.",en:"To make subsidies conditional on declarations, EKTIS has to be the single source of truth. The declaration integration is eighty percent done, but the satellite data sync has a latency problem that blocks real-time verification.",ru:"Чтобы поставить субсидии в зависимость от деклараций, ЕКТИС должна быть единым источником достоверных данных. Интеграция деклараций готова на восемьдесят процентов, но у синхронизации спутниковых данных есть проблема задержки, блокирующая проверку в реальном времени."}},
       {sp:"Vüsal Məhərrəmov", r:{az:"Məlumatlar",en:"Data",ru:"Данные"}, x:{az:"Pik yük zamanı sinxronlaşma gecikməsi qırx səkkiz saata qədərdir. Ödəniş yoxlaması üçün bunun altı saatdan az olması lazımdır. Bu, yenidən dizayn deyil, infrastruktur düzəlişidir.",en:"The sync lag is up to forty-eight hours during peak load. For payment verification we need it under six. It is an infrastructure fix, not a redesign.",ru:"При пиковой нагрузке задержка синхронизации достигает сорока восьми часов. Для проверки платежей нам нужно менее шести. Это инфраструктурная доработка, а не переработка."}},
       {sp:{az:"Nazir",en:"Minister",ru:"Министр"}, r:{az:"Kənd təsərrüfatı naziri",en:"Minister of Agriculture",ru:"Министр сельского хозяйства"}, x:{az:"Bəyannamə inteqrasiyasını tamamlayın ki, ödənişlər EKTİS-ə bağlansın, və sinxronlaşma gecikməsini həll edin. Həmçinin Fermer Balı üzrə fermerlərə təlim keçin — bunu real edən məhz mənimsənilmədir.",en:"Finish the declaration integration so payouts can be tied to EKTIS, and resolve the sync latency. And run farmer training on the Farmer Score — adoption is what makes this real.",ru:"Завершите интеграцию деклараций, чтобы выплаты можно было привязать к ЕКТИС, и устраните задержку синхронизации. И проведите обучение фермеров по Farmer Score — именно внедрение делает это реальным."}},
       {sp:"Aygün Hüseynova", r:{az:"Subsidiya Departamenti",en:"Subsidy Dept",ru:"Департамент субсидий"}, x:{az:"İnteqrasiya işə düşən kimi paralel kağız prosesini tamamilə ləğv edə bilərik ki, bu da bütöv bir sıra uzlaşdırma səhvlərini aradan qaldırır.",en:"Once the integration is live we can retire the parallel paper track entirely, which removes a whole class of reconciliation errors.",ru:"Как только интеграция заработает, мы сможем полностью упразднить параллельный бумажный процесс, что устранит целый класс ошибок сверки."}}],
     analysis:{
       actions:[
         {az:"Subsidiya ödənişlərinin ona bağlana bilməsi üçün EKTİS bəyannamə inteqrasiyasını tamamlamaq.",en:"Complete EKTIS declaration integration so subsidy payouts can be tied to it.",ru:"Завершить интеграцию деклараций ЕКТИС, чтобы к ней можно было привязать выплаты субсидий."},
         {az:"EKTİS–peyk məlumatlarının sinxronlaşma gecikməsini həll etmək (hədəf: altı saatdan az).",en:"Resolve the EKTIS-satellite data sync latency (target under six hours).",ru:"Устранить задержку синхронизации данных ЕКТИС–спутник (цель — менее шести часов)."},
         {az:"Mənimsənilməni artırmaq üçün eAgro Fermer Balı üzrə fermerlərə vebinar təlimləri keçirmək.",en:"Run farmer training webinars on the eAgro Farmer Score to drive adoption.",ru:"Провести обучающие вебинары для фермеров по eAgro Farmer Score для повышения внедрения."}],
       people:[
         {n:"Kamran Rəhimov", r:{az:"eAgro / EKTİS baş texnologiya direktoru",en:"CTO, eAgro / EKTIS",ru:"Технический директор eAgro / ЕКТИС"}, o:{az:"Ümumi tətbiqə və inteqrasiyaya cavabdehdir.",en:"Owns the overall rollout and integration.",ru:"Отвечает за общее развёртывание и интеграцию."}},
         {n:"Vüsal Məhərrəmov", r:{az:"Məlumat və inteqrasiya rəhbəri",en:"Data & Integration lead",ru:"Руководитель по данным и интеграции"}, o:{az:"Məlumat sinxronlaşma gecikməsinin həllinə cavabdehdir.",en:"Owns the data-sync latency fix.",ru:"Отвечает за устранение задержки синхронизации данных."}}],
       topics:["digital","subsidy"]}},

        body:[{az:"1. Payız dabaq (FMD) peyvənd kampaniyasının qrafiki.",en:"1. Autumn foot-and-mouth (FMD) vaccination campaign schedule.",ru:"1. График осенней кампании вакцинации против ящура (FMD)."},

              {az:"4. Konsolidasiyanın suvarma investisiyaları ilə uzlaşdırılması.",en:"4. Alignment of consolidation with irrigation investment.",ru:"4. Согласование консолидации с инвестициями в орошение."}]},
       {id:"m7-d2", type:"briefing", fmt:"DOCX", pages:5, mod:"2026-09-01",
        t:{az:"Payız dabaq peyvənd kampaniyası planı",en:"Autumn FMD vaccination campaign plan",ru:"План осенней кампании вакцинации против ящура"},
        body:[{az:"Payız dabaq peyvənd kampaniyası qrafik üzrə başlamalıdır; əhatədə boşluq canlı heyvan və süd məhsulları ixracı hədəflərini təhlükə altına qoyar.",en:"The autumn FMD vaccination campaign must start on schedule; a coverage gap would jeopardise live-animal and dairy export ambitions.",ru:"Осенняя кампания вакцинации против ящура должна начаться по графику; пробел в охвате поставит под угрозу планы экспорта живого скота и молочной продукции."},
              {az:"Plan kampaniya dövrü üçün rayon əhatə hədəflərini və soyuq zəncir logistikasını müəyyən edir.",en:"The plan sets district coverage targets and cold-chain logistics for the campaign window.",ru:"План устанавливает целевые показатели охвата по районам и логистику холодовой цепи на период кампании."},
              {az:"Bu brifinq nümayiş məqsədli məlumatdır.",en:"This briefing is demonstration data.",ru:"Этот брифинг является демонстрационными данными."}]},
       {id:"m7-d3", type:"memo", fmt:"PDF", pages:2, mod:"2026-08-31",
        t:{az:"Torpaq konsolidasiyası reyestri pilotu",en:"Land consolidation registry pilot",ru:"Пилот реестра консолидации земель"},
        body:[{az:"Parçalanma təsərrüfatları müasir texnikanın özünü ödədiyi ölçüdən aşağı saxlayır.",en:"Fragmentation keeps holdings below the size where modern equipment pays off.",ru:"Раздробленность удерживает хозяйства ниже размера, при котором современная техника окупается."},
              {az:"Üç rayonda pilot qismində tətbiq edilən rəqəmsal konsolidasiya reyestri effekti genişləndirmədən əvvəl ölçməyə imkan verərdi.",en:"A digitised consolidation registry piloted in three rayons would let the effect be measured before scaling.",ru:"Цифровой реестр консолидации, опробованный в трёх районах, позволил бы измерить эффект до масштабирования."},
              {az:"Konsolidasiya olunmuş sahələr həm də suvarma investisiyasını daha səmərəli edir.",en:"Consolidated parcels also make irrigation investment more efficient.",ru:"Консолидированные участки также делают инвестиции в орошение более эффективными."}]}],
     attendees:[
       {n:"Səbinə Abbasova", r:{az:"Baş baytar həkim",en:"Chief Veterinary Officer",ru:"Главный ветеринарный врач"}},
       {n:"Fərid Nəbiyev", r:{az:"Torpaq İslahatı şöbəsinin rəhbəri",en:"Head of Land Reform",ru:"Начальник отдела земельной реформы"}},
       {n:"Rəşad Məmmədov", r:{az:"Nazir müavini (su təsərrüfatı)",en:"Deputy Minister (Water)",ru:"Заместитель министра (водные ресурсы)"}}],
     transcript:[
       {sp:"Səbinə Abbasova", r:{az:"Baytarlıq",en:"Veterinary",ru:"Ветеринария"}, x:{az:"Payız dabaq peyvənd kampaniyası qrafik üzrə başlamalıdır. Əhatədə boşluq canlı heyvan və süd məhsulları ixracı hədəflərimizi riskə atar.",en:"The autumn foot-and-mouth vaccination campaign has to start on schedule. A gap in coverage would put our live-animal and dairy export ambitions at risk.",ru:"Осенняя кампания вакцинации против ящура должна начаться по графику. Пробел в охвате поставит под угрозу наши планы экспорта живого скота и молочной продукции."}},
       {sp:"Fərid Nəbiyev", r:{az:"Torpaq islahatı",en:"Land Reform",ru:"Земельная реформа"}, x:{az:"Torpaq məsələsində parçalanma təsərrüfatları müasir texnikanın özünü ödədiyi ölçüdən aşağı saxlayır. Üç rayonda pilot tətbiq edilən rəqəmsal konsolidasiya reyestri genişləndirmədən əvvəl effekti ölçməyə imkan verər.",en:"On land, fragmentation keeps holdings below the size where modern equipment pays off. A digitised consolidation registry, piloted in three rayons, would let us measure the effect before scaling.",ru:"Что касается земли, раздробленность удерживает хозяйства ниже размера, при котором современная техника окупается. Цифровой реестр консолидации, опробованный в трёх районах, позволил бы измерить эффект до масштабирования."}},
       {sp:{az:"Nazir",en:"Minister",ru:"Министр"}, r:{az:"Kənd təsərrüfatı naziri",en:"Minister of Agriculture",ru:"Министр сельского хозяйства"}, x:{az:"Peyvənd qrafikini bu həftə təsdiqləyin və torpaq konsolidasiyası reyestri pilotunu başladın. Daha böyük, yoxlana bilən təsərrüfatlar müzakirə etdiyimiz hər şeyin — suvarma, subsidiyalar və ixracın — təməlidir.",en:"Approve the vaccination schedule this week, and start the land consolidation registry pilot. Bigger, verifiable holdings are the foundation for everything else we discussed — irrigation, subsidies, and exports.",ru:"Утвердите график вакцинации на этой неделе и запустите пилот реестра консолидации земель. Более крупные, проверяемые хозяйства — основа всего остального, что мы обсуждали: орошения, субсидий и экспорта."}},
       {sp:"Rəşad Məmmədov", r:{az:"Nazir müavini",en:"Deputy Minister",ru:"Заместитель министра"}, x:{az:"Konsolidasiya olunmuş sahələr suvarma investisiyasını da xeyli səmərəli edir, ona görə də bu iki istiqamət bir-birini gücləndirir.",en:"Consolidated parcels also make irrigation investment far more efficient, so these two tracks reinforce each other.",ru:"Консолидированные участки также делают инвестиции в орошение гораздо эффективнее, поэтому эти два направления усиливают друг друга."}}],

       people:[
         {n:"Səbinə Abbasova", r:{az:"Baş baytar həkim",en:"Chief Veterinary Officer",ru:"Главный ветеринарный врач"}, o:{az:"Dabaq peyvənd kampaniyasına cavabdehdir.",en:"Owns the FMD vaccination campaign.",ru:"Отвечает за кампанию вакцинации против ящура."}},

       topics:["veterinary","land","irrigation"]}},

              {az:"2. Zavodlarla Mingəçevir toxuculuq parkı arasında klaster müqavilələri.",en:"2. Cluster contracting between ginneries and the Mingachevir textile park.",ru:"2. Кластерные контракты между хлопкоочистительными заводами и Мингечевирским текстильным парком."},
              {az:"3. Toxum keyfiyyəti proqramı və mexanikləşdirilmiş yığımın genişləndirilməsi.",en:"3. Seed-quality programme and mechanised harvest expansion.",ru:"3. Программа качества семян и расширение механизированной уборки."},
              {az:"4. Xam lif ixracından hazır toxuculuq məhsulları ixracına keçid.",en:"4. Moving from raw-fibre export toward finished-textile exports.",ru:"4. Переход от экспорта сырого волокна к экспорту готовой текстильной продукции."}]},
       {id:"m8-d2", type:"report", fmt:"PDF", pages:8, mod:"2026-09-05",
        t:{az:"Pambıq sektorunun göstəriciləri və klaster modeli",en:"Cotton sector performance & cluster model",ru:"Показатели хлопкового сектора и кластерная модель"},
        body:[{az:"Xam pambıq istehsalı bərpa olunur, lakin istehsalçıların inamı elan edilən satınalma qiymətinə və ödənişlərin vaxtında aparılmasına həssasdır.",en:"Seed cotton output is recovering, but grower confidence is sensitive to the announced procurement price and payment timeliness.",ru:"Производство хлопка-сырца восстанавливается, но уверенность производителей чувствительна к объявленной закупочной цене и своевременности выплат."},
              {az:"Zavodları mövsümi müqavilələr çərçivəsində Mingəçevir toxuculuq parkına bağlayan klaster modeli tələbatı və məhsulun sortlarını sabitləşdirər.",en:"A cluster model that ties ginneries to the Mingachevir textile park under seasonal contracts would stabilise demand and grades.",ru:"Кластерная модель, связывающая хлопкоочистительные заводы с Мингечевирским текстильным парком сезонными контрактами, стабилизировала бы спрос и сортность."},
              {az:"Dəyərin daha çoxunu ölkədə saxlamaq xam lif əvəzinə ip və parça ixrac etmək deməkdir; marja artımı əhəmiyyətlidir.",en:"Capturing more value locally means exporting yarn and fabric rather than raw fibre; the margin uplift is significant.",ru:"Удержание большей стоимости внутри страны означает экспорт пряжи и ткани вместо сырого волокна; прирост маржи значителен."}]},
       {id:"m8-d3", type:"stats", fmt:"XLSX", size:"196 KB", mod:"2026-09-04",
        t:{az:"Pambıq satınalması və mexanikləşmə (verilənlər bazası)",en:"Cotton procurement & mechanisation (dataset)",ru:"Закупка хлопка и механизация (набор данных)"},
        body:[{az:"1-ci vərəq — Rayonlar üzrə xam pambıq həcmləri və sort bölgüsü.",en:"Worksheet 1 — District seed-cotton volumes and grade distribution.",ru:"Лист 1 — Объёмы хлопка-сырца и распределение по сортам по районам."},
              {az:"2-ci vərəq — Satınalma qiyməti ssenariləri və istehsalçı marjası.",en:"Worksheet 2 — Procurement price scenarios and grower margin.",ru:"Лист 2 — Сценарии закупочной цены и маржа производителя."},
              {az:"3-cü vərəq — Rayonlar üzrə mexanikləşdirilmiş və əl ilə yığımın payı.",en:"Worksheet 3 — Mechanised vs manual harvest share by district.",ru:"Лист 3 — Доля механизированной и ручной уборки по районам."}]}],
     attendees:[
       {n:"Ceyhun Bayramov", r:{az:"Pambıq və Lif Departamentinin rəhbəri",en:"Head of Cotton & Fibre Department",ru:"Начальник Департамента хлопка и волокна"}},
       {n:"İlham Quliyev", r:{az:"MKT Pambıq Klasterinin operatoru",en:"MKT Cotton Cluster operator",ru:"Оператор хлопкового кластера MKT"}},
       {n:"Nigar Əliyeva", r:{az:"İxracın Təşviqi şöbəsinin rəhbəri",en:"Head of Export Promotion",ru:"Начальник отдела продвижения экспорта"}}],
     transcript:[
       {sp:"Ceyhun Bayramov", r:{az:"Pambıq və Lif Departamenti",en:"Cotton & Fibre Dept",ru:"Департамент хлопка и волокна"}, x:{az:"Xam pambıq həcmləri bərpa olunur, lakin istehsalçılar satınalma qiymətini diqqətlə izləyir. Onu gec elan etsək və ya gec ödəsək, gələn mövsüm üçün əkin inamı azalır.",en:"Seed cotton volumes are recovering, but growers are watching the procurement price closely. If we announce it late, or pay late, planting confidence for next season drops.",ru:"Объёмы хлопка-сырца восстанавливаются, но производители внимательно следят за закупочной ценой. Если мы объявим её поздно или заплатим поздно, уверенность в посеве на следующий сезон падает."}},
       {sp:"İlham Quliyev", r:{az:"Pambıq klasteri",en:"Cotton cluster",ru:"Хлопковый кластер"}, x:{az:"Klaster modeli yalnız zavodların Mingəçevir toxuculuq parkı ilə möhkəm müqavilələri olduqda işləyir. Bizə mövsümi satınalma müqavilələri verin, biz də istehsalçılara sort və həcmi zəmanət verək.",en:"The cluster model works only if the ginneries have firm contracts with the Mingachevir textile park. Give us seasonal offtake contracts and we can guarantee grades and volumes to the growers.",ru:"Кластерная модель работает только при наличии у заводов твёрдых контрактов с Мингечевирским текстильным парком. Дайте нам сезонные контракты на закупку — и мы сможем гарантировать производителям сортность и объёмы."}},
       {sp:{az:"Nazir",en:"Minister",ru:"Министр"}, r:{az:"Kənd təsərrüfatı naziri",en:"Minister of Agriculture",ru:"Министр сельского хозяйства"}, x:{az:"Satınalma qiymətini əkin qərarları verilməzdən əvvəl elan edin və zavod–toxuculuq parkı müqavilələrini rəsmiləşdirin. İstəyirəm ki, yalnız xam lif deyil, ip və parça ixrac edək — dəyər ölkədə məhz burada qalır.",en:"Announce the procurement price before sowing decisions are made, and formalise the ginnery-to-textile-park contracting. I want us exporting yarn and fabric, not just raw fibre — that is where the value stays in the country.",ru:"Объявите закупочную цену до принятия решений о посеве и оформите контракты между заводами и текстильным парком. Я хочу, чтобы мы экспортировали пряжу и ткань, а не только сырое волокно, — именно так стоимость остаётся в стране."}},
       {sp:"Nigar Əliyeva", r:{az:"İxracın təşviqi",en:"Export Promotion",ru:"Продвижение экспорта"}, x:{az:"Türkiyə və Aİ-də hazır toxuculuq alıcıları hazırdır. Klasterdən sabit partiyaları sertifikatlaşdıra bildikdən sonra Azərbaycan pambığını izlənə bilən, daha yüksək marjalı məhsul kimi mövqeləndirə bilərik.",en:"Finished-textile buyers in Türkiye and the EU are ready. Once we can certify consistent lots from the cluster, we can position Azerbaijani cotton as a traceable, higher-margin line.",ru:"Покупатели готовой текстильной продукции в Турции и ЕС готовы. Как только мы сможем сертифицировать стабильные партии из кластера, мы позиционируем азербайджанский хлопок как отслеживаемую линию с более высокой маржой."}}],
     analysis:{
       actions:[
         {az:"2026-cı il xam pambıq satınalma qiymətini istehsalçılar əkin qərarı verməzdən əvvəl elan etmək.",en:"Announce the 2026 raw cotton procurement price before growers make sowing decisions.",ru:"Объявить закупочную цену на хлопок-сырец 2026 года до принятия производителями решений о посеве."},
         {az:"Zavodlarla Mingəçevir toxuculuq parkı arasında mövsümi satınalma müqavilələrini rəsmiləşdirmək.",en:"Formalise seasonal offtake contracts between ginneries and the Mingachevir textile park.",ru:"Оформить сезонные контракты на закупку между заводами и Мингечевирским текстильным парком."},
         {az:"Marjanı saxlamaq üçün ixrac strukturunu xam lifdən ipə və hazır toxuculuğa doğru dəyişmək.",en:"Shift the export mix from raw fibre toward yarn and finished textiles to retain margin.",ru:"Сместить структуру экспорта с сырого волокна к пряже и готовому текстилю для удержания маржи."}],
       people:[
         {n:"Ceyhun Bayramov", r:{az:"Pambıq və Lif Departamentinin rəhbəri",en:"Head of Cotton & Fibre Department",ru:"Начальник Департамента хлопка и волокна"}, o:{az:"Satınalma qiymətinə və istehsalçılarla iş əlaqələrinə cavabdehdir.",en:"Owns procurement price and grower engagement.",ru:"Отвечает за закупочную цену и взаимодействие с производителями."}},
         {n:"İlham Quliyev", r:{az:"MKT Pambıq Klasterinin operatoru",en:"MKT Cotton Cluster operator",ru:"Оператор хлопкового кластера MKT"}, o:{az:"Zavod–toxuculuq parkı müqavilələrinə cavabdehdir.",en:"Owns ginnery-to-textile-park contracting.",ru:"Отвечает за контракты между заводами и текстильным парком."}},
         {n:"Nigar Əliyeva", r:{az:"İxracın Təşviqi şöbəsinin rəhbəri",en:"Head of Export Promotion",ru:"Начальник отдела продвижения экспорта"}, o:{az:"Hazır toxuculuq məhsullarının bazarda mövqeləndirilməsinə cavabdehdir.",en:"Owns finished-textile market positioning.",ru:"Отвечает за позиционирование готовой текстильной продукции на рынке."}}],
       topics:["cotton","export","coop"]}},

    {id:"m9",
     t:{az:"Fındıq və üzümçülük ixrac sektorları", en:"Hazelnut & viticulture export sectors", ru:"Экспортные секторы фундука и виноградарства"},
     dt:"2026-09-09T09:30", end:"10:45", virtual:false,

     aisum:{az:"Fındıq və üzümçülük ixracı üzrə imkanlar güclüdür; keyfiyyət standartları və brendləşmə ixracı artıra bilər.",en:"Hazelnut and viticulture export opportunities are strong; quality standards and branding can lift exports.",ru:"Экспортные возможности фундука и виноградарства сильны; стандарты качества и брендинг могут увеличить экспорт."},
     docs:[
       {id:"m9-d1", type:"agenda", fmt:"PDF", pages:1, mod:"2026-09-07",
        t:{az:"Gündəlik — fındıq və üzümçülük ixrac sektorları",en:"Agenda — hazelnut & viticulture export sectors",ru:"Повестка — экспортные секторы фундука и виноградарства"},
        body:[{az:"1. Fındıq bağlarının bərpası və keyfiyyət sertifikatlaşdırması (Bağçılıq Departamenti).",en:"1. Hazelnut orchard rehabilitation and quality certification (Horticulture Dept).",ru:"1. Восстановление ореховых садов и сертификация качества (Департамент садоводства)."},
              {az:"2. Aİ bazar kanalını qorumaq üçün aflatoksinə nəzarət.",en:"2. Aflatoxin control to protect the EU market channel.",ru:"2. Контроль афлатоксина для защиты рыночного канала ЕС."},
              {az:"3. Üzümlüklərin yenidən salınması və şərab üzrə coğrafi göstərici strategiyası.",en:"3. Viticulture replanting and the geographic-indication wine strategy.",ru:"3. Пересадка виноградников и стратегия географического указания для вина."},
              {az:"4. Azərbaycan fındığı və şərablarının xaricdə əlaqələndirilmiş brendinqi.",en:"4. Coordinated branding of Azerbaijani hazelnuts and wines abroad.",ru:"4. Скоординированный брендинг азербайджанского фундука и вин за рубежом."}]},
       {id:"m9-d2", type:"briefing", fmt:"DOCX", pages:6, mod:"2026-09-06",
        t:{az:"Fındıq keyfiyyəti və Aİ bazarına çıxış",en:"Hazelnut quality & EU market access",ru:"Качество фундука и доступ к рынку ЕС"},
        body:[{az:"Azərbaycan aparıcı fındıq ixracatçısıdır, lakin Aİ sərhədində aflatoksin səbəbindən imtinalar bu kanal üçün ən böyük risk olaraq qalır.",en:"Azerbaijan is a top-tier hazelnut exporter, but aflatoxin rejections at the EU border remain the single biggest risk to the channel.",ru:"Азербайджан — ведущий экспортёр фундука, но отказы из-за афлатоксина на границе ЕС остаются главным риском для этого канала."},
              {az:"Zaqatala–Qax zolağında bərpa və qurutma keyfiyyəti proqramı sort sabitliyini yüksəldər və imtinaları azaldar.",en:"A rehabilitation and drying-quality programme in the Zaqatala–Qax belt would lift grade consistency and reduce rejections.",ru:"Программа восстановления и качества сушки в поясе Загатала–Гах повысила бы стабильность сортности и сократила отказы."},
              {az:"Sertifikatlaşdırma və izlənəbilərlik Avropa emalçıları ilə rəf yerini saxlamağın qiymətidir.",en:"Certification and traceability are the price of holding shelf space with European processors.",ru:"Сертификация и прослеживаемость — это цена удержания места на полке у европейских переработчиков."}]},
       {id:"m9-d3", type:"report", fmt:"PDF", pages:7, mod:"2026-09-05",
        t:{az:"Üzümçülüyün yenidən salınması və şərab CG strategiyası",en:"Viticulture replanting & wine GI strategy",ru:"Пересадка виноградников и стратегия ГУ для вина"},
        body:[{az:"Yaşlanan üzümlükləri sertifikatlaşdırılmış klon materialı ilə yenidən salmaq həm süfrə üzümü, həm də şərab üçün struktur alətdir.",en:"Replanting ageing vineyards with certified clonal material is the structural lever for both table grapes and wine.",ru:"Пересадка стареющих виноградников сертифицированным клоновым материалом — структурный рычаг как для столового винограда, так и для вина."},
              {az:"Azərbaycan şərabı üçün coğrafi göstərici (CG) çərçivəsi ixrac bazarlarında premium mövqeni qoruyar.",en:"A geographic-indication (GI) framework for Azerbaijani wine would protect premium positioning in export markets.",ru:"Рамочная система географического указания (ГУ) для азербайджанского вина защитила бы премиальное позиционирование на экспортных рынках."},
              {az:"Bu hesabat nümayiş məqsədli məlumatdır.",en:"This report is demonstration data.",ru:"Этот отчёт является демонстрационными данными."}]}],
     attendees:[
       {n:"Zaur Mikayılov", r:{az:"Bağçılıq Departamentinin rəhbəri",en:"Head of Horticulture Department",ru:"Начальник Департамента садоводства"}},
       {n:"Aygün Salmanova", r:{az:"Azərbaycan Üzümçülər və Şərabçılar Assosiasiyası",en:"Azerbaijan Winegrowers & Winemakers Association",ru:"Ассоциация виноградарей и виноделов Азербайджана"}},
       {n:"Nigar Əliyeva", r:{az:"İxracın Təşviqi şöbəsinin rəhbəri",en:"Head of Export Promotion",ru:"Начальник отдела продвижения экспорта"}}],
     transcript:[
       {sp:"Zaur Mikayılov", r:{az:"Bağçılıq Departamenti",en:"Horticulture Dept",ru:"Департамент садоводства"}, x:{az:"Fındıq üzrə aparıcı ixracatçıyıq, lakin Aİ sərhədində aflatoksin imtinaları ən böyük riskimizdir. Zaqatala–Qax zolağında qurutma və keyfiyyət proqramı imtinaları kəskin şəkildə azaldar.",en:"On hazelnuts we are a top-tier exporter, but aflatoxin rejections at the EU border are our biggest risk. A drying and quality programme in the Zaqatala–Qax belt would cut rejections sharply.",ru:"По фундуку мы ведущий экспортёр, но отказы из-за афлатоксина на границе ЕС — наш главный риск. Программа сушки и качества в поясе Загатала–Гах резко сократила бы отказы."}},
       {sp:"Aygün Salmanova", r:{az:"Üzümçülər Assosiasiyası",en:"Winegrowers Association",ru:"Ассоциация виноградарей"}, x:{az:"Üzümçülükdə yaşlanan üzümlükləri sertifikatlaşdırılmış klon materialı ilə yenidən salmaq əsl alətdir. Şərabımız üçün coğrafi göstərici çərçivəsi əldə etsək, həcm üzərində rəqabət aparmaq əvəzinə xaricdə premium qiyməti qoruya bilərik.",en:"For viticulture, replanting ageing vineyards with certified clonal material is the real lever. And if we secure a geographic-indication framework for our wine, we can defend a premium price abroad instead of competing on volume.",ru:"В виноградарстве пересадка стареющих виноградников сертифицированным клоновым материалом — настоящий рычаг. А если мы закрепим рамочную систему географического указания для нашего вина, то сможем защищать премиальную цену за рубежом вместо конкуренции по объёму."}},
       {sp:{az:"Nazir",en:"Minister",ru:"Министр"}, r:{az:"Kənd təsərrüfatı naziri",en:"Minister of Agriculture",ru:"Министр сельского хозяйства"}, x:{az:"Fındıq keyfiyyəti və qurutma proqramını bu mövsüm maliyyələşdirin — Aİ kanalını qorumaq müzakirə mövzusu deyil. Şərab CG çərçivəsini isə İqtisadiyyat və standartlaşdırma qurumu ilə irəli aparın. Azərbaycan fındığını və şərablarını birlikdə brendləşdirməliyik.",en:"Fund the hazelnut quality and drying programme this season — protecting the EU channel is non-negotiable. And take the wine GI framework forward with Economy and the standards body. We should brand Azerbaijani hazelnuts and wines together.",ru:"Профинансируйте программу качества и сушки фундука в этом сезоне — защита канала ЕС не обсуждается. А рамочную систему ГУ для вина продвигайте вместе с Минэкономики и органом по стандартам. Мы должны брендировать азербайджанский фундук и вина вместе."}},
       {sp:"Nigar Əliyeva", r:{az:"İxracın təşviqi",en:"Export Promotion",ru:"Продвижение экспорта"}, x:{az:"Ticarət sərgilərində əlaqələndirilmiş fındıq-və-şərab hekayəsi yaxşı təsir bağışlayar. Alıcılar izlənə bilən mənşəyə müsbət reaksiya verir və hər iki sektor eyni premium mövqedən faydalanır.",en:"A coordinated hazelnut-and-wine story at the trade fairs would land well. Buyers respond to a traceable origin, and both sectors benefit from the same premium positioning.",ru:"Скоординированная история фундука и вина на торговых ярмарках была бы воспринята хорошо. Покупатели откликаются на отслеживаемое происхождение, и оба сектора выигрывают от одного и того же премиального позиционирования."}}],
     analysis:{
       actions:[
         {az:"Aİ-də aflatoksin imtinalarını azaltmaq üçün Zaqatala–Qax zolağında fındıq qurutma və keyfiyyət proqramını maliyyələşdirmək.",en:"Fund a hazelnut drying and quality programme in the Zaqatala–Qax belt to cut EU aflatoxin rejections.",ru:"Профинансировать программу сушки и качества фундука в поясе Загатала–Гах для сокращения отказов из-за афлатоксина в ЕС."},
         {az:"Azərbaycan şərabı üçün coğrafi göstərici (CG) çərçivəsini İqtisadiyyat və standartlaşdırma qurumları ilə irəli aparmaq.",en:"Advance a geographic-indication (GI) framework for Azerbaijani wine with Economy and standards bodies.",ru:"Продвинуть рамочную систему географического указания (ГУ) для азербайджанского вина совместно с Минэкономики и органами по стандартам."},
         {az:"İxrac ticarət sərgilərində əlaqələndirilmiş fındıq-və-şərab premium brendinq təşəbbüsünü başlatmaq.",en:"Launch a coordinated hazelnut-and-wine premium branding push at export trade fairs.",ru:"Запустить скоординированную кампанию премиального брендинга фундука и вина на экспортных торговых ярмарках."}],
       people:[

    {id:"m10",
     t:{az:"Qarabağ və Şərqi Zəngəzurun aqrar dirçəlişi", en:"Karabakh & East Zangezur agricultural revival", ru:"Аграрное возрождение Карабаха и Восточного Зангезура"},
     dt:"2026-09-09T11:30", end:"12:45", virtual:false,
     loc:{az:"Ağdam aqroparkı", en:"Aghdam agropark", ru:"Агдамский агропарк"},
     tags:["karabakh","irrigation"],
     imp:true, urg:false, readiness:"medium", delegate:"Vüqar Səmədli",
     aisum:{az:"Qarabağ və Şərqi Zəngəzurun aqrar dirçəlişi suvarma və torpaq bölgüsü ilə irəliləyir; infrastruktur ardıcıllığı vacibdir.",en:"The agrarian revival of Karabakh and East Zangezur advances via irrigation and land allocation; infrastructure sequencing is key.",ru:"Аграрное возрождение Карабаха и Восточного Зангезура продвигается через орошение и распределение земли; важна последовательность инфраструктуры."},
     docs:[
       {id:"m10-d1", type:"agenda", fmt:"PDF", pages:2, mod:"2026-09-07",
        t:{az:"Gündəlik — Qarabağ və Şərqi Zəngəzurun aqrar dirçəlişi",en:"Agenda — Karabakh & East Zangezur agricultural revival",ru:"Повестка — аграрное возрождение Карабаха и Восточного Зангезура"},
        body:[{az:"1. Minatəmizləmə vəziyyəti və onun 2027-ci il əkin xəritəsinə təsiri.",en:"1. Demining clearance status and its effect on the 2027 planting map.",ru:"1. Статус разминирования и его влияние на карту посева 2027 года."},
              {az:"2. Sərsəng və yuxarı Araz suvarma şəbəkələrinin bərpası.",en:"2. Restoration of the Sarsang and upper-Aras irrigation networks.",ru:"2. Восстановление Сарсангской и верхнеараксской оросительных сетей."},
              {az:"3. Zəngilan və Ağdamda 'ağıllı kənd' və aqroparkların tətbiqi.",en:"3. 'Smart village' and agropark rollout in Zangilan and Aghdam.",ru:"3. Развёртывание «умного села» и агропарков в Зангилане и Агдаме."},
              {az:"4. Köçlə bağlı fermer dəstəyi və kooperativlərin formalaşması.",en:"4. Resettlement-linked farmer support and cooperative formation.",ru:"4. Поддержка фермеров, связанная с переселением, и формирование кооперативов."}]},
       {id:"m10-d2", type:"report", fmt:"PDF", pages:11, mod:"2026-09-06",
        t:{az:"Azad edilmiş ərazilər: 2027-ci il aqrar yenidən başlanğıc planı",en:"Liberated territories: 2027 agricultural restart plan",ru:"Освобождённые территории: план аграрного перезапуска на 2027 год"},
        body:[{az:"Təmizlənmiş torpaqlar mərhələlərlə əkinə qaytarılır; 2027-ci il üçün əkin xəritəsi birbaşa minatəmizləmə sertifikatlaşdırmasından asılıdır.",en:"Cleared land is being returned to cultivation in phases; the planting map for 2027 depends directly on demining certification.",ru:"Очищенные земли поэтапно возвращаются в оборот; карта посева на 2027 год напрямую зависит от сертификации разминирования."},
              {az:"Sərsəng su anbarının komanda sahəsini və yuxarı Araz kanallarını bərpa etmək taxıl, yem və bağların genişmiqyaslı yenidən başlanması üçün ilkin şərtdir.",en:"Rehabilitating the Sarsang reservoir command area and upper-Aras canals is the precondition for grain, fodder and orchard restart at scale.",ru:"Восстановление командной зоны Сарсангского водохранилища и верхнеараксских каналов — предварительное условие для масштабного перезапуска зерна, кормов и садов."},
              {az:"Zəngilandakı 'ağıllı kənd' modeli və Ağdam aqroparkı qayıdan fermerlər üçün mexanikləşdirilmiş, rəqəmsal izlənən istehsalın dayaq nöqtəsi olmalıdır.",en:"The 'smart village' model in Zangilan and the Aghdam agropark should anchor mechanised, digitally-monitored production for returning farmers.",ru:"Модель «умного села» в Зангилане и Агдамский агропарк должны стать опорой механизированного, цифрово контролируемого производства для возвращающихся фермеров."}]},
       {id:"m10-d3", type:"memo", fmt:"DOCX", pages:4, mod:"2026-09-05",
        t:{az:"Köçlə bağlı fermer dəstəyi sxemi",en:"Resettlement-linked farmer support scheme",ru:"Схема поддержки фермеров, связанная с переселением"},
        body:[{az:"Qayıdan fermerlərə ilk gündən giriş paketləri, texnikaya çıxış və kooperativ strukturları lazımdır.",en:"Returning farmers need input packages, machinery access and cooperative structures from day one.",ru:"Возвращающимся фермерам с первого дня нужны пакеты ресурсов, доступ к технике и кооперативные структуры."},
              {az:"Dəstək köç təqvimi ilə bağlanmalıdır ki, təmizlənmədən sonra torpaq boş qalmasın.",en:"Support should be tied to the resettlement calendar so land does not sit idle after clearance.",ru:"Поддержку следует привязать к календарю переселения, чтобы после разминирования земля не простаивала."},
              {az:"Bu memo nümayiş məqsədli məlumatdır.",en:"This memo is demonstration data.",ru:"Эта записка является демонстрационными данными."}]}],
     attendees:[
       {n:"Vüqar Səmədli", r:{az:"Qarabağ və Şərqi Zəngəzur Aqrar İnkişaf koordinatoru",en:"Coordinator, Karabakh & East Zangezur Agrarian Development",ru:"Координатор аграрного развития Карабаха и Восточного Зангезура"}},
       {n:"Rəşad Məmmədov", r:{az:"Nazir müavini (su təsərrüfatı)",en:"Deputy Minister (Water)",ru:"Заместитель министра (водные ресурсы)"}},
       {n:"Fərid Nəbiyev", r:{az:"Torpaq İslahatı şöbəsinin rəhbəri",en:"Head of Land Reform",ru:"Начальник отдела земельной реформы"}}],
     transcript:[
       {sp:"Vüqar Səmədli", r:{az:"Qarabağ İnkişafı",en:"Karabakh Development",ru:"Развитие Карабаха"}, x:{az:"Minatəmizləmə sertifikatlaşdırıldıqca torpaqlar mərhələlərlə əkinə qaytarılır. 2027-ci il əkin xəritəmiz həmin təmizləmə qrafikindən asılıdır, ona görə də ərazilər sərbəst buraxıldıqca rayon-rayon planlaşdırmalıyıq.",en:"Land is being returned to cultivation in phases as demining is certified. Our 2027 planting map depends on that clearance schedule, so we must plan district by district as areas are released.",ru:"По мере сертификации разминирования земли поэтапно возвращаются в оборот. Наша карта посева на 2027 год зависит от этого графика очистки, поэтому мы должны планировать район за районом по мере высвобождения территорий."}},
       {sp:"Rəşad Məmmədov", r:{az:"Nazir müavini",en:"Deputy Minister",ru:"Заместитель министра"}, x:{az:"Susuz heç nə alınmır. Əvvəlcə Sərsəng komanda sahəsini və yuxarı Araz kanallarını bərpa etmək lazımdır, əks halda taxıl və bağların yenidən başlanması dayanır.",en:"None of it works without water. Restoring the Sarsang command area and the upper-Aras canals has to come first, or the grain and orchard restart stalls.",ru:"Без воды ничего не работает. Сначала нужно восстановить командную зону Сарсанга и верхнеараксские каналы, иначе перезапуск зерна и садов застопорится."}},
       {sp:{az:"Nazir",en:"Minister",ru:"Министр"}, r:{az:"Kənd təsərrüfatı naziri",en:"Minister of Agriculture",ru:"Министр сельского хозяйства"}, x:{az:"Ardıcıllığı düzgün qurun: əvvəlcə su infrastrukturu, sonra minatəmizləmə sertifikatlaşdırmasına bağlı əkin xəritəsi. İstehsalı Ağdam aqroparkı və Zəngilan ağıllı kəndi üzərində dayaqlandırın və qayıdan fermerlərin ilk mövsümdən giriş paketləri və kooperativlər əldə etməsini təmin edin.",en:"Sequence it properly: water infrastructure first, then the planting map tied to demining certification. Anchor production on the Aghdam agropark and the Zangilan smart village, and make sure returning farmers get input packages and cooperatives from the first season.",ru:"Выстройте последовательность правильно: сначала водная инфраструктура, затем карта посева, привязанная к сертификации разминирования. Опирайте производство на Агдамский агропарк и Зангиланское умное село и обеспечьте, чтобы возвращающиеся фермеры получили пакеты ресурсов и кооперативы с первого сезона."}},
       {sp:"Fərid Nəbiyev", r:{az:"Torpaq islahatı",en:"Land Reform",ru:"Земельная реформа"}, x:{az:"Qaytarılan sahələri təmizləndikcə kadastrda qeydə alacağıq ki, mülkiyyət və dəstək əvvəldən bağlansın. Bu, sonradan mübahisələrin qarşısını alır və subsidiyaların rahat axmasına imkan verir.",en:"We will register the returned parcels in the cadastre as they clear, so ownership and support are linked from the start. That prevents disputes later and lets subsidies flow cleanly.",ru:"Мы будем регистрировать возвращённые участки в кадастре по мере их очистки, чтобы собственность и поддержка были связаны с самого начала. Это предотвращает споры в дальнейшем и позволяет субсидиям поступать без сбоев."}}],
     analysis:{
       actions:[
         {az:"2027-ci il əkin xəritəsini rayon-rayon minatəmizləmə sertifikatlaşdırma qrafikinə uyğunlaşdırmaq.",en:"Sequence the 2027 planting map to the demining certification schedule, district by district.",ru:"Согласовать карту посева 2027 года с графиком сертификации разминирования, район за районом."},
         {az:"Sərsəng komanda sahəsinin və yuxarı Araz suvarma kanallarının bərpasını prioritetləşdirmək.",en:"Prioritise restoration of the Sarsang command area and upper-Aras irrigation canals.",ru:"Приоритизировать восстановление командной зоны Сарсанга и верхнеараксских оросительных каналов."},
         {az:"Yenidən başlanğıcı Ağdam aqroparkı və Zəngilan ağıllı kəndi üzərində, fermer giriş paketləri və kooperativlərlə dayaqlandırmaq.",en:"Anchor the restart on the Aghdam agropark and Zangilan smart village, with farmer input packages and cooperatives.",ru:"Опереть перезапуск на Агдамский агропарк и Зангиланское умное село, с пакетами ресурсов для фермеров и кооперативами."}],
       people:[
         {n:"Vüqar Səmədli", r:{az:"Qarabağ və Şərqi Zəngəzur Aqrar İnkişaf koordinatoru",en:"Coordinator, Karabakh & East Zangezur Agrarian Development",ru:"Координатор аграрного развития Карабаха и Восточного Зангезура"}, o:{az:"Mərhələli yenidən başlanğıca və aqropark dayaqlanmasına cavabdehdir.",en:"Owns the phased restart and agropark anchoring.",ru:"Отвечает за поэтапный перезапуск и опору на агропарк."}},
         {n:"Rəşad Məmmədov", r:{az:"Nazir müavini (su təsərrüfatı)",en:"Deputy Minister (Water)",ru:"Заместитель министра (водные ресурсы)"}, o:{az:"Suvarma şəbəkəsinin bərpasına cavabdehdir.",en:"Owns irrigation-network restoration.",ru:"Отвечает за восстановление оросительной сети."}},
         {n:"Fərid Nəbiyev", r:{az:"Torpaq İslahatı şöbəsinin rəhbəri",en:"Head of Land Reform",ru:"Начальник отдела земельной реформы"}, o:{az:"Qaytarılan sahələrin kadastrda qeydiyyatına cavabdehdir.",en:"Owns cadastre registration of returned parcels.",ru:"Отвечает за кадастровую регистрацию возвращённых участков."}}],
       topics:["karabakh","irrigation","agropark"]}},

    {id:"m11",
     t:{az:"Aqroparklar, kooperativlər və ərzaq ehtiyatları", en:"Agroparks, cooperatives & food reserves", ru:"Агропарки, кооперативы и продовольственные резервы"},
     dt:"2026-09-10T10:00", end:"11:15", virtual:false,
     loc:{az:"Nazirlik, Bakı", en:"Ministry HQ, Baku", ru:"Министерство, Баку"},
     tags:["agropark","foodsec"],
     imp:true, urg:true, readiness:"low", delegate:"Samir Tağıyev",
     aisum:{az:"Aqroparklar, kooperativlər və ərzaq ehtiyatları üzrə koordinasiya tələb olunur; strateji ehtiyat həcmləri təsdiqlənməlidir.",en:"Coordination is needed across agroparks, cooperatives and food reserves; strategic-reserve volumes should be confirmed.",ru:"Требуется координация по агропаркам, кооперативам и продовольственным резервам; следует подтвердить объёмы стратегического резерва."},
     docs:[
       {id:"m11-d1", type:"agenda", fmt:"PDF", pages:1, mod:"2026-09-08",
        t:{az:"Gündəlik — aqroparklar, kooperativlər və ərzaq ehtiyatları",en:"Agenda — agroparks, cooperatives & food reserves",ru:"Повестка — агропарки, кооперативы и продовольственные резервы"},
        body:[{az:"1. Aqropark doluluğu və soyuducu anbar tutumu (Aqroparklar və İnvestisiya).",en:"1. Agropark occupancy and cold-storage capacity (Agroparks & Investment).",ru:"1. Заполняемость агропарков и мощности холодильного хранения (Агропарки и инвестиции)."},
              {az:"2. Kiçik təsərrüfatların təklifini birləşdirmək üçün kooperativlərin yaradılması.",en:"2. Cooperative formation to aggregate smallholder supply.",ru:"2. Формирование кооперативов для агрегирования поставок мелких хозяйств."},
              {az:"3. Taxıl, yağ və şəkər üzrə strateji ərzaq ehtiyatının kafiliyi.",en:"3. Strategic food-reserve adequacy for grain, oil and sugar.",ru:"3. Достаточность стратегического продовольственного резерва по зерну, маслу и сахару."},
              {az:"4. Aqroparkların strateji ehtiyata və ixrac logistikasına bağlanması.",en:"4. Linking agroparks to the strategic reserve and export logistics.",ru:"4. Привязка агропарков к стратегическому резерву и экспортной логистике."}]},
       {id:"m11-d2", type:"report", fmt:"PDF", pages:9, mod:"2026-09-07",
        t:{az:"Ərzaq təhlükəsizliyi: strateji ehtiyat və anbar kafiliyi",en:"Food security: strategic reserve & storage adequacy",ru:"Продовольственная безопасность: стратегический резерв и достаточность хранения"},
        body:[{az:"Taxıl, bitki yağı və şəkər üzrə strateji ehtiyatlar qiymət şoklarına və idxal pozuntularına qarşı dayaqdır.",en:"Strategic reserves for grain, vegetable oil and sugar are the backstop against price shocks and import disruption.",ru:"Стратегические резервы зерна, растительного масла и сахара — это опора против ценовых шоков и сбоев импорта."},
              {az:"Aqroparklarda soyuducu anbar və müasir saxlanc yığımdan sonrakı itkiləri azaldır və mövsümi qiymət tərəddüdlərini yumşaldır.",en:"Cold-storage and modern warehousing at the agroparks reduce post-harvest loss and smooth seasonal price swings.",ru:"Холодильное хранение и современные склады в агропарках сокращают послеуборочные потери и сглаживают сезонные колебания цен."},
              {az:"Tövsiyə: minimum ehtiyat örtüyü hədəflərini aylarla müəyyən etmək və aqropark anbar tikintisini onlara uyğunlaşdırmaq.",en:"Recommendation: set minimum reserve-cover targets in months and align agropark storage build-out to them.",ru:"Рекомендация: установить минимальные целевые показатели покрытия резервом в месяцах и согласовать строительство складов агропарков с ними."}]},
       {id:"m11-d3", type:"stats", fmt:"XLSX", size:"221 KB", mod:"2026-09-06",
        t:{az:"Aqropark doluluğu və ehtiyat örtüyü (verilənlər bazası)",en:"Agropark occupancy & reserve cover (dataset)",ru:"Заполняемость агропарков и покрытие резервом (набор данных)"},
        body:[{az:"1-ci vərəq — Obyektlər üzrə aqropark doluluğu və soyuducu anbar tutumu.",en:"Worksheet 1 — Agropark occupancy and cold-storage capacity by site.",ru:"Лист 1 — Заполняемость агропарков и мощности холодильного хранения по объектам."},
              {az:"2-ci vərəq — Məhsullar üzrə strateji ehtiyat örtüyü (ay).",en:"Worksheet 2 — Strategic reserve cover (months) by commodity.",ru:"Лист 2 — Покрытие стратегическим резервом (месяцы) по товарам."},
              {az:"3-cü vərəq — Müasir anbar olmaqla və olmadan yığımdan sonrakı itki qiymətləndirmələri.",en:"Worksheet 3 — Post-harvest loss estimates with and without modern storage.",ru:"Лист 3 — Оценки послеуборочных потерь с современным хранением и без него."}]}],
     attendees:[
       {n:"Samir Tağıyev", r:{az:"Aqroparklar və İnvestisiya şöbəsinin rəhbəri",en:"Head of Agroparks & Investment",ru:"Начальник отдела агропарков и инвестиций"}},
       {n:"Aygün Hüseynova", r:{az:"Subsidiya Departamentinin rəhbəri",en:"Head of Subsidy Department",ru:"Начальник Департамента субсидий"}},
       {n:"Elçin Qasımov", r:{az:"Dövlət Taxıl Fondunun direktoru",en:"Director, State Grain Fund",ru:"Директор Государственного зернового фонда"}}],
     transcript:[
       {sp:"Samir Tağıyev", r:{az:"Aqroparklar və İnvestisiya",en:"Agroparks & Investment",ru:"Агропарки и инвестиции"}, x:{az:"Aqropark doluluğu artır, lakin soyuducu anbar tutumu məhdudiyyətdir. Müasir saxlanc olmadan yığımdan sonra məhsul itiririk və qeyri-mövsümdə qiymətlər kəskin tərəddüd edir.",en:"Agropark occupancy is rising, but cold-storage capacity is the constraint. Without modern warehousing we lose product after harvest and prices swing hard in the off-season.",ru:"Заполняемость агропарков растёт, но мощности холодильного хранения — ограничение. Без современных складов мы теряем продукцию после уборки, и цены сильно колеблются в межсезонье."}},
       {sp:"Elçin Qasımov", r:{az:"Dövlət Taxıl Fondu",en:"State Grain Fund",ru:"Государственный зерновой фонд"}, x:{az:"Ərzaq təhlükəsizliyi baxımından taxıl, yağ və şəkər üzrə strateji ehtiyatlarımız əsl dayaqdır. Aylarla razılaşdırılmış minimum ehtiyat örtüyü hədəfləri istəyirəm ki, qiymətlərə reaksiya vermək əvəzinə aydın qaydaya əsasən satınalma aparaq.",en:"On food security, our strategic reserves for grain, oil and sugar are the real backstop. I would like agreed minimum reserve-cover targets, in months, so we procure against a clear rule rather than reacting to prices.",ru:"С точки зрения продовольственной безопасности наши стратегические резервы зерна, масла и сахара — настоящая опора. Я хотел бы согласованные минимальные целевые показатели покрытия резервом в месяцах, чтобы мы закупали по чёткому правилу, а не реагировали на цены."}},

const tx = o => (o == null ? '' : (typeof o === 'string' ? o : (o[LG] || o.en || o.az || '')));
const nf = (v, d = 0) => (v == null || isNaN(v) ? '—' : Number(v).toLocaleString(LG === 'ru' ? 'ru-RU' : (LG === 'az' ? 'az-AZ' : 'en-GB'), {minimumFractionDigits: d, maximumFractionDigits: d}));
const sgn = v => (v > 0 ? '+' : '') + nf(v, Math.abs(v) < 10 ? 2 : 1) + '%';

const arrow = v => (v == null ? '' : (v > 0.05 ? '▲ ' : (v < -0.05 ? '▼ ' : '► ')));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dfmt = s => {
  const d = new Date(s + 'T00:00:00');
  const mo = {az:['yan','fev','mar','apr','may','iyn','iyl','avq','sen','okt','noy','dek'],
              en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
              ru:['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек']}[LG];
  return d.getDate() + ' ' + mo[d.getMonth()] + ' ' + d.getFullYear();
};

function applyStatic(){
  document.documentElement.lang = LG;
  document.querySelectorAll('[data-i18n]').forEach(e => {
    const v = T(e.dataset.i18n);
    if (/<[a-z]/i.test(v)) e.innerHTML = v; else e.textContent = v;
  });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === LG));
  document.getElementById('pgTitle').textContent = pgTitleFor(PAGE);
  document.getElementById('q').placeholder = T('askPlaceholder');
  document.getElementById('navBtn').setAttribute('aria-label', T('navMenu'));
  document.getElementById('fver').textContent = 'v' + F.meta.version + ' · ' + F.meta.synced.slice(0,10);
  document.getElementById('nb').textContent = F.news.length;
  document.getElementById('db').textContent = F.decisions.length;
}
function pgTitleFor(p){
  if (p && p.indexOf('uc-') === 0){
    const d = ucById(p.slice(3));
    if (d) return tx(d.t);
  }
  if (p && p.indexOf('mtg-') === 0){
    const m = mtgById(p.slice(4));
    if (m) return tx(m.t);
  }
  const m = {hub:'pgHub',b1:'b1Title',b2:'b2Title',b3:'b3Title',prio:'prioMatrixH',
    overview:'pgOverview',economy:'pgEconomy',markets:'pgMarkets',cropmap:'pgCropMap',
    news:'pgNews',ai:'pgAI',decisions:'pgDecisions',simulator:'pgSim',usecases:'pgUseCases',
    calendar:'pgCalendar',meetings:'pgMeetings',kanban:'pgKanban'};
  return T(m[p] || 'pgOverview');
}
function go(p){
  PAGE = p;
  const isHub = (p === 'hub');
  /* Entry chooser is a standalone full-screen screen: hide the dashboard chrome. */
  document.body.classList.toggle('hub-mode', isHub);
  /* Scope the sidebar to the selected bucket while inside the dashboard. */
  if (!isHub){
    const bk = bucketOf(p);
    if (bk) BUCKET = bk;
  }
  applyBucketScope(isHub ? null : BUCKET);
  document.querySelectorAll('.page').forEach(s => s.classList.toggle('on', s.id === 'p-' + p));
  document.querySelectorAll('.nv[data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === p));
  /* keep the meetings entry active while inside a meeting detail page */
  if (p.indexOf('mtg-') === 0){
    const mb = document.querySelector('.nv[data-go="meetings"]');
    if (mb) mb.classList.add('on');
  }
  /* keep the bucket sub-hub entry active while inside its prioritisation deep-dive */
  if (p === 'prio'){
    const hb = document.querySelector('.nv[data-go="b1"]');
    if (hb) hb.classList.add('on');
  }
  document.getElementById('pgTitle').textContent = pgTitleFor(p);
  /* keep the use-case group expanded while the reader is inside it */
  const inUc = p === 'usecases' || p.indexOf('uc-') === 0;
  document.getElementById('ucNav').classList.toggle('open', inUc);
  document.getElementById('ucToggle').classList.toggle('open', inUc);
  document.body.classList.remove('nav-on');   /* close the mobile drawer */
  window.scrollTo({top:0, behavior:'smooth'});
  if (p.indexOf('uc-') === 0) requestAnimationFrame(egInvalidate);
  setTimeout(() => {
    if (p === 'cropmap' && MAP) MAP.invalidateSize();
    if (p.indexOf('uc-') === 0) egInvalidate();
    Object.values(CH).forEach(c => { try{ c.resize(); }catch(e){} });
  }, 130);
}

function kpiCard(k, lb){
  const sev = k.sev ? ' ' + k.sev : '';
  const dl = k.d == null ? '' :
    `<span class="dl ${dcl(k.d)}">${arrow(k.d)}${sgn(k.d)}</span>${k.dt ? ' <span style="font-size:10px">' + esc(k.dt) + '</span>' : ''}`;
  const note = k.note ? `<div style="font-size:10.5px;color:var(--ink-2);margin-top:3px">${esc(tx(k.note))}</div>` : '';
  return `<div class="kpi${sev}">
    <div class="lb">${esc(lb)}</div>
    <div class="vl">${esc(k.val)} <small>${esc(tx(k.unit))}</small></div>
    <div class="mt">${dl}<span>${esc(tx(k.per))}</span></div>
    ${note}
    <div class="src">${esc(tx(k.src))}</div></div>`;
}
